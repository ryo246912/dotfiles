min_version = "2026.9.2"

[settings]
auto_install = false
experimental = true

[task_config]
includes = ["tasks/*.toml"]

[tools]
"aqua:awslabs/git-secrets"       = "1.3.0"
"aqua:evilmartians/lefthook"     = "2.1.10"
"aqua:rhysd/actionlint"          = "1.7.12"
"aqua:secretlint/secretlint"     = "13.0.5"
"aqua:suzuki-shunsuke/ghalint"   = "1.5.6"
"aqua:suzuki-shunsuke/pinact"    = "4.1.1"
"aqua:tamasfe/taplo"             = "0.10.0"
"aqua:zizmorcore/zizmor"         = "1.28.0"
"github:betterleaks/betterleaks" = "1.3.1"
"github:superfly/flyctl"         = "0.4.29"
"npm:oxfmt"                      = "0.59.0"
"npm:oxlint"                     = "1.76.0"

[hooks]
postinstall = """
command -v lefthook >/dev/null 2>&1 || exit 0
[ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = "true" ] || exit 0
lefthook install
"""

[[watch_files]]
patterns = ["lefthook.yml"]
run      = "lefthook install"

# `mise bootstrap` は必ずこのリポジトリの checkout ルートで実行すること
# （hook 内は相対パス・$(pwd) 前提。$MISE_PROJECT_ROOT はフックの中では未設定）。
#
# min_version を満たす self-update は hook にはできない。mise は min_version 未満だと
# config の読み込み自体を拒否するため、hook（config の一部）まで到達できない。
# 初回は `mise.run` インストーラが常に最新版を入れるため問題にならず、2回目以降は
# `lefthook.yml` の `post-merge` フック（mise.toml 変更時のみ発火）が self-update する
# ので、`mise bootstrap` の外側で明示的に済ませる手順は不要になった（docs/setup.md 参照）。
#
# 同様の理由で、[bootstrap.packages] は dotfiles フェーズで初めて
# `~/.config/mise/config.mac.toml` 等として配置されるが、packages フェーズは
# `mise bootstrap` プロセス起動時に一度だけ読み込んだ config を使うため、
# 同一プロセス内で dotfiles → packages の順に反映されることはない（実機で確認済み）。
# そのため `mise bootstrap dotfiles apply` を独立した先行コマンドとして実行し、
# 生成された global config を新しいプロセスの `mise bootstrap` に読ませる
# 2段階の運用にしている（docs/setup.md 参照）。
#
# 0) pre-dotfiles: track mode（後述）は「target に既にあるものを追跡する」だけで
#    source から初回配置する仕組みを持たないため、config/（共通）と config-mac|linux/
#    （OS限定で残った raycast・autohotkey のみ）から ~/.config へ「無いものだけ」コピーする
#    一度きりの seed をここで行う。rsync 等の外部ツールに依存せず find+cp のみで書く
#    （最初の bootstrap 時点ではまだ何もインストールされていない前提のため）。
#    2回目以降は対象ファイルが既に存在するため実質no-opになる。
#
#    より宣言的な代替手段は無い（公式ドキュメントで確認済み）:
#    - [dotfiles] の track mode は "Track entries cannot contain source, content,
#      exclude, or manifest." （dotfiles.html）と明記されており、source からの
#      初回配置手段を一切持たない設計。
#    - [dotfiles] の copy/template/symlink mode は1ターゲットパス=1ソースの宣言で、
#      「無ければ配置・あれば触らない」という条件分岐を持たない
#      （apply は既存ターゲットを常に source へ収束＝上書きする。
#      dotfiles.html#start-with-one-managed-file 参照）。
#    - [bootstrap.files]/[bootstrap.directories] は絶対パスをファイル単位で宣言する
#      root 権限向けの仕組みで、ディレクトリツリー一括かつ「無ければ作る」ではなく
#      常に内容を収束（=上書き）させる（bootstrap/files.html 参照）ため、
#      「一度だけ seed して以降は track に委ねる」用途には不向き。
#    以上より、この一度きりの seed は hook 以外に宣言的な書き方が無い。
[bootstrap.hooks.pre-dotfiles]
run = """
set -eu

seed_tree() {
  src_dir="$1"
  dest_dir="$2"
  [ -d "$src_dir" ] || return 0
  # `find | while read` はループ本体がサブシェルで動くため、hook を実行する
  # sh（bash ではなく dash 等）では cp/mkdir の失敗をここで検知できても呼び出し元へ
  # 伝播できない（実機確認済み。process substitution `<(...)` も同様に sh では
  # syntax error になり使えない）。一覧を一時ファイルに落として `< file` で読ませる
  # ことでサブシェルを回避し、set -eu が失敗をそのまま hook 全体の中断として扱う。
  file_list=$(mktemp)
  # set -eu であっても、mkdir/cp が失敗した場合は下の明示的な rm まで到達しないため
  # trap で確実に一時ファイルを消す（成功時は明示的な rm + trap 解除の両方が効く）。
  trap 'rm -f "$file_list"' EXIT
  find "$src_dir" -type f > "$file_list"
  while IFS= read -r src_file; do
    rel_path="${src_file#"$src_dir"/}"
    dest_file="$dest_dir/$rel_path"
    if [ ! -e "$dest_file" ]; then
      mkdir -p "$(dirname "$dest_file")"
      cp -p "$src_file" "$dest_file"
    fi
  done < "$file_list"
  rm -f "$file_list"
  trap - EXIT
}

seed_tree "$(pwd)/config" "$HOME/.config"
if [ "$(uname)" = "Darwin" ]; then
  seed_tree "$(pwd)/config-mac/raycast" "$HOME/.config/raycast"
else
  seed_tree "$(pwd)/config-linux/autohotkey" "$HOME/.config/autohotkey"
fi
"""

# 1) post-dotfiles: `mise bootstrap dotfiles apply` の直後に発火する（フル bootstrap
#    だけでなく、`mise bootstrap dotfiles apply` 単体実行時にも発火することを実機確認済み。
#    docs/mise.md 参照）。git pull → `mise bootstrap dotfiles apply`（lefthook の
#    post-merge で自動実行。lefthook.yml 参照）という日常的な更新フローで、chezmoi の
#    run_onchange 相当として apm/rulesync を自動同期させたいのはここ。
#    ただし apm/rulesync 自体は mise の [tools] 管理ツールで、フルの `mise bootstrap`
#    （真新しいマシン等）ではこの時点ではまだ導入されていない可能性がある
#    （[tools] フェーズはこの後の pre-tools/tools/post-tools）。そのため両方とも
#    既に導入済み（`mise which` で解決できる）場合だけ実行し、未導入なら黙ってスキップする
#    （その場合は後続の post-tools 側で改めて実行される）。
#
#    `sync:agents`/`apm:install`/`rulesync:generate` は config/mise/tasks/dev.toml
#    （deploy先: ~/.config/mise/tasks/dev.toml、global scope）で定義したタスクだが、
#    この hook は必ずこのリポジトリの checkout ルート（project config root）で実行される
#    ため、素の `mise run sync:agents` では見つからない（実機確認済み）。mise の
#    `[task_config].includes` は config root ごとのスコープで、project 側が自分の
#    `includes = ["tasks/*.toml"]` を宣言していると、global 側の includes は
#    継承されない（cascade しても descendant 側の同名フィールドで上書きされるため。
#    tasks/task-configuration.html#task_config.cascade 参照）。
#    `mise --cd "$HOME" run ...` で呼び出し時の config root を global 側に切り替えることで
#    回避する（nested な `mise run apm:install`/`mise run rulesync:generate` 呼び出しは
#    タスクスクリプト自身の実行コンテキストを引き継ぐため、そちら側で改めて --cd し直す
#    必要はないことを実機確認済み）。
[bootstrap.hooks.post-dotfiles]
run = """
if mise which apm >/dev/null 2>&1 && mise which rulesync >/dev/null 2>&1; then
  mise --cd "$HOME" run sync:agents
fi
"""

# 2) pre-tools: [tools] フェーズ（native の step 15. `mise install` 相当）の前に
#    gh を導入・認証し、GITHUB_TOKEN 付きで明示的に mise install する。
#
#    - なぜ `mise install` 単体では pre-tools が動かないのか:
#      hook は "Hooks run only during explicit `mise bootstrap` invocations."
#      （bootstrap.html#hooks）と明記されており、`mise install` 単体・`mise bootstrap
#      packages` は dotfiles/hooks を一切経由しない別コマンド。これは仕様通りで
#      バグではない。gh 認証や GITHUB_TOKEN 付き install が必要な場合は必ず
#      `mise bootstrap` 経由で実行すること（docs/setup.md 参照）。
#    - なぜ native の tools フェーズに素通しできないのか（`mise install` を2回
#      呼んでいる理由）: hook は "Hooks run in the current process environment"
#      （bootstrap.html#hooks）だが、これは hook 自身が親プロセスの env を引き継ぐ
#      という意味であり、hook 内で export した変数が親（native の tools フェーズ）
#      へ逆伝播するわけではない（hook は子シェルプロセスであり、POSIX の
#      プロセスモデル上、子から親の環境変数は書き換えられない）。そのため
#      GITHUB_TOKEN を必要な install に確実に渡すには、この hook 内で明示的に
#      `GITHUB_TOKEN=... mise install` を呼ぶ以外の方法が無い。
#      結果として native の step 15（`mise install installs missing [tools]`、
#      bootstrap.html 参照）がこの直後にもう一度走り、`mise install` は
#      1 bootstrap あたり実質2回実行されるが、その時点では全ツール導入済みなので
#      2回目は差分ゼロの冪等チェックのみで即座に完了する（ダウンロード等の
#      実処理は発生しない）。これは意図した挙動であり、削減する手段は無い。
[bootstrap.hooks.pre-tools]
run = """
if [ "$(uname)" = "Darwin" ]; then
  export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:/opt/homebrew/bin:$PATH"
else
  export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
fi
mise install --jobs=1 aqua:cli/cli || true
if ! gh auth token >/dev/null 2>&1; then
  gh auth login --scopes 'project' || true
fi
github_token=$(gh auth token 2>/dev/null || true)
if [ -z "$github_token" ]; then
  echo "error: gh 未ログインのため中断します。'gh auth login --scopes project' 後に再度 'mise bootstrap' を実行してください" >&2
  exit 1
fi
echo "Running mise install..."
GITHUB_TOKEN=$github_token mise install --jobs=2
"""

# 3) post-tools: [tools] フェーズ直後（apm/rulesync が必要とするツールの導入完了後）に
#    確実に同期する。post-dotfiles 側で未導入のためスキップされた場合（真新しいマシン等）
#    はここで初めて実行される。post-dotfiles で既に実行済みの場合はハッシュマーカーが
#    更新済みなので、ここでの再実行は差分ゼロの no-op になる（sync:agents 参照）。
#    `--cd "$HOME"` が必要な理由は post-dotfiles のコメント参照。
[bootstrap.hooks.post-tools]
run = 'mise --cd "$HOME" run sync:agents'

# "~/.config" 自体は track mode（config/mise/config.toml 側で宣言。track は global
# config からしか有効にならない実機仕様のため）。"~/.config/mise" だけは常に git 側の
# 内容へ収束させたいツール設定なので、ここで個別に copy として残す
# （"~/.config" と "~/.config/mise" はキーが異なるため上書きし合わず共存できる。
# 実機で「track の対象木の中に、より具体的なキーの copy entry が入れ子になっても
# 破壊的な干渉なく共存する」ことを確認済み）。
[dotfiles]
"~/.apm"                                = { source = "apm", mode = "copy" }
"~/.claude"                             = { source = "claude", mode = "copy" }
"~/.codex"                              = { source = "codex", mode = "copy" }
"~/.config/alacritty/alacritty.toml"    = { source = "templates/alacritty/alacritty.toml.tera", mode = "template", template = "tera" }
"~/.config/ghostty/config"              = { source = "templates/ghostty/config.tera", mode = "template", template = "tera" }
"~/.config/git/config"                  = { source = "templates/git/config.tera", mode = "template", template = "tera" }
"~/.config/mise"                        = { source = "config/mise", mode = "copy" }
"~/.config/rio/config.toml"             = { source = "templates/rio/config.toml.tera", mode = "template", template = "tera" }
"~/.config/rulesync/.rulesync/mcp.json" = { source = "templates/rulesync/mcp.json.tera", mode = "template", template = "tera" }
"~/.local"                              = { source = "local", mode = "copy" }
"~/.zshenv"                             = { source = "templates/zsh/.zshenv.tera", mode = "template", template = "tera" }

# ~/.config 全体（"~/.config/mise" を除く）の history 自動保存。track entry 自体は
# config/mise/config.toml（deploy先: ~/.config/mise/config.toml）側で宣言する
# （mise の track mode は project config ではなく global config からのみ有効になる
# 実機仕様のため）。
[bootstrap.services.mise-history]
builtin = "history-watch"
