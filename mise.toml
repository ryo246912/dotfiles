min_version = "2026.9.2"

[settings]
auto_install = false
experimental = true

[task_config]
includes = ["tasks/*.toml"]

[tools]
"aqua:awslabs/git-secrets"       = "1.3.0"
"aqua:evilmartians/lefthook"     = "2.1.10"
"aqua:rhysd/actionlint"          = "1.7.12"
"aqua:secretlint/secretlint"     = "13.0.5"
"aqua:suzuki-shunsuke/ghalint"   = "1.5.6"
"aqua:suzuki-shunsuke/pinact"    = "4.1.1"
"aqua:tamasfe/taplo"             = "0.10.0"
"aqua:zizmorcore/zizmor"         = "1.28.0"
"github:betterleaks/betterleaks" = "1.3.1"
"github:superfly/flyctl"         = "0.4.29"
"npm:oxfmt"                      = "0.59.0"
"npm:oxlint"                     = "1.76.0"

[hooks]
postinstall = """
command -v lefthook >/dev/null 2>&1 || exit 0
[ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = "true" ] || exit 0
lefthook install
"""

[[watch_files]]
patterns = ["lefthook.yml"]
run      = "lefthook install"

# `mise bootstrap` は必ずこのリポジトリの checkout ルートで実行すること
# （hook 内は相対パス・$(pwd) 前提。$MISE_PROJECT_ROOT はフックの中では未設定）。
#
# min_version を満たす self-update は hook にはできない。mise は min_version 未満だと
# config の読み込み自体を拒否するため、hook（config の一部）まで到達できない。
# 初回は `mise.run` インストーラが常に最新版を入れるため問題にならず、2回目以降は
# `lefthook.yml` の `post-merge` フック（mise.toml 変更時のみ発火）が self-update する
# ので、`mise bootstrap` の外側で明示的に済ませる手順は不要になった（docs/setup.md 参照）。
#
# 同様の理由で、[bootstrap.packages] は dotfiles フェーズで初めて
# `~/.config/mise/config.mac.toml` 等として配置されるが、packages フェーズは
# `mise bootstrap` プロセス起動時に一度だけ読み込んだ config を使うため、
# 同一プロセス内で dotfiles → packages の順に反映されることはない（実機で確認済み）。
# そのため `mise bootstrap dotfiles apply` を独立した先行コマンドとして実行し、
# 生成された global config を新しいプロセスの `mise bootstrap` に読ませる
# 2段階の運用にしている（docs/setup.md 参照）。
#
# 1) pre-tools: [tools] フェーズ（mise install 相当）の前に gh を導入・認証し、
#    GITHUB_TOKEN 付きで明示的に mise install する。native の tools フェーズは
#    通常サブプロセスへ環境変数を持ち越せないため、GITHUB_TOKEN が要る
#    aqua/github backend のツールはここで先に入れておく（後続の native tools
#    フェーズは全て導入済みとして即座に完了する）。
[bootstrap.hooks.pre-tools]
run = """
if [ "$(uname)" = "Darwin" ]; then
  export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:/opt/homebrew/bin:$PATH"
else
  export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
fi
mise install --jobs=1 aqua:cli/cli || true
if ! gh auth token >/dev/null 2>&1; then
  gh auth login --scopes 'project' || true
fi
github_token=$(gh auth token 2>/dev/null || true)
if [ -z "$github_token" ]; then
  echo "error: gh 未ログインのため中断します。'gh auth login --scopes project' 後に再度 'mise bootstrap' を実行してください" >&2
  exit 1
fi
echo "Running mise install..."
GITHUB_TOKEN=$github_token mise install --jobs=2
"""

# 2) post-tools: APM の user-scope dependencies と rulesync generate を、manifest/lockfile
#    やソースに変更があったときだけ実行する（毎回の bootstrap で skill install・
#    generate-commands が走るのを避けるため、XDG_STATE_HOME 配下のハッシュマーカーで判定）。
#    [tools] フェーズ直後（apm/rulesync が必要とするツールの導入完了後）に実行すれば
#    十分なので、以降のフェーズ（plugin パッケージマネージャ・カスタム bootstrap task）を
#    待つ必要がある final ではなく post-tools で発火する。
[bootstrap.hooks.post-tools]
run = """
state_dir="${XDG_STATE_HOME:-$HOME/.local/state}/mise-dotfiles"
mkdir -p "$state_dir"
source_dir=$(pwd)

hash_cmd() { if command -v sha1sum >/dev/null; then sha1sum; else shasum -a 1; fi; }

calculate_apm_hash() {
  for f in "$HOME/.apm/apm.yml" "$HOME/.apm/apm.lock.yaml"; do
    [ -f "$f" ] && echo "$f $(hash_cmd < "$f")"
  done | hash_cmd
}
apm_hash=$(calculate_apm_hash)
if [ "$(cat "$state_dir/apm-hash" 2>/dev/null)" != "$apm_hash" ]; then
  echo "Running mise run apm:install..."
  if mise run apm:install; then
    calculate_apm_hash > "$state_dir/apm-hash" || exit 1
  else
    exit 1
  fi
else
  echo "APM manifest and lockfile are unchanged; skipping skill installation."
fi

rulesync_hash=$(
  {
    find "$source_dir/.rulesync" "$HOME/.config/rulesync/.rulesync" -type f 2>/dev/null
    for f in "$source_dir/rulesync.jsonc" "$HOME/.config/rulesync/rulesync.jsonc"; do
      [ -f "$f" ] && echo "$f"
    done
  } | sort | while IFS= read -r f; do
    echo "$f $(hash_cmd < "$f")"
  done | hash_cmd
)
if [ "$(cat "$state_dir/rulesync-hash" 2>/dev/null)" != "$rulesync_hash" ]; then
  echo "Running mise run rulesync:generate..."
  if mise run rulesync:generate; then
    if ! printf '%s' "$rulesync_hash" > "$state_dir/rulesync-hash" 2>/dev/null; then
      echo "warning: rulesync-hash マーカーの書き込みに失敗しました（次回 bootstrap で再生成されます）"
    fi
  else
    echo "warning: 'mise run rulesync:generate' に失敗しました。次回 'mise bootstrap' 実行時に再試行します"
  fi
fi
"""

[dotfiles]
"~/.apm"                                = { source = "apm", mode = "copy" }
"~/.claude"                             = { source = "claude", mode = "copy" }
"~/.codex"                              = { source = "codex", mode = "copy" }
"~/.config"                             = { source = "config", mode = "copy" }
"~/.config/alacritty/alacritty.toml"    = { source = "templates/alacritty/alacritty.toml.tera", mode = "template", template = "tera" }
"~/.config/ghostty/config"              = { source = "templates/ghostty/config.tera", mode = "template", template = "tera" }
"~/.config/git/config"                  = { source = "templates/git/config.tera", mode = "template", template = "tera" }
"~/.config/rio/config.toml"             = { source = "templates/rio/config.toml.tera", mode = "template", template = "tera" }
"~/.config/rulesync/.rulesync/mcp.json" = { source = "templates/rulesync/mcp.json.tera", mode = "template", template = "tera" }
"~/.local"                              = { source = "local", mode = "copy" }
"~/.zshenv"                             = { source = "templates/zsh/.zshenv.tera", mode = "template", template = "tera" }
