[settings]
auto_install = false
experimental = true

[task_config]
includes = ["tasks/*.toml"]

[tools]
"aqua:awslabs/git-secrets"       = "1.3.0"
"aqua:evilmartians/lefthook"     = "2.1.14"
"aqua:rhysd/actionlint"          = "1.7.12"
"aqua:secretlint/secretlint"     = "13.0.5"
"aqua:suzuki-shunsuke/ghalint"   = "1.5.6"
"aqua:suzuki-shunsuke/pinact"    = "5.0.0"
"aqua:tamasfe/taplo"             = "0.10.0"
"aqua:zizmorcore/zizmor"         = "1.28.0"
"github:betterleaks/betterleaks" = "1.3.1"
"github:superfly/flyctl"         = "0.4.29"
"npm:oxfmt"                      = "0.59.0"
"npm:oxlint"                     = "1.76.0"

[hooks]
postinstall = """
command -v lefthook >/dev/null 2>&1 || exit 0
[ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" = "true" ] || exit 0
lefthook install
"""

[[watch_files]]
patterns = ["lefthook.yml"]
run      = "lefthook install"

# mise doctor project で「このリポジトリが前提にしている環境」をまとめて検証する。
# 通常の mise doctor や task 実行では走らず、明示的に叩いたときだけ実行される。
[doctor.checks.chezmoi]
description = "chezmoi is installed and initialized"
hint        = "Install tools with `mise install` and initialize chezmoi (see docs/setup.md)."
run         = "chezmoi source-path >/dev/null"
timeout     = "5s"

[doctor.checks.lefthook]
description = "lefthook pre-push hook is installed in this repository"
hint        = "Run `lefthook install` (mise's postinstall hook normally does this on `mise install`)."
run         = 'grep -q lefthook "$(git rev-parse --git-path hooks/pre-push)"'
timeout     = "5s"

[doctor.checks.gh-auth]
description = "gh can issue a token for the lint tasks"
hint        = "Run `gh auth login`. `lint:zizmor` uses `GH_TOKEN=$(gh auth token)` and `lint:pinact` falls back to `ghtkn exec`."
run         = "gh auth token >/dev/null"
timeout     = "10s"

[doctor.checks.git-secrets]
description = "git-secrets has patterns registered in this repository"
hint        = "Run `git secrets --install && git secrets --register-aws`. With no patterns registered, `mise run lint:git-secrets` passes without scanning anything."
run         = "git config --get-all secrets.patterns >/dev/null || git config --get-all secrets.providers >/dev/null"
timeout     = "5s"
