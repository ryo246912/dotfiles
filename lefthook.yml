output:
  - meta
  - summary
  - failure
  - execution_out

post-merge:
  # post-checkout では glob が常に "no files for inspection" で skip されるため、glob で絞り込まない。
  jobs: &sync-jobs
    - name: install-mise (ai-only)
      only: &ai-only
        - run: test -n "${AI_AGENT:-}"
      run: |
        command -v mise >/dev/null 2>&1 || [ -x "$HOME/.local/bin/mise" ] && exit 0
        # Claude Code のクラウド環境では mise.jdx.dev（リリース一覧）が拒否されるため、バージョンを固定して GitHub から取得する。
        MISE_VERSION="$(awk -F'"' '/^min_version/ { print $2; exit }' mise.toml)"
        curl -fsSL https://mise.run | MISE_VERSION="$MISE_VERSION" MISE_INSTALL_FROM_GITHUB=1 sh
    - name: ensure-mise-version
      run: |
        # mise.run は ~/.local/bin に入れるが、AI エージェントの PATH に含まれるとは限らないため明示する。
        PATH="$PATH:$HOME/.local/bin"
        required_mise_version=$(awk -F'"' '/^[[:space:]]*min_version[[:space:]]*=/ { print $2; exit }' mise.toml)
        if [ -z "$required_mise_version" ]; then
          echo "error: mise.toml から min_version を取得できません" >&2
          exit 1
        fi

        current_mise_version=$(MISE_NO_CONFIG=1 mise --version | awk '{print $1}')
        # CalVer（YYYY.M.P）を . 区切りで数値比較する（文字列比較だと "9" > "10" 扱いになり誤判定するため）。
        already_satisfied=$(awk -v cur="$current_mise_version" -v req="$required_mise_version" '
          BEGIN {
            split(cur, c, ".")
            split(req, r, ".")
            for (i = 1; i <= 3; i++) {
              x = (c[i] == "" ? 0 : c[i]) + 0
              y = (r[i] == "" ? 0 : r[i]) + 0
              if (x > y) { print "1"; exit }
              if (x < y) { print "0"; exit }
            }
            print "1"
          }
        ')
        if [ "$already_satisfied" = "1" ]; then
          echo "mise $current_mise_version は min_version $required_mise_version を既に満たしています"
          exit 0
        fi

        echo "Ensuring mise $required_mise_version is installed..."
        if ! MISE_NO_CONFIG=1 mise self-update --yes "$required_mise_version"; then
          cat >&2 <<EOF
        error: 'mise self-update' に失敗しました。
        brew/apt/scoop 等のパッケージマネージャーで導入した mise は self-update を拒否するため
        これが原因の可能性があります。その場合はパッケージマネージャー側で更新してください
        （例: brew upgrade mise / sudo apt update && sudo apt upgrade mise）。
        更新後、min_version ($required_mise_version) 以上になったことを確認してください。
        EOF
          exit 1
        fi
    - name: mise-install (ai-only)
      only: *ai-only
      run: |
        PATH="$PATH:$HOME/.local/bin"
        # Claude Code のクラウド環境の GitHub API はセッションのリポジトリ以外を拒否する。token があると mise は
        # mise.lock の url_api（GitHub API）を使うため、token を外して url（直接ダウンロード）を使わせる。
        if [ "${CLAUDE_CODE_REMOTE:-}" = "true" ]; then
          unset GITHUB_TOKEN GH_TOKEN
        fi
        mise trust --yes && mise install --yes
    - name: dotfiles-apply
      skip: *ai-only
      # `mise bootstrap dotfiles apply` はpre/post-dotfilesフック（APM/rulesync同期を含む）も
      # 実行する。通常のapplyが~/.config全体のprotective checkpointを前後2回作ると数十秒
      # かかるため、この自動applyだけhistoryを無効化する（常駐history-watchと手動save/
      # full bootstrapの履歴は維持される）。ensure-mise-version の後に実行する
      # （min_version を満たした mise で実行するため）。
      run: MISE_HISTORY_ENABLED=0 mise bootstrap dotfiles apply --yes
      # symlink-each へ変えた・新しく登録したエントリ（`~/.config`・`~/.local`・`~/.aws`）は、
      # copy 時代や chezmoi 時代の実ファイルが残っている間だけ conflict で落ちる。force は
      # 自動では付けない（全エントリのライブ編集を巻き込むため）。移行は target を絞って
      # 1回だけ手動で流す（docs/setup.md の手順と同じコマンド）。
      fail_text: '❌ [post-merge] dotfiles apply failed. 既存の実ファイルとの conflict なら: mise bootstrap dotfiles apply --force --yes "~/.config" "~/.local" "~/.aws" （先に配置先だけにある編集を repo へ取り込むこと。docs/mise.md 参照）'
    - name: lefthook-install
      run: lefthook install

post-checkout:
  jobs: *sync-jobs

pre-push:
  jobs:
    - name: stash files
      run: git stash --include-untracked -q -m "lefthook-pre-push"
    - name: lint
      group:
        parallel: true
        jobs:
          - name: lint:toml
            run: mise run lint:toml
            glob: "**/*.toml"
            fail_text: "❌ [pre-push] toml lint failed. Run: mise run fix:toml"
          - name: lint:yaml
            run: mise run lint:yaml
            glob: "**/*.{yaml,yml}"
            fail_text: "❌ [pre-push] yaml lint failed. Run: mise run fix:yaml"
          - name: lint:json
            run: mise run lint:json
            glob: "**/*.json"
            fail_text: "❌ [pre-push] json lint failed. Run: mise run fix:json"
          - name: lint:md
            run: mise run lint:md
            glob: "**/*.md"
            fail_text: "❌ [pre-push] markdown lint failed. Run: mise run fix:md"
          - name: lint:actionlint
            run: mise run lint:actionlint
            glob: ".github/workflows/**/*.{yaml,yml}"
            fail_text: "❌ [pre-push] actionlint failed."
          - name: lint:ghalint
            run: mise run lint:ghalint
            glob: ".github/workflows/**/*.{yaml,yml}"
            fail_text: "❌ [pre-push] ghalint failed."
          - name: lint:zizmor
            run: mise run lint:zizmor
            glob: ".github/workflows/**/*.{yaml,yml}"
            fail_text: "❌ [pre-push] zizmor failed."
          - name: lint:pinact
            run: mise run lint:pinact
            glob: ".github/workflows/**/*.{yaml,yml}"
            fail_text: "❌ [pre-push] pinact check failed. Run: mise run fix:pinact"
    - name: stash pop
      run: |
        if git stash list | grep -q "lefthook-pre-push"; then
          git stash pop --index -q || true
        fi
