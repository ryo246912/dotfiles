<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="pr-reviewer-brief-head" content="{{head_sha}}" />
    <meta name="pr-reviewer-brief-generated" content="{{generated}}" />
    <title>{{title}}</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f6f8fa;
        --text: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --accent: #0969da;
        --added: #1a7f37;
        --removed: #cf222e;
        --warn-bg: #fff8c5;
        --warn-border: #d4a72c;
        --highlight: #ddf4ff;
        --risk-high-bg: #ffebe9;
        --risk-medium: #9a6700;
        --diff-add-bg: #e6ffec;
        --diff-add-ln: #ccffd8;
        --diff-del-bg: #ffebe9;
        --diff-del-ln: #ffd7d5;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1117;
          --surface: #151b23;
          --text: #e6edf3;
          --muted: #9198a1;
          --border: #3d444d;
          --accent: #4493f8;
          --added: #3fb950;
          --removed: #f85149;
          --warn-bg: #2e2a1a;
          --warn-border: #9e6a03;
          --highlight: #12263f;
        --risk-high-bg: #3c1618;
        --risk-medium: #d29922;
        --diff-add-bg: #12261e;
        --diff-add-ln: #1b4721;
        --diff-del-bg: #25171c;
        --diff-del-ln: #542426;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1117;
        --surface: #151b23;
        --text: #e6edf3;
        --muted: #9198a1;
        --border: #3d444d;
        --accent: #4493f8;
        --added: #3fb950;
        --removed: #f85149;
        --warn-bg: #2e2a1a;
        --warn-border: #9e6a03;
        --highlight: #12263f;
        --risk-high-bg: #3c1618;
        --risk-medium: #d29922;
        --diff-add-bg: #12261e;
        --diff-add-ln: #1b4721;
        --diff-del-bg: #25171c;
        --diff-del-ln: #542426;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); max-width: 1200px; margin: 0 auto; }
      nav { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; padding: 24px 16px; border-right: 1px solid var(--border); font-size: 13px; }
      nav a { display: block; padding: 4px 8px; color: var(--muted); text-decoration: none; border-radius: 6px; }
      nav a:hover { background: var(--surface); color: var(--text); }
      main { padding: 32px 40px 80px; min-width: 0; }
      header h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.4; }
      .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 13px; }
      .badge { display: inline-block; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; }
      section { margin-top: 40px; }
      h2 { font-size: 19px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
      h3 { font-size: 16px; margin-top: 24px; }
      a { color: var(--accent); }
      code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); padding: 1px 5px; border-radius: 4px; }
      pre { background: var(--surface); padding: 12px 16px; border-radius: 8px; overflow-x: auto; }
      pre code { padding: 0; background: none; }
      .table-wrap { overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; font-size: 14px; }
      th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
      th { background: var(--surface); }
      tr.current td { background: var(--highlight); }
      tr.merged td { color: var(--muted); }
      .tldr { background: var(--surface); border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 0 8px 8px 0; }
      .tldr p { margin: 4px 0; }
      .callout { background: var(--warn-bg); border: 1px solid var(--warn-border); padding: 10px 14px; border-radius: 8px; }
      .evidence { color: var(--muted); font-size: 13px; }
      .added { color: var(--added); }
      .removed { color: var(--removed); }
      ol.steps { padding-left: 0; list-style: none; counter-reset: step; }
      ol.steps > li { counter-increment: step; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
      ol.steps > li > h3::before { content: counter(step) ". "; color: var(--muted); }
      ol.steps > li > h3 { margin-top: 0; }
      dl.step { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 4px 12px; margin: 0; }
      dl.step dt { color: var(--muted); font-size: 13px; }
      dl.step dd { margin: 0; }
      figure { margin: 12px 0 0; }
      figure img { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; }
      figcaption { color: var(--muted); font-size: 12px; }
      .mermaid { background: var(--surface); border-radius: 8px; padding: 12px; overflow-x: auto; }
      .progress { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
      .progress-bar { width: 160px; height: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
      .progress-bar > span { display: block; height: 100%; width: 0; background: var(--added); transition: width 0.2s; }
      .tag { display: inline-block; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
      .risk { display: inline-block; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
      .risk-high { background: var(--risk-high-bg); color: var(--removed); }
      .risk-medium { background: var(--warn-bg); color: var(--risk-medium); }
      .risk-low { background: var(--surface); color: var(--muted); }
      .risk-border-high { border-left: 4px solid var(--removed); }
      .risk-border-medium { border-left: 4px solid var(--warn-border); }
      .risk-border-low { border-left: 4px solid var(--border); }
      .checkpoint-count { color: var(--removed); font-size: 12px; font-weight: 600; white-space: nowrap; }
      ol.group-list { list-style: none; padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .group-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
      .group-row:last-child { border-bottom: none; }
      .group-row > a { color: var(--text); text-decoration: none; min-width: 0; flex: 1 1 320px; }
      .group-title { display: block; font-weight: 600; }
      .group-summary { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .group-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .done-mark { visibility: hidden; color: var(--added); font-weight: 700; }
      .group-row.done .done-mark { visibility: visible; }
      .group-row.done .group-title { color: var(--muted); }
      h3.sub { margin-top: 32px; color: var(--muted); font-size: 14px; }
      article.group { border: 1px solid var(--border); border-radius: 8px; margin: 16px 0; overflow: hidden; }
      .group-head { display: flex; justify-content: space-between; gap: 16px; padding: 16px; }
      .group-head h3 { display: inline; margin: 0; }
      .intent { margin: 8px 0 0; }
      .intent strong { color: var(--accent); }
      .checkpoints { margin: 8px 0 0; padding-left: 20px; font-size: 14px; }
      .approve { flex: none; align-self: start; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; }
      article.group.done .approve { border-color: var(--added); color: var(--added); }
      details.group-diff > summary { padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--border); cursor: pointer; font-size: 13px; color: var(--muted); }
      details.hunk { border-top: 1px solid var(--border); }
      details.hunk > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 6px 16px; cursor: pointer; font-size: 13px; }
      details.hunk > summary::-webkit-details-marker { display: none; }
      details.hunk > summary::before { content: "▸"; color: var(--muted); }
      details.hunk[open] > summary::before { content: "▾"; }
      .diff-wrap > p { margin: 0; padding: 8px 16px; }
      .hunk-id { color: var(--muted); font-family: ui-monospace, monospace; }
      .hunk-path { font-weight: 600; background: none; padding: 0; }
      .hunk-range { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
      .hunk-note { margin: 0; padding: 6px 16px; background: var(--highlight); font-size: 13px; }
      .diff-wrap { overflow-x: auto; }
      table.diff { border: none; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; width: 100%; }
      table.diff td { border: none; padding: 0 8px; white-space: pre; }
      table.diff td.ln { width: 1%; text-align: right; color: var(--muted); user-select: none; }
      table.diff td.sign { width: 1%; user-select: none; }
      table.diff tr.add td { background: var(--diff-add-bg); }
      table.diff tr.add td.ln { background: var(--diff-add-ln); }
      table.diff tr.del td { background: var(--diff-del-bg); }
      table.diff tr.del td.ln { background: var(--diff-del-ln); }
      table.diff tr.meta td { color: var(--muted); }
      /* 絵で見る: 図のカード */
      .pictures { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
      .picture { border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: var(--bg); margin: 0; }
      .picture > h3 { margin: 0 0 4px; font-size: 16px; }
      .picture > .lead { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
      .picture > figcaption { margin-top: 8px; font-size: 13px; color: var(--muted); }
      .picture.wide { grid-column: 1 / -1; }
      .picture svg { display: block; width: 100%; height: auto; margin: 0 auto; }
      .picture:not(.wide) svg { max-width: 520px; }
      /* 横長の絵は、狭い画面で縮めすぎず、カードの中で横にスクロールさせる */
      .picture.wide { overflow-x: auto; }
      .picture.wide svg { min-width: 640px; }
      .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 16px; font-size: 13px; color: var(--muted); }
      .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border-radius: 3px; border: 2px solid var(--border); background: var(--surface); }
      .legend .lg-changed::before { border-color: var(--accent); background: var(--highlight); }
      .legend .lg-added::before { border-color: var(--added); background: var(--diff-add-bg); }
      .legend .lg-removed::before { border-color: var(--removed); background: var(--diff-del-bg); border-style: dashed; }
      /* どこを触る？の地図（render_pictures.py の touch_map）: 画面を列、層を行にした表 */
      .touch-map { overflow-x: auto; }
      .tm-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px dashed var(--border); }
      .tm-row.tm-head { border-top: none; padding-top: 0; }
      .tm-layer { font-size: 12px; color: var(--muted); padding-top: 8px; }
      .tm-cells { display: grid; grid-template-columns: repeat(var(--cols), minmax(150px, 1fr)); grid-auto-flow: row dense; gap: 8px; }
      .tm-page { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 8px; background: var(--surface); font-size: 13px; }
      .tm-page code { font-size: 12px; background: none; padding: 0; color: var(--muted); overflow-wrap: anywhere; }
      .tm-item { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 13.5px; color: var(--muted); }
      .tm-item.changed { border: 2px solid var(--accent); background: var(--highlight); color: var(--text); }
      .tm-item.added { border: 2px solid var(--added); background: var(--diff-add-bg); color: var(--text); }
      .tm-item.removed { border: 2px dashed var(--removed); background: var(--diff-del-bg); color: var(--text); }
      .tm-label { font-weight: 600; }
      .tm-shared { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
      .tm-shared > .tm-item { flex: 1 1 160px; }
      .tm-note { flex-basis: 100%; font-size: 11.5px; color: var(--muted); }
      .tm-sub { flex-basis: 100%; font-size: 12px; color: var(--muted); }
      .gnum { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 11.5px; font-weight: 700; line-height: 20px; text-align: center; text-decoration: none; }
      /* 関係する画面（前提知識） */
      .page-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
      .page-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; scroll-margin-top: 16px; }
      .page-card:target { border-color: var(--accent); box-shadow: 0 0 0 2px var(--highlight); }
      .page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
      .page-card > p { margin: 6px 0 0; font-size: 14px; }
      .page-shot > summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 6px; }
      p.where { margin: 12px 0 -8px; font-size: 13px; color: var(--muted); }
      /* 図の部品（inline SVG の class） */
      .dg text { fill: var(--text); font: 14px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
      .dg text.small { font-size: 12px; fill: var(--muted); }
      .dg text.title { font-size: 15px; font-weight: 700; }
      .dg text.icon { font-size: 26px; }
      .dg .box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
      .dg .box.changed { fill: var(--highlight); stroke: var(--accent); stroke-width: 2.5; }
      .dg .box.added { fill: var(--diff-add-bg); stroke: var(--added); stroke-width: 2.5; }
      .dg .box.removed { fill: var(--diff-del-bg); stroke: var(--removed); stroke-width: 2; stroke-dasharray: 6 4; }
      .dg .zone { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .dg .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
      .dg .edge.changed { stroke: var(--accent); stroke-width: 2.5; }
      .dg .edge.added { stroke: var(--added); stroke-width: 2.5; }
      .dg .edge.removed { stroke: var(--removed); stroke-dasharray: 6 4; }
      .dg .arrowhead { fill: var(--muted); }
      .dg .arrowhead.changed { fill: var(--accent); }
      .dg .arrowhead.added { fill: var(--added); }
      .dg .arrowhead.removed { fill: var(--removed); }
      .dg .label-bg { fill: var(--bg); }
      .dg .badge { fill: var(--accent); }
      .dg text.badge-text { fill: var(--bg); font-size: 12px; font-weight: 700; }
      /* スタック構成: 積み木 */
      ol.stack-blocks { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column-reverse; gap: 6px; max-width: 720px; }
      ol.stack-blocks > li { border: 2px solid var(--border); border-radius: 8px; padding: 8px 14px; background: var(--surface); }
      ol.stack-blocks > li.current { border-color: var(--accent); background: var(--highlight); }
      ol.stack-blocks > li.merged { opacity: 0.6; border-style: dashed; }
      ol.stack-blocks > li .stack-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
      ol.stack-blocks > li .stack-sum { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
      .stack-trunk { max-width: 720px; text-align: center; padding: 4px; border-top: 4px solid var(--muted); color: var(--muted); font-size: 13px; }
      /* 変更量のバーと変更ファイルの地図（render_groups.py が出す） */
      .sizebar { display: inline-flex; width: 120px; max-width: 100%; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); vertical-align: middle; }
      .sizebar > .add { background: var(--added); }
      .sizebar > .del { background: var(--removed); }
      /* チケットの本文（render_brief.py の ticket_body が出す） */
      details.ticket-sec { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; }
      details.ticket-sec > summary { padding: 8px 16px; cursor: pointer; font-weight: 600; }
      .ticket-body { padding: 0 16px 12px; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
      .ticket-body pre { overflow-x: auto; }
      .ticket-comment + .ticket-comment { border-top: 1px dashed var(--border); margin-top: 8px; }
      details.file-map { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; }
      details.file-map > summary { padding: 8px 16px; cursor: pointer; font-weight: 600; }
      .file-map .dir { padding: 6px 16px 2px; color: var(--muted); font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; border-top: 1px solid var(--border); }
      .file-map .file { display: grid; grid-template-columns: minmax(0, 1fr) 120px minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 2px 16px 2px 32px; font-size: 13px; }
      .file-map .file code { background: none; padding: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .file-map .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .file-map .chip { font-size: 11px; padding: 0 6px; border-radius: 6px; text-decoration: none; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
      .file-map .chip.risk-high { border-color: var(--removed); color: var(--removed); }
      .file-map .chip.risk-medium { border-color: var(--warn-border); color: var(--risk-medium); }
      @media (max-width: 800px) {
        .layout { display: block; }
        nav { display: none; }
        main { padding: 24px 16px 64px; }
        dl.step { grid-template-columns: minmax(0, 1fr); }
        .file-map .file { grid-template-columns: minmax(0, 1fr) 80px; padding-left: 16px; }
        .file-map .chips { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
{{nav}}
      <main>
{{content}}
      </main>
    </div>
    <script>
      (() => {
        const container = document.getElementById("diff-groups");
        if (!container) return;
        const d = container.dataset;
        document.getElementById("diff-stats").textContent = `${d.files} files / ${d.hunks} hunks +${d.added} −${d.removed}`;
        const head = document.querySelector('meta[name="pr-reviewer-brief-head"]')?.content ?? "";
        const key = `pr-reviewer-brief:${location.pathname}:${head}`;
        let done = {};
        try { done = JSON.parse(localStorage.getItem(key) || "{}"); } catch {}
        const boxes = [...container.querySelectorAll("input[type=checkbox][data-group]")];
        const update = () => {
          const count = boxes.filter((box) => box.checked).length;
          document.getElementById("progress-text").textContent = `${count}/${boxes.length}`;
          document.getElementById("progress-fill").style.width = `${boxes.length ? (count / boxes.length) * 100 : 0}%`;
        };
        for (const box of boxes) {
          const id = box.dataset.group;
          const mark = (checked) => {
            box.closest("article.group").classList.toggle("done", checked);
            container.querySelector(`.group-row[data-group="${CSS.escape(id)}"]`)?.classList.toggle("done", checked);
          };
          box.checked = Boolean(done[id]);
          mark(box.checked);
          box.addEventListener("change", () => {
            done[id] = box.checked;
            mark(box.checked);
            // 確認したグループは差分を畳む
            if (box.checked) box.closest("article.group").querySelector("details.group-diff").open = false;
            try { localStorage.setItem(key, JSON.stringify(done)); } catch {}
            update();
          });
        }
        update();
      })();
    </script>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
      const dark =
        document.documentElement.dataset.theme === "dark" ||
        (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      mermaid.initialize({ startOnLoad: true, theme: dark ? "dark" : "default" });
    </script>
  </body>
</html>
