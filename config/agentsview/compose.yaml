services:
  cockroach:
    image: cockroachdb/cockroach:v26.3.2@sha256:bc15746ef2c2493b2cfd46a76898a745587d068b1a259fff3c4447c3f3b36ea2
    # local専用なので--insecure（TLSなし・password認証なし）で動かす。remoteは
    # sslmode=verify-fullとrole別passwordを使うため、認証方式だけが本番と異なる。
    #
    # listen-addr・http-addr・storeは指定しない。imageのentrypoint
    # （/cockroach/cockroach.sh）はstart-single-nodeのとき--listen-addrのhostを
    # 127.0.0.1かlocalhostに限っており、0.0.0.0を渡すとerrorでexit 1になる。
    # 既定値は :26257 と :8080 で全interfaceにbindするため、下のports指定だけで
    # hostから届く。storeも既定が/cockroach/cockroach-dataで、entrypointは
    # このpathの中身で初回起動かを判定する。
    command:
      - start-single-node
      - --insecure
    environment:
      # entrypointがvolumeの空な初回起動でだけこのdatabaseを作る。
      # 既存volumeやdatabase名を変えた場合は効かないので、保証するのは起動ごとに
      # CREATE DATABASE IF NOT EXISTS を実行する scripts/localdb.sh の up である。
      COCKROACH_DATABASE: ${AGENTSVIEW_LOCAL_CRDB_DATABASE:-agentsview}
      # local検証clusterの利用統計をCockroach Labsへ送らない。
      COCKROACH_SKIP_ENABLING_DIAGNOSTIC_REPORTING: "true"
    ports:
      # 左がhostへpublishするport、右がcontainer内のport。container netnsを共有
      # するpgtoolsからは常に26257で見えるので、この値を変えても影響しない。
      - "127.0.0.1:${AGENTSVIEW_LOCAL_CRDB_PORT:-26257}:26257"
      - "127.0.0.1:${AGENTSVIEW_LOCAL_CRDB_HTTP_PORT:-18080}:8080"
    healthcheck:
      # imageにcurlは入っていないが、cockroach binaryは必ずある。
      test: ["CMD", "cockroach", "sql", "--insecure", "--execute", "SELECT 1"]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 15s
    volumes:
      - agentsview-cockroach:/cockroach/cockroach-data

  # psqlの供給元。CockroachDBのimageにはclient toolが入っていない。
  # scripts/localdb.sh はこのserviceを起動せず、imageとnetworkの指定だけを借りて
  # docker runで実行する（compose runの進捗表示がquery結果のparseを壊さないように
  # するため）。network_modeがcockroach containerのnetnsを指すので、client側からは
  # 127.0.0.1:26257がlocal clusterになる（hostへpublishしたportではない）。
  pgtools:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: ["true"]
    network_mode: "service:cockroach"
    profiles:
      - tools

volumes:
  agentsview-cockroach:
    name: agentsview-cockroach
