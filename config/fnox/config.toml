# import で明示的に取り込み、有効化は FNOX_PROFILE で行う。HOST_ENV に work ロールが
# 含まれるホストだけ dot_zshenv.tmpl が FNOX_PROFILE=work を export する。
import = ["config.work.toml"]

# fnox 1.34.0 以降は、選択した profile のテーブルが存在しない場合にエラーになる。
# グローバル設定では import が読み込まれないため、work profile 自体はここで定義する。
[profiles.work]

[providers.bitwarden]
type = "bitwarden"

[providers.bws]
project_id = "69a1a5eb-c245-4162-80f7-b49200dbebf3"
type       = "bitwarden-sm"

[providers.age]
key_file = "~/.config/fnox/age.txt"
recipients = [
    "age1k9zxqxufy599csnlkfwq2efxnscju4ek3ftqpvx55r9re38akers6zrq2z", # mac-private
    "age184vvj44q3x0jn8j5xlrzlecnd4ae8nw68e0mj3eq8uu0z22t5dvs3g4enu", # mac-work2
    "age1rptnxrh67vp0dhh66qtyfwzr3m38pw62a6dv38yrk9zyp6tyjdysd8e5rz", # mac-work3
]
type = "age"

[secrets]
BWS_ACCESS_TOKEN  = { provider = "age", value = "" }
CZ_OPENAI_API_KEY = { provider = "bws", value = "GitHub PAT(cz-git)" }

AGENTSVIEW_AUTH_TOKEN             = { provider = "bws", value = "AGENTSVIEW_AUTH_TOKEN", env = "exec" }
AGENTSVIEW_COCKROACH_OWNER_PG_URL = { provider = "bws", value = "AGENTSVIEW_COCKROACH_OWNER_PG_URL", env = "exec" }
AGENTSVIEW_COCKROACH_PUSH_PG_URL  = { provider = "bws", value = "AGENTSVIEW_COCKROACH_PUSH_PG_URL", env = "exec" }
AGENTSVIEW_COCKROACH_READ_PG_URL  = { provider = "bws", value = "AGENTSVIEW_COCKROACH_READ_PG_URL", env = "exec" }
AGENTSVIEW_CURSOR_SECRET          = { provider = "bws", value = "AGENTSVIEW_CURSOR_SECRET", env = "exec" }
COCKROACH_API_KEY                 = { provider = "bws", value = "COCKROACH_API_KEY", env = "exec" }
TF_VAR_cockroach_owner_password   = { provider = "bws", value = "TF_VAR_cockroach_owner_password", env = "exec" }
TF_VAR_cockroach_push_password    = { provider = "bws", value = "TF_VAR_cockroach_push_password", env = "exec" }
TF_VAR_cockroach_read_password    = { provider = "bws", value = "TF_VAR_cockroach_read_password", env = "exec" }
