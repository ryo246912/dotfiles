output:
  - meta
  - summary
  - failure
  - execution_out

glob_matcher: doublestar

pre-commit:
  jobs:
    - name: stash files (ai-only)
      only: &ai-only
        - run: test -n "${AI_AGENT:-}"
      run: |
        marker="$(git rev-parse --git-path lefthook-pre-commit-stash)"
        # 中断された過去の実行のマーカーが残っていると、後続の stash pop が今回の stash と取り違えるため消す。
        rm -f "$marker"
        # 過去の実行で復元できなかった stash が残っている場合は、変更を見失わないよう先に復元させる。
        leftover="$(git stash list --format='%h %s' | grep ': lefthook-pre-commit$' || true)"
        if [ -n "$leftover" ]; then
          echo "❌ [ai-only] 以前のpre-commitで退避した変更が復元されずに残っています。" >&2
          echo "$leftover" >&2
          # hook 実行中は Lefthook 自身の "lefthook auto backup" stash があり stash@{N} の番号がずれるため、番号は表示しない。
          echo "   git stash list で該当する stash@{N} を確認し、git stash pop --index stash@{N} で復元してください。" >&2
          exit 1
        fi
        before="$(git rev-parse --verify -q refs/stash || true)"
        # bind mount された生成物ディレクトリ（.venv 等）が未追跡に見えると stash -u が削除しようとして
        # "Device or resource busy" で失敗する。グローバル gitignore で無視しておくこと（docs/devcontainer.md 参照）。
        rc=0
        git stash push --keep-index --include-untracked -q -m "lefthook-pre-commit" || rc=$?
        after="$(git rev-parse --verify -q refs/stash || true)"
        # マーカーは「今回の実行で stash 処理を行った」印。後続の lint / stash pop はマーカーがある場合だけ実行する。
        # 退避する変更が無ければ空で書く。stash が失敗しても途中まで作られている場合があるため、
        # 作られていれば必ず ref を書き、後続の stash pop で未追跡ファイルを復元できるようにしてから失敗を返す。
        if [ "$before" != "$after" ]; then
          printf '%s\n' "$after" > "$marker"
        else
          : > "$marker"
        fi
        exit "$rc"
    - name: lint (ai-only)
      only: &ai-stashed
        - run: test -n "${AI_AGENT:-}" && test -f "$(git rev-parse --git-path lefthook-pre-commit-stash)"
      group:
        parallel: true
        jobs:
          - name: actions
            glob: ".github/workflows/**/*.{yaml,yml}"
            run: mise run lint:action
            fail_text: "❌ [ai-only] GitHub Actions lint failed."
          - name: toml
            glob: "**/*.toml"
            run: mise run lint:toml
            fail_text: "❌ [ai-only] TOML format check failed."
          - name: yaml
            glob: "**/*.{yaml,yml}"
            run: mise run lint:yaml
            fail_text: "❌ [ai-only] YAML format check failed."
          - name: json
            glob: "**/*.json"
            run: mise run lint:json
            fail_text: "❌ [ai-only] JSON format check failed."
          - name: markdown
            glob: "**/*.md"
            run: mise run lint:md
            fail_text: "❌ [ai-only] Markdown format check failed."
          - name: shell
            glob: "**/*.sh"
            run: mise run lint:shell
            fail_text: "❌ [ai-only] shell format check failed."
          - name: secretlint
            run: mise run lint:secret
            fail_text: "❌ [ai-only] secretlint failed."
          - name: git-secrets
            run: mise run lint:git-secrets
            fail_text: "❌ [ai-only] git-secrets failed."
          - name: betterleaks
            run: mise run lint:betterleaks:staged
            fail_text: "❌ [ai-only] betterleaks failed."
          - name: go
            glob: "**/*.go"
            run: mise run lint:go
            fail_text: "❌ [ai-only] Go lint, test, vet, or build failed."
          - name: python
            glob: "**/*.py"
            run: mise run lint:python
            fail_text: "❌ [ai-only] Python lint or format check failed."
          - name: typescript
            glob: "**/{*.{js,jsx,ts,tsx,mjs,cjs,mts,cts},package.json,tsconfig*.json,oxlint.json,oxfmt.json}"
            run: mise run lint:typescript
            fail_text: "❌ [ai-only] TypeScript/JavaScript lint, format, or type check failed."
    - name: stash pop (ai-only)
      only: *ai-stashed
      run: |
        marker="$(git rev-parse --git-path lefthook-pre-commit-stash)"
        expected="$(cat "$marker")"
        if [ -z "$expected" ]; then
          rm -f "$marker"
          exit 0
        fi
        current="$(git rev-parse --verify -q refs/stash || true)"
        if [ "$current" != "$expected" ]; then
          rm -f "$marker"
          echo "❌ [ai-only] Lefthookが作成したstashを特定できません（$expected）。" >&2
          echo "   git stash list で lefthook-pre-commit を確認して復元してください。" >&2
          exit 1
        fi
        # stash 後に hook 実行中に加えられた変更（lint の自動修正や並行して動く別プロセスの編集）は stash に含まれない。
        # 消さずに退避してから復元する。
        backup="$(git rev-parse --git-path lefthook-pre-commit-backup)/$(date +%Y%m%d-%H%M%S)-$$"
        if ! git diff --quiet; then
          mkdir -p "$backup"
          git diff --binary > "$backup/tracked.patch"
        fi
        git reset --hard -q
        # lint 等が stash 内の未追跡ファイルと同名のファイルを生成していると、pop が
        # "already exists, no checkout" で失敗して stash が残る。stash の内容で上書きされるものだけ先に退避する。
        if git rev-parse --verify -q "$expected^3" >/dev/null; then
          git ls-tree -r -z --name-only "$expected^3" | xargs -0 -r sh -c '
            b="$1"; shift
            for f; do
              [ -e "$f" ] || [ -L "$f" ] || continue
              mkdir -p "$b/untracked/$(dirname "$f")"
              mv -- "$f" "$b/untracked/$f"
            done
          ' _ "$backup"
        fi
        if [ -d "$backup" ]; then
          echo "⚠️ [ai-only] hook実行中に変更されたファイルを $backup に退避しました（tracked.patch / untracked/）。" >&2
        fi
        rm -f "$marker"
        if ! git stash pop --index -q; then
          echo "❌ [ai-only] stashの復元に失敗しました。退避した変更は stash（$expected）に残っています。" >&2
          echo "   原因を解消してから git stash list で lefthook-pre-commit を確認し、git stash pop --index stash@{N} で復元してください。" >&2
          exit 1
        fi
