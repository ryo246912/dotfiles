["lint:typescript"]
depends = [
    "lint:typescript:check",
    "lint:typescript:format",
    "lint:typescript:typecheck",
]
description = "Run all strict TypeScript/JavaScript checks"

["lint:typescript:check"]
description = "Run Oxlint checks"
run         = 'oxlint --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/oxlint.json" --no-error-on-unmatched-pattern .'

["lint:typescript:format"]
description = "Check TypeScript/JavaScript formatting with Oxfmt"
run         = 'oxfmt --check --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/oxfmt.json" "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"'

["lint:typescript:typecheck"]
description = "Run strict TypeScript type checks with tsgo"
# tsgo (tsc相当) はtsconfig.jsonが無いとproject解決できず、file引数も無いとhelpを吐いて
# 失敗する。tsconfig.jsonを置かない運用のrepoでも動くよう、対象ファイルを明示的に探して
# 渡す（node_modules/unmanaged配下は対象外。0件ならcheckすべきTypeScriptが無いとして成功
# 終了する）。
run = '''
files=$(find . \( -path ./node_modules -o -path ./unmanaged \) -prune -o -type f \( -name '*.ts' -o -name '*.tsx' \) -print)
if [ -z "$files" ]; then
  echo "No TypeScript files to check."
  exit 0
fi
tsgo --noEmit --pretty false --strict --noUncheckedIndexedAccess \
  --exactOptionalPropertyTypes --noImplicitReturns --noUnusedLocals \
  --noUnusedParameters --noFallthroughCasesInSwitch --noImplicitOverride \
  --allowUnreachableCode false --allowUnusedLabels false \
  --forceConsistentCasingInFileNames --useUnknownInCatchVariables \
  $files
'''
shell = "bash -c"

["fix:typescript"]
depends     = ["fix:typescript:format"]
description = "Apply all safe TypeScript/JavaScript lint and formatting fixes"

["fix:typescript:check"]
description = "Apply Oxlint fixes"
run         = 'oxlint --fix --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/oxlint.json" --no-error-on-unmatched-pattern .'

["fix:typescript:format"]
depends     = ["fix:typescript:check"]
description = "Format TypeScript/JavaScript files with Oxfmt"
run         = 'oxfmt --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/oxfmt.json" "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"'
