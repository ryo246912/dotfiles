["lint:go"]
depends     = ["lint:go:lint", "lint:go:format", "lint:go:test", "lint:go:build"]
description = "Run all strict Go checks"

["lint:go:lint"]
description = "Run golangci-lint (includes govet)"
run         = 'golangci-lint run --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/golangci.yml" ./...'

["lint:go:format"]
description = "Check Go formatting"
run         = 'golangci-lint fmt --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/golangci.yml" --diff'

["lint:go:test"]
description = "Run Go tests"
run         = "go test ./..."

["lint:go:build"]
description = "Build Go packages"
run         = "go build ./..."

["fix:go"]
depends     = ["fix:go:format"]
description = "Apply all safe Go lint and formatting fixes"

["fix:go:lint"]
description = "Apply golangci-lint fixes"
run         = 'golangci-lint run --fix --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/golangci.yml" ./...'

["fix:go:format"]
depends     = ["fix:go:lint"]
description = "Format Go files"
run         = 'golangci-lint fmt --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/golangci.yml"'
