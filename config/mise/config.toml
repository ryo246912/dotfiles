[settings]
auto_install = false
auto_update = true
auto_update_check_duration = "7d"
disable_default_registry = true
disable_update_warning = true
experimental = true
gpg_verify = true
lockfile = true
minimum_release_age = "7d"
not_found_system_fallback = false
trusted_config_paths = [
    "~/dotfiles",
    "~/.local/share/worktrees",
]

[task_config]
includes = ["tasks/*.toml"]

[settings.npm]
bun = true

[settings.pipx]
uvx = true

[hooks]
postinstall = """
command -v lefthook >/dev/null 2>&1 || exit 0
root="$(git rev-parse --show-toplevel 2>/dev/null)" || exit 0
[ -f "$root/lefthook.yml" ] || exit 0
cd "$root"
lefthook install
"""

# track mode は project config ではなく global config からのみ有効になる実機仕様のため、
# ここ（deploy先: ~/.config/mise/config.toml）で宣言する。
# 内容の配置は mise.toml 側の "~/.config" symlink-each エントリ（config/ の各ファイルへ
# リンクを張る。OS 別の除外は mise.mac.toml / mise.linux.toml）が行い、変更履歴は
# `mise bootstrap dotfiles save`（または [bootstrap.services.mise-history] による
# 自動保存）が checkpoint として記録する（mise history は symlink をリンクとして記録し
# リンク先の内容は記録しないため、symlink-each で配置したファイルの内容の変更履歴は
# repo の Git で追う）。
#
# "~/.config" 配下の単一ファイル管理エントリ（mise.toml の [dotfiles] 参照）は
# copy/template mode のまま維持しつつ、ここで同じ target に track を追加宣言している（mise の
# 「ownership」パターン。dotfiles.html#ownership 参照。実機で「同じ target を
# copy/template と track の両方でカバーしても衝突しない」こと、「copyで丸ごと管理する
# ディレクトリの中の、個別ファイルだけをtrackする」構成も問題なく動作することを
# 確認済み）。copy/template 側が source へ収束させる主挙動は変わらないが、apply で
# ライブ編集が上書きされる直前に history checkpoint が自動記録されるため、
# `mise bootstrap dotfiles rollback <path>` で復元できるようになる（実機確認済み）。
# "~/.apm"/"~/.claude"/"~/.codex" 配下の個別ファイルも track しているが、mise.toml 側は
# symlink-each のためリンクとして記録される（内容の履歴は repo の Git で追う）。
#
# "~/.apm"・"~/.claude"・"~/.codex" は、ディレクトリ全体としてはここに含めていない。
# "~/.local" も同様（単一ファイルも含めて一切 track していない）。これらのディレクトリ
# 配下には、git 管理外のランタイム状態（セッションログ・キャッシュ・認証情報等）も
# 混在する。track はディレクトリ配下を丸ごと history（ローカル git）へ記録するため、
# 巻き込むと機密情報が history に残る・origin 同期時に流出しうる・大量ファイルで
# checkpoint が重くなるおそれがある。narrow に保つため、個別ファイルで列挙できる
# ものだけを対象にしている。
[dotfiles]
"~/.apm/apm.lock.yaml"                  = { mode = "track" }
"~/.apm/apm.yml"                        = { mode = "track" }
"~/.claude/settings.json"               = { mode = "track" }
"~/.codex/config.toml"                  = { mode = "track" }
"~/.codex/hooks.json"                   = { mode = "track" }
"~/.config"                             = { mode = "track" }
"~/.config/alacritty/alacritty.toml"    = { mode = "track" }
"~/.config/ghostty/config"              = { mode = "track" }
"~/.config/git/config"                  = { mode = "track" }
"~/.config/mise"                        = { mode = "track" }
"~/.config/rio/config.toml"             = { mode = "track" }
"~/.config/rulesync/.rulesync/mcp.json" = { mode = "track" }
"~/.zshenv"                             = { mode = "track" }
