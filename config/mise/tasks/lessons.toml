# agent-lessons（PR レビュー指摘から教訓を貯める private リポジトリ）の task。
# 仕組みと使い方は docs/agent-lessons.md。

["lessons:setup"]
description = "Clone the private agent-lessons repo and register it as a Basic Memory project"
run = '''
set -euo pipefail
repo="${AGENT_LESSONS_REPO:?AGENT_LESSONS_REPO に <owner>/agent-lessons を設定してください}"
dir="${AGENT_LESSONS_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/agent-lessons}"
project="${AGENT_LESSONS_PROJECT:-agent-lessons}"

if [ ! -d "$dir/.git" ]; then
  gh repo clone "$repo" "$dir"
fi

if ! basic-memory tool list-projects 2>/dev/null | jq -e --arg p "$project" '.projects[]? | select(.name == $p)' >/dev/null; then
  basic-memory project add "$project" "$dir"
fi

# 教訓は日本語で書くため、英語専用の既定 embedding model（bge-small-en）は使わず、メタデータと全文検索で引く。
# 初回の model ダウンロードも不要になる。
basic-memory config set semantic_search_enabled false
# バージョンは mise で固定しているため、Basic Memory 自身の自動更新は止める。
basic-memory config set auto_update false
basic-memory reindex --search -p "$project"
'''
shell = "bash -c"

["lessons:sync"]
description = "Commit local agent-lessons changes, pull, push, and reindex Basic Memory"
run = '''
set -euo pipefail
dir="${AGENT_LESSONS_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/agent-lessons}"
project="${AGENT_LESSONS_PROJECT:-agent-lessons}"
cd "$dir"

branch=$(git branch --show-current)
if [ "$branch" != "main" ]; then
  echo "error: $dir は $branch を checkout しています。main に戻してから実行してください" >&2
  exit 1
fi

git add --all
if ! git diff --cached --quiet; then
  # 会社のリポジトリの指摘も入るため、秘密情報が混ざっていたら commit しない
  git diff --cached --name-only --diff-filter=AM -z \
    | xargs -0 -r secretlint --secretlintrc "${XDG_CONFIG_HOME:-$HOME/.config}/secretlint/secretlintrc.json"
  git commit --quiet -m "chore: record lessons from $(hostname -s)"
fi
git pull --rebase --quiet
git push --quiet
basic-memory reindex --search -p "$project"
'''
shell = "bash -c"
