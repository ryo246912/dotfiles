["fxtwitter:read"]
description = "FxTwitter API から公開 X 投稿を取得する"
run = '''
case "$usage_post_id" in
  *[!0-9]*|'')
    printf '%s\n' '投稿 ID は数字で指定してください。' >&2
    exit 2
    ;;
esac
curl --fail --silent --show-error --max-time 15 "https://api.fxtwitter.com/status/$usage_post_id"
'''
usage = 'arg "<post-id>" help "投稿 URL の status/ に続く数字"'
