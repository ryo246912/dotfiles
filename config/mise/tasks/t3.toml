# T3 Code: initial setup and occasional CLI operations.
["t3:setup"]
description = "Select and configure shared T3 sandboxes and auto-start"
# Preserve the caller's repository when invoked as a global task.
dir = "{{cwd}}"
raw = true
run = 'exec "$HOME/.local/bin/t3-sandbox" setup'

["t3:cli"]
description = "Select a T3 operation, provider, and sandbox with fzf"
dir         = "{{cwd}}"
raw         = true
run         = 'exec "$HOME/.local/bin/t3-sandbox" cli'
