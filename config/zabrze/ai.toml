[[snippets]]
name    = "ccmanager"
snippet = "ccmanager"
trigger = "ccm"

# リポジトリの root で起動する。ccmanager が作る worktree の common git dir（root の .git）を
# ホストと同じ絶対パスに mount する（docs/devcontainer.md 参照）。account2 / work3 は preset で選ぶ。
[[snippets]]
name    = "ccmanager devcontainer"
snippet = "ccmanager --devc-up-command \"devcontainer up --workspace-folder . --config $HOME/.config/devcontainer/devcontainer.json --mount type=bind,source=$PWD/.git,target=$PWD/.git\" --devc-exec-command \"devcontainer exec --workspace-folder . --config $HOME/.config/devcontainer/devcontainer.json\""
trigger = "ccmc"

# CCMANAGER_MULTI_PROJECT_ROOT 配下の multi-worktree task root を横断管理する。どこからでも起動できる。
# ccmanager は選んだ task root を cwd にして実行するため、--config なしで task root の
# .devcontainer/devcontainer.json（multi-worktree が生成）が使われる。
[[snippets]]
name    = "ccmanager devcontainer(multi-project)"
snippet = "ccmanager --multi-project --devc-up-command \"devcontainer up --workspace-folder .\" --devc-exec-command \"devcontainer exec --workspace-folder .\""
trigger = "ccmcm"

[[snippets]]
name    = "devcontainer up"
snippet = "devcontainer up --workspace-folder . --config $HOME/.config/devcontainer/devcontainer.json --mount \"type=bind,source=$(git rev-parse --path-format=absolute --git-common-dir),target=$(git rev-parse --path-format=absolute --git-common-dir)\""
trigger = "dcup"

[[snippets]]
cursor  = "👇"
name    = "devcontainer exec"
snippet = "devcontainer exec --workspace-folder . --config $HOME/.config/devcontainer/devcontainer.json -- 👇"
trigger = "dcex"

[[snippets]]
name    = "mcp-cli"
snippet = "mcp-cli -c ~/.copilot/mcp-config.json"
trigger = "mcp"

[[snippets]]
global  = true
name    = "claude"
snippet = "claude"
trigger = "cl"

[[snippets]]
global  = true
name    = "claude (account2)"
snippet = "CLAUDE_CONFIG_DIR=~/.claude-account2 claude"
trigger = "cl2"

[[snippets]]
global  = true
name    = "claude --dangerously-skip-permissions"
snippet = "claude --dangerously-skip-permissions"
trigger = "cly"

[[snippets]]
global  = true
name    = "copilot"
snippet = "copilot"
trigger = "co"

[[snippets]]
global  = true
name    = "copilot --yolo"
snippet = "copilot --yolo"
trigger = "coy"

[[snippets]]
global  = true
name    = "codex"
snippet = "codex"
trigger = "cx"

[[snippets]]
global  = true
name    = "codex --yolo"
snippet = "codex --yolo"
trigger = "cxy"

[[snippets]]
context = ".*claude\\s"
global  = true
name    = "(ccmanager) --multi-project"
snippet = "--multi-project"
trigger = "mp"

[[snippets]]
context = ".*claude\\s"
global  = true
name    = "(claude*) --dangerously-skip-permissions"
snippet = "--dangerously-skip-permissions"
trigger = "yl"

[[snippets]]
context = ".*(copilot|codex)\\s"
global  = true
name    = "(copilot|codex) --yolo"
snippet = "--yolo"
trigger = "yl"
