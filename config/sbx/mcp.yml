# sandbox から使う MCP サーバ。書式は APM の apm.yml の dependencies.mcp と同じ
# （https://github.com/microsoft/apm の manifest schema）。
#
# MCP はホストの agent には登録せず、sandbox からホストの sbx mcp（gateway）経由でだけ使う。
# そのため APM（apm install）には読ませず、mise run sandbox:mcp がこのファイルを読んで
# sbx mcp add の引数に変換する（docs/docker-sandboxes.md の「MCP の扱い」参照）。
# - すべて self-defined（registry: false）で書く。registry 参照は解決後のコマンドが残らないため使えない。
# - stdio はパッケージを args の `<package>@<version>` で固定し、Renovate で更新する
#   （npx は npm、uvx は PyPI。command の直後に args を書く）。
# - env は `env K=V ... <command>` で包んで sbx に渡す。AWS_PROFILE などはホストの環境から継承させる。
# - 環境ごと（work3 / private など）のサーバは mcp.<name>.yml に書く（gitignore 済み、
#   雛形は mcp.work3.yml.example）。同じ name を複数のファイルに書いた場合は先に読んだ方を使う。
dependencies:
  mcp:
    # OAuth。初回のみブラウザで認可する
    - name: notion
      registry: false
      transport: http
      url: https://mcp.notion.com/mcp
    - name: deepwiki
      registry: false
      transport: http
      url: https://mcp.deepwiki.com/mcp
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@upstash/context7-mcp@4.3.0"]
    # ホストで起動している Chrome（--remote-debugging-port）に接続する
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "chrome-devtools-mcp@1.10.1", "--browser-url=http://localhost:9222"]
    - name: chrome-devtools-2
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "chrome-devtools-mcp@1.10.1", "--browser-url=http://localhost:9223"]
    - name: chrome-devtools-3
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "chrome-devtools-mcp@1.10.1", "--browser-url=http://localhost:9224"]
    # AWS 系はホストの AWS 認証情報（~/.aws、AWS_PROFILE）をそのまま使う
    - name: aws-api
      registry: false
      transport: stdio
      command: uvx
      args: ["awslabs.aws-api-mcp-server@1.5.6"]
    - name: aws-billing
      registry: false
      transport: stdio
      command: uvx
      args: ["awslabs.billing-cost-management-mcp-server@0.0.39"]
      env:
        FASTMCP_LOG_LEVEL: ERROR
        AWS_REGION: ap-northeast-1
    - name: aws-cloudwatch
      registry: false
      transport: stdio
      command: uvx
      args: ["awslabs.cloudwatch-mcp-server@0.3.1"]
      env:
        FASTMCP_LOG_LEVEL: ERROR
