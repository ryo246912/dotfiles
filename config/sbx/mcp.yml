# sandbox から使う MCP サーバ。書式は APM の apm.yml の dependencies.mcp と同じ
# （https://github.com/microsoft/apm の manifest schema）。
#
# MCP はホストの agent には登録せず、sandbox からホストの sbx mcp（gateway）経由でだけ使う。
# そのため APM（apm install）には読ませず、mise run sandbox:mcp-add がこのファイルを読んで
# sbx mcp add の引数に変換する（docs/docker-sandboxes.md の「MCP の扱い」参照）。
# - すべて self-defined（registry: false）で書く。registry 参照は解決後のコマンドが残らないため使えない。
# - stdio はパッケージを args の `<package>@<version>` で固定し、Renovate で更新する
#   （npx は npm、uvx は PyPI。command の直後に args を書く）。
# - env は `env K=V ... <command>` で包んで sbx に渡す。AWS_PROFILE などはホストの環境から継承させる。
# - sbx_options は sbx mcp add にそのまま渡す追加オプション（--dir / --skip-ssrf-check / --scope など）。
#   APM の書式では未定義のキーなので APM 側では passthrough として無視される。
# - 環境ごと（work2 / work3 / private など）のサーバは mcp.<name>.yml に書く（gitignore 済み、
#   雛形は mcp.<name>.yml.example）。同じ name を複数のファイルに書いた場合は先に読んだ方を使う。
dependencies:
  mcp:
    - name: deepwiki
      registry: false
      transport: http
      url: https://mcp.deepwiki.com/mcp
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@upstash/context7-mcp@4.3.0"]
    # ホストで起動している Chrome（--remote-debugging-port=9222）に CDP で接続する
    # （--browser-url が Playwright MCP の --cdp-endpoint に相当する）
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "chrome-devtools-mcp@1.10.1", "--browser-url=http://localhost:9222"]
