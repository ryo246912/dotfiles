schemaVersion: "2"
kind: mixin
name: coderabbit
version: "1.0.0"
description: CodeRabbit authentication and network policy for the mise-based template
# Use v2 to compose with the existing built-in agents and sbx-agent:<agent> templates.
# CLI authentication may use more than HTTP headers; pass the real key locally.
# The host postCreate helper writes this file via stdin, never a shared mount.
environment:
  variables:
    CODERABBIT_API_KEY_FILE: /etc/coderabbit-api-key
permissions:
  network:
    allow:
      # CodeRabbit CLI（sandbox 内の coderabbit review が API を呼ぶ）
      - api.coderabbit.ai
      - app.coderabbit.ai
      - ide.coderabbit.ai
      - cli.coderabbit.ai
# CLI installation is owned by Dockerfile.sandbox and config/devcontainer/mise.toml.
