schemaVersion: "2"
kind: mixin
name: coderabbit
version: "1.0.0"
description: CodeRabbit authentication and network policy for the mise-based template
# Use v2 to compose with the existing built-in agents and sbx-agent:<agent> templates.
credentials:
  - service: coderabbit
    required: true
    apiKey:
      name: CODERABBIT_API_KEY
      # sbx sets CODERABBIT_API_KEY=proxy-managed; the real key stays on the host.
      proxyManaged: true
      inject:
        - domain: api.coderabbit.ai
          header: x-coderabbitai-api-key
          format: "%s"
        - domain: ide.coderabbit.ai
          header: x-coderabbitai-api-key
          format: "%s"
permissions:
  network:
    allow:
      # CodeRabbit CLI（sandbox 内の coderabbit review が API を呼ぶ）
      - api.coderabbit.ai
      - app.coderabbit.ai
      - ide.coderabbit.ai
      - cli.coderabbit.ai
# CLI installation is owned by Dockerfile.sandbox and config/devcontainer/mise.toml.
