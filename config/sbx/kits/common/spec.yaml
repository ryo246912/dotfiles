schemaVersion: "2"
kind: mixin
name: dotfiles-common
version: "1.0.0"
description: Shared sandbox environment and network policy for dotfiles templates
# Tool installation remains in Dockerfile.sandbox via /mise/config.toml.
environment:
  variables:
    AI_AGENT: "1"
    LEFTHOOK_CONFIG: lefthook.local.yml
    INSTALL_LOCAL_LEFTHOOK: "0"
permissions:
  network:
    # Keep in sync with allow-domains.txt for the legacy backend (tested).
    allow:
      # Host bridge (also permitted globally by legacy sandbox:setup).
      - "localhost:22"
      - "docs.anthropic.com"
      - "docs.claude.com"
      - "code.claude.com"
      - "skills.sh"
      - "deepwiki.com"
      - "mcp.deepwiki.com"
      - "developer.mozilla.org"
      - "docs.docker.com"
      - "docs.github.com"
      - "docs.aws.amazon.com"
      - "www.python.org"
      - "docs.python.org"
      - "fastapi.tiangolo.com"
      - "nextjs.org"
      - "www.npmjs.com"
      - "mise.jdx.dev"
      - "deb.debian.org"
      - "apt.postgresql.org"
      - "mise-java.jdx.dev"
      - "aws.amazon.com"
      - "developers.openai.com"
