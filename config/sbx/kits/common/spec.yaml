schemaVersion: "2"
kind: mixin
name: dotfiles-common
version: "1.0.0"
description: Shared sandbox environment and network policy for dotfiles templates
# Tool installation remains in Dockerfile.sandbox via /mise/config.toml.
environment:
  variables:
    AI_AGENT: "1"
    TERM: xterm-256color
    LEFTHOOK_CONFIG: lefthook.local.yml
    INSTALL_LOCAL_LEFTHOOK: "0"
permissions:
  network:
    # Balanced preset に無い、調査用ドキュメントやツールの取得先を許可する。
    # 未掲載の通信先は sbx policy approval で個別に許可する。
    # 1項目1パターン。*.example.com は1階層、**.example.com は多階層の subdomain に一致する。
    allow:
      # Host bridge for notifications / plannotator / host-tmux.
      - "localhost:22"
      # AI / Claude
      - "docs.anthropic.com"
      - "docs.claude.com"
      - "code.claude.com"
      - "skills.sh"
      - "deepwiki.com"
      - "mcp.deepwiki.com"
      # stack-diagram の公式ロゴ取得（aws.amazon.com は下の共通許可を使用）
      - "svgl.app"
      - "raw.githubusercontent.com"
      - "cdn.jsdelivr.net"
      - "d1.awsstatic.com"
      # 言語・フレームワーク・ツールの公式ドキュメント
      - "developer.mozilla.org"
      - "docs.docker.com"
      - "docs.github.com"
      - "docs.aws.amazon.com"
      - "www.python.org"
      - "docs.python.org"
      - "fastapi.tiangolo.com"
      - "nextjs.org"
      - "www.npmjs.com"
      - "mise.jdx.dev"
      - "deb.debian.org"
      - "apt.postgresql.org"
      - "mise-java.jdx.dev"
      - "aws.amazon.com"
      - "developers.openai.com"
      - "cli.github.com"
      - "git-scm.com"
      - "neovim.io"
      - "www.chezmoi.io"
      - "aquaproj.github.io"
      - "usage.jdx.dev"
      - "fnox.jdx.dev"
      - "docs.astral.sh"
      - "pnpm.io"
      - "bun.sh"
      - "www.typescriptlang.org"
      - "react.dev"
      - "vite.dev"
      - "vitest.dev"
      - "playwright.dev"
      - "docs.pytest.org"
      - "docs.pydantic.dev"
      - "docs.rs"
      - "doc.rust-lang.org"
      - "pkg.go.dev"
      - "developer.hashicorp.com"
      - "containers.dev"
      - "docs.renovatebot.com"
      - "lefthook.dev"
      - "www.shellcheck.net"
      - "zsh.sourceforge.io"
      - "starship.rs"
      - "atuin.sh"
      - "docs.atuin.sh"
      - "gh-dash.dev"
      - "lnav.org"
      - "yazi-rs.github.io"
      # Q&A・技術記事
      - "stackoverflow.com"
      - "zenn.dev"
      - "qiita.com"
      - "**.wikipedia.org"
      # パッケージ・ビルドツールの取得元（Balanced preset に無いもの）
      # mise のバージョン解決・インストール
      - "mise-versions.jdx.dev"
      - "mise.run"
      # GitHub のリリース・メタデータ取得
      - "api.github.com"
      # Homebrew のパッケージ定義・ボトル情報
      - "formulae.brew.sh"
      # 署名検証（mise / aqua / cosign）
      - "fulcio.sigstore.dev"
      - "rekor.sigstore.dev"
      - "tuf-repo-cdn.sigstore.dev"
      # FE の openapi-generator-cli が初回起動時にジェネレータ本体（jar）を Maven Central からダウンロードする
      - "repo1.maven.org"
