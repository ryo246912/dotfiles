# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Claude subscription
description: Claude Code with sandbox-scoped subscription Bearer authentication
build: |
  FROM docker.io/sbx/claude:latest
  USER agent
  WORKDIR /home/agent/workspace
  ENTRYPOINT ["claude", "--dangerously-skip-permissions"]
  CMD []
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com
          - bridge.claudeusercontent.com
          - mcp-proxy.anthropic.com
          - platform.claude.com
          - claude.ai
          - claude.com
  - type: com.docker.sandbox/credential@1
    config:
      service: anthropic
      apiKey:
        name: CLAUDE_CODE_OAUTH_TOKEN
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: Authorization
            format: Bearer %s
      phase: runtime
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.claude/skills
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            python3 - <<'PYSETTINGS'
            import json, pathlib
            home = pathlib.Path('/home/agent')
            p = home / '.claude/settings.json'
            p.parent.mkdir(parents=True, exist_ok=True)
            d = json.loads(p.read_text()) if p.exists() else {}
            d.pop('apiKeyHelper', None)
            p.write_text(json.dumps(d))
            p = home / '.claude.json'
            # Leave an absent file for sandbox-post-create.sh to copy from the host.
            if p.exists():
                d = json.loads(p.read_text())
                d['hasCompletedOnboarding'] = True
                p.write_text(json.dumps(d))
            PYSETTINGS
          user: agent
          # v3 hooks filter the environment; mise shims need the image's config and trust paths.
          env:
            - MISE_DATA_DIR
            - MISE_CONFIG_DIR
            - MISE_STATE_DIR
            - MISE_CACHE_DIR
            - MISE_TRUSTED_CONFIG_PATHS
        - command: |
            set -eu
            [ -n "${MCP_GATEWAY_URL:-}" ] || exit 0
            claude mcp add mcp-gateway "$MCP_GATEWAY_URL" --transport http --scope user --header "Authorization: Bearer $MCP_SENTINEL_TOKEN_NAME" || true
          user: agent
          env:
            - MISE_DATA_DIR
            - MISE_CONFIG_DIR
            - MISE_STATE_DIR
            - MISE_CACHE_DIR
            - MISE_TRUSTED_CONFIG_PATHS
            - MCP_GATEWAY_URL
            - MCP_SENTINEL_TOKEN_NAME
