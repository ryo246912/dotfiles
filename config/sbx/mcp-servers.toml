# sandbox から使う MCP サーバ（mise run sandbox:mcp がホストの sbx mcp に登録する）。
# sandbox 内の agent は自身の MCP 設定を読まず、ここに並べたサーバだけを gateway 経由で使う
# （docs/docker-sandboxes.md の「MCP の扱い」参照）。
#
# 1 テーブル 1 サーバ。テーブル名が sbx に登録する name になる。
#   url      remote サーバの URL（sbx mcp add --url）
#   command  ホストで起動する stdio サーバのコマンド（npx / uvx など。sbx mcp add --command）
#   package  command で起動するパッケージ。npx は `-y <package>@<version>`、それ以外は
#            `<package>@<version>` を引数の先頭に置く
#   version  package のバージョン。Renovate が更新する（npx は npm、uvx は PyPI）
#   args     package の後ろに渡す引数（`,` を含む値は不可。sbx の --args が `,` 区切りのため）
#   options  sbx mcp add にそのまま渡す追加オプション（--header / --scope / --dir など）
#
# version などを変えて sandbox:mcp を再実行すると、そのサーバを登録し直す。
# 環境ごと（work3 / private など）のサーバは mcp-servers.<name>.toml に書く（gitignore 済み）。

# OAuth。初回のみブラウザで認可する（トークンはホストのキーチェーンへ）
[notion]
url = "https://mcp.notion.com/mcp"

# ホストの ~/.aws の認証情報（profile / SSO）をそのまま使う
[aws-api]
command = "uvx"
package = "awslabs.aws-api-mcp-server"
version = "1.5.6"

# ホストで起動している Chrome に接続する
[chrome-devtools]
args    = ["--browser-url=http://localhost:9222"]
command = "npx"
package = "chrome-devtools-mcp"
version = "1.10.1"
