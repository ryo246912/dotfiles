schemaVersion: "1"
# agent / workspace / template / mounts / env / ports are supplied by sbx-agent's runtime overlay.
agent: claude
args:
  coderabbitProfile:
    default: private
    enum: [private, work3]
kits:
  - ./kits/common
  - ./kits/coderabbit
sandboxOptions:
  template: sbx-agent:claude
  pullPolicy: missing
  skills: readonly
env:
  CODERABBIT_REGION: us
secrets:
  github:
    command: gh auth token
lifecycle:
  postCreate:
    - name: Provision sandbox-local CodeRabbit API key
      command: python3 ./scripts/coderabbit-credentials.py --profile ${{ env.args.coderabbitProfile }}
      workdir: ${{ env.fileDir }}
