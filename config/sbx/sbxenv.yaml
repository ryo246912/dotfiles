schemaVersion: "1"
# agent / workspace / template / mounts / env / ports are supplied by sbx-agent's runtime overlay.
agent: claude
args:
  coderabbitProfile:
    default: private
    enum: [private, work3]
kits:
  - ./kits/common
  - ./kits/coderabbit
sandboxOptions:
  template: sbx-agent:claude
  pullPolicy: missing
  skills: readonly
env:
  CODERABBIT_REGION: us
secrets:
  github:
    command: gh auth token
  coderabbit:
    command: fnox get --profile ${{ env.args.coderabbitProfile }} CODERABBIT_API_KEY
bindings:
  coderabbit:
    apiKey:
      domains:
        - api.coderabbit.ai
        - ide.coderabbit.ai
