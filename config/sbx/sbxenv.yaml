schemaVersion: "1"
# agent / workspace / template / mounts / env / ports are supplied by sbx-agent's runtime overlay.
agent: claude
args:
  coderabbitProfile:
    default: private
    enum: [private, work3]
  coderabbitRegion:
    default: us
    enum: [us, eu]
kits:
  - ./kits/common
  - ./kits/coderabbit
sandboxOptions:
  template: sbx-agent:claude
  pullPolicy: missing
  skills: readonly
secrets:
  github:
    command: gh auth token
lifecycle:
  postCreate:
    - name: Sign in to CodeRabbit with the selected fnox profile
      command: |
        set -eu
        key=$(fnox --config "${XDG_CONFIG_HOME:-$HOME/.config}/fnox/config.toml" get --profile ${{ env.args.coderabbitProfile }} CODERABBIT_API_KEY)
        test -n "$key"
        printf '%s' "$key" | sbx exec -i "$SBX_SANDBOX_NAME" sh -c '
          exec coderabbit auth login --api-key "$(cat)" --region "$1"
        ' sh ${{ env.args.coderabbitRegion }}
