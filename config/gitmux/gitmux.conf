# tmuxのpane-border-formatから呼び出すgitmuxの設定
# 背景はペイン名と同じ黄色(#ffff00)に揃え、文字色は黄色の上でも読める濃い色にする
tmux:
  symbols:
    branch: ""
    hashprefix: ":"
    ahead: "↑"
    behind: "↓"
    staged: "+"
    conflict: "="
    modified: "!"
    untracked: "?"
    stashed: "$"
    insertions: "Σ"
    deletions: "Δ"
    clean: "✓"
  styles:
    clear: "#[none,fg=#000000,bg=#ffff00]"
    state: "#[fg=#af0000,bg=#ffff00,bold]"
    branch: "#[fg=#000000,bg=#ffff00,bold]"
    remote: "#[fg=#005f87,bg=#ffff00]"
    divergence: "#[fg=#000000,bg=#ffff00]"
    staged: "#[fg=#005f00,bg=#ffff00,bold]"
    conflict: "#[fg=#af0000,bg=#ffff00,bold]"
    modified: "#[fg=#af0000,bg=#ffff00,bold]"
    untracked: "#[fg=#5f00af,bg=#ffff00,bold]"
    stashed: "#[fg=#005f87,bg=#ffff00,bold]"
    insertions: "#[fg=#005f00,bg=#ffff00]"
    deletions: "#[fg=#af0000,bg=#ffff00]"
    clean: "#[fg=#005f00,bg=#ffff00,bold]"
  layout: [" ", branch, divergence, flags, stats, " "]
  options:
    branch_max_len: 40
    branch_trim: center
    ellipsis: …
    hide_clean: false
    swap_divergence: true
    divergence_space: false
    flags_without_count: false
