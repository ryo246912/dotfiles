# MCP サーバの定義。書式は APM の apm.yml の dependencies.mcp と同じ
# （https://github.com/microsoft/apm の manifest schema）。
#
# MCP はどの agent の native MCP にも登録せず、mcpc（CLI）から必要な時だけ使う（docs/mcpc.md）。
# - mise run apm:install（apm:install-mcpc）が mcp.yml と mcp.<name>.yml をまとめた manifest を
#   隔離した HOME で apm install し、mcpc 専用の config（~/.local/state/mcpc/apm-home/.copilot/mcp-config.json）
#   と sandbox 用の config（~/.config/mcpc/sandbox/mcp-config.json）を生成する。
# - sandbox からは host の mcpc proxy（mise run sandbox:mcpc）経由で使う。sbx の gateway に載せる
#   経路もオプションで残している（mise run sandbox:mcp-gateway）。
# - すべて self-defined（registry: false）で書く。registry 参照は解決後のコマンドが残らないため使えない。
# - stdio はパッケージを args の `<package>@<version>` で固定し、Renovate で更新する
#   （npx は npm、uvx は PyPI。command の直後に args を書く）。
# - mcpc は stdio サーバに最小限の環境変数しか渡さないため、ホストの環境から渡したい値は
#   env に `KEY: "${KEY}"` で書く（aws-vault exec / fnox exec が設定した値を転送する）。
#   sbx gateway 経路では `${KEY}` だけの値は書かなかったものとして扱い（ホストの環境から継承する）、
#   それ以外の値は `env K=V ... <command>` で包んで sbx に渡す。
# - sbx_options は sbx gateway 経路で sbx mcp add にそのまま渡す追加オプション（--dir / --skip-ssrf-check など）。
#   APM の書式では未定義のキーなので APM 側では passthrough として無視される。
# - 環境ごと（work2 / work3 / private など）のサーバは mcp.<name>.yml に書く（gitignore 済み、
#   雛形は mcp.<name>.yml.example）。同じ name を複数のファイルに書いた場合は先に読んだ方を使う。
dependencies:
  mcp:
    - name: deepwiki
      registry: false
      transport: http
      url: https://mcp.deepwiki.com/mcp
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@upstash/context7-mcp@4.3.0"]
    # ホストで起動している Chrome（--remote-debugging-port=9222）に CDP で接続する
    # （--browser-url が Playwright MCP の --cdp-endpoint に相当する）
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "chrome-devtools-mcp@1.10.1", "--browser-url=http://localhost:9222"]
