# MISE_ENV=mac のときだけ読み込まれる、macOS 専用の [dotfiles] エントリ。
# 元の .chezmoiignore で `{{ else }}` 分岐（darwin 以外）に *mac*/*brew*/*karabiner*/*raycast* として
# 除外されていたファイル群（= macOS でのみ配置されていたもの）。

[dotfiles]
"~/.config/mise"        = { source = "config-mac/mise", mode = "copy" }
"~/.config/navi/cheats" = { source = "config-mac/navi/cheats", mode = "copy" }
"~/.config/raycast"     = { source = "config-mac/raycast", mode = "copy" }
"~/.config/zabrze"      = { source = "config-mac/zabrze", mode = "copy" }
"~/.config/zsh/lazy"    = { source = "config-mac/zsh/lazy", mode = "copy" }
