# "~/.config" は mise.toml の共通エントリを、旧 .chezmoiignore の darwin 分岐
# （**/*win*・.config/atuin/fly.toml）の除外を足して上書きする。同一キーは merge ではなく
# 上書きになるため、共通の exclude（"agentsview/tests"）も繰り返し書くこと。
# hammerspoon・vicinae は macOS 限定の設定なので config-mac/ から symlink-each で配る。
# vicinae の shortcuts/snippets は ~/.local/share 配下のデータファイルだが、共有してよい分を
# templates/vicinae/*.json.tera から生成する。秘密の値・PC ごとの値（vicinae.secret.yaml、下の [vars] で
# 読み込む）は git 管理外。GUI での変更と利用回数は apply で上書きされる（docs/raycast.md 参照）。
[vars]
_.file = "templates/vicinae/vicinae.secret.yaml"

[dotfiles]
"~/.config/hammerspoon"                           = { source = "config-mac/hammerspoon", mode = "symlink-each" }
"~/.config/mise/config.mac.toml"                  = { source = "config-mac/mise/config.mac.toml", mode = "symlink" }
"~/.config/mise/tasks/bootstrap-mac.toml"         = { source = "config-mac/mise/tasks/bootstrap-mac.toml", mode = "symlink" }
"~/.config/vicinae"                               = { source = "config-mac/vicinae", mode = "symlink-each" }
"~/.local/share/vicinae/shortcuts/shortcuts.json" = { source = "templates/vicinae/shortcuts.json.tera", mode = "template", template = "tera" }
"~/.local/share/vicinae/snippets/snippets.json"   = { source = "templates/vicinae/snippets.json.tera", mode = "template", template = "tera" }

[dotfiles."~/.config"]
exclude = ["agentsview/tests", "hunk/extensions", "*win*", "atuin/fly.toml"]
mode    = "symlink-each"
source  = "config"
