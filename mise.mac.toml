# MISE_ENV=mac のときだけ読み込まれる、macOS 専用の [dotfiles] エントリ。
# 元の .chezmoiignore で `{{ else }}` 分岐（darwin 以外）に *mac*/*brew*/*karabiner*/*raycast* として
# 除外されていたファイル群（= macOS でのみ配置されていたもの）。

[dotfiles]
"~/.config/mise/config.mac.toml" = { source = "config-mac/mise/config.mac.toml", mode = "copy" }
"~/.config/mise/tasks/bootstrap-mac.toml" = { source = "config-mac/mise/tasks/bootstrap-mac.toml", mode = "copy" }
"~/.config/navi/cheats/mac.cheat.md" = { source = "config-mac/navi/cheats/mac.cheat.md", mode = "copy" }
"~/.config/raycast" = { source = "config-mac/raycast", mode = "copy" }
"~/.config/zabrze/mac.toml" = { source = "config-mac/zabrze/mac.toml", mode = "copy" }
"~/.config/zsh/lazy/mac.zsh" = { source = "config-mac/zsh/lazy/mac.zsh", mode = "copy" }
