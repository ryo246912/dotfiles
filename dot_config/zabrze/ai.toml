[[snippets]]
name    = "ccmanager"
snippet = "ccmanager"
trigger = "ccm"

# devcontainer で起動する。config の選択と .git の mount は devc が cwd から判定する。
# account2 / work3 などは ccmanager の preset で選ぶ（docs/ai.md 参照）。
[[snippets]]
name    = "ccmanager devcontainer"
snippet = "ccmanager --devc-up-command \"devc up\" --devc-exec-command \"devc exec\""
trigger = "ccmc"

# CCMANAGER_MULTI_PROJECT_ROOT 配下の project（multi-worktree の task root や
# ccmanager の worktree）を横断管理する。どのディレクトリからでも起動できる。
[[snippets]]
name    = "ccmanager devcontainer(multi-project)"
snippet = "ccmanager --multi-project --devc-up-command \"devc up\" --devc-exec-command \"devc exec\""
trigger = "ccmcm"

[[snippets]]
name    = "devcontainer up"
snippet = "devc up"
trigger = "dcup"

[[snippets]]
cursor  = "👇"
name    = "devcontainer exec"
snippet = "devc exec -- 👇"
trigger = "dcex"

[[snippets]]
name    = "mcp-cli"
snippet = "mcp-cli -c ~/.copilot/mcp-config.json"
trigger = "mcp"

[[snippets]]
global  = true
name    = "claude"
snippet = "claude"
trigger = "cl"

[[snippets]]
global  = true
name    = "claude2"
snippet = "claude2"
trigger = "cl2"

[[snippets]]
global  = true
name    = "claude --dangerously-skip-permissions"
snippet = "claude --dangerously-skip-permissions"
trigger = "cly"

[[snippets]]
global  = true
name    = "copilot"
snippet = "copilot"
trigger = "co"

[[snippets]]
global  = true
name    = "copilot --yolo"
snippet = "copilot --yolo"
trigger = "coy"

[[snippets]]
global  = true
name    = "codex"
snippet = "codex"
trigger = "cx"

[[snippets]]
global  = true
name    = "codex --yolo"
snippet = "codex --yolo"
trigger = "cxy"

[[snippets]]
context = ".*claude(2)?\\s"
global  = true
name    = "(ccmanager) --multi-project"
snippet = "--multi-project"
trigger = "mp"

[[snippets]]
context = ".*claude(2)?\\s"
global  = true
name    = "(claude*) --dangerously-skip-permissions"
snippet = "--dangerously-skip-permissions"
trigger = "yl"

[[snippets]]
context = ".*(copilot|codex)\\s"
global  = true
name    = "(copilot|codex) --yolo"
snippet = "--yolo"
trigger = "yl"
