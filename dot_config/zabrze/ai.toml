[[snippets]]
name    = "ccmanager"
snippet = "ccmanager"
trigger = "ccm"

[[snippets]]
name    = "ccmanager devcontainer"
snippet = "ccmanager --devc-up-command \"devcontainer up --workspace-folder . --config $HOME/.config/devcontainer/devcontainer.json --mount-workspace-git-root=false --mount-git-worktree-common-dir=true\" --devc-exec-command \"devcontainer exec --workspace-folder . --config $HOME/.config/devcontainer/devcontainer.json --mount-workspace-git-root=false --mount-git-worktree-common-dir=true\""
trigger = "ccmc"

[[snippets]]
cursor          = "👇"
evaluate        = true
name            = "ccmanager devcontainer(claude account2)"
snippet         = "ccmanager --devc-up-command \"devcontainer up --workspace-folder . --config $HOME/.config/devcontainer/devcontainer.json --mount-workspace-git-root=false --mount-git-worktree-common-dir=true\" --devc-exec-command \"devcontainer exec --workspace-folder . --config $HOME/.config/devcontainer/devcontainer.json --mount-workspace-git-root=false --mount-git-worktree-common-dir=true env CLAUDE_CONFIG_DIR=/home/vscode/.claude-account2 claude --dangerously-skip-permissions\""
trigger-pattern = "(^ccmc2$|ccmcc2)"

# multi-worktree の task root を project とする multi-project mode。
# --config を指定せず、各 task root に生成された .devcontainer/devcontainer.json を使う。
# worktrees ディレクトリ（group の base_dir）で実行する。
[[snippets]]
name    = "ccmanager devcontainer(multi-worktree)"
snippet = "CCMANAGER_MULTI_PROJECT_ROOT=$PWD ccmanager --multi-project --devc-up-command \"devcontainer up --workspace-folder .\" --devc-exec-command \"devcontainer exec --workspace-folder .\""
trigger = "ccmcm"

[[snippets]]
cursor          = "👇"
evaluate        = true
name            = "ccmanager devcontainer(multi-worktree, claude account2)"
snippet         = "CCMANAGER_MULTI_PROJECT_ROOT=$PWD ccmanager --multi-project --devc-up-command \"devcontainer up --workspace-folder .\" --devc-exec-command \"devcontainer exec --workspace-folder . env CLAUDE_CONFIG_DIR=/home/vscode/.claude-account2 claude --dangerously-skip-permissions\""
trigger-pattern = "(^ccmcm2$)"

[[snippets]]
name    = "devcontainer up"
snippet = "devcontainer up --workspace-folder . --config $HOME/.config/devcontainer/devcontainer.json --mount-workspace-git-root=false --mount-git-worktree-common-dir=true"
trigger = "dcup"

[[snippets]]
cursor  = "👇"
name    = "devcontainer exec"
snippet = "devcontainer exec --workspace-folder . --config $HOME/.config/devcontainer/devcontainer.json --mount-workspace-git-root=false --mount-git-worktree-common-dir=true -- 👇"
trigger = "dcex"

[[snippets]]
name    = "mcp-cli"
snippet = "mcp-cli -c ~/.copilot/mcp-config.json"
trigger = "mcp"

[[snippets]]
global  = true
name    = "claude"
snippet = "claude"
trigger = "cl"

[[snippets]]
global  = true
name    = "claude2"
snippet = "claude2"
trigger = "cl2"

[[snippets]]
global  = true
name    = "claude --dangerously-skip-permissions"
snippet = "claude --dangerously-skip-permissions"
trigger = "cly"

[[snippets]]
global  = true
name    = "copilot"
snippet = "copilot"
trigger = "co"

[[snippets]]
global  = true
name    = "copilot --yolo"
snippet = "copilot --yolo"
trigger = "coy"

[[snippets]]
global  = true
name    = "codex"
snippet = "codex"
trigger = "cx"

[[snippets]]
global  = true
name    = "codex --yolo"
snippet = "codex --yolo"
trigger = "cxy"

[[snippets]]
context = ".*claude(2)?\\s"
global  = true
name    = "(ccmanager) --multi-project"
snippet = "--multi-project"
trigger = "mp"

[[snippets]]
context = ".*claude(2)?\\s"
global  = true
name    = "(claude*) --dangerously-skip-permissions"
snippet = "--dangerously-skip-permissions"
trigger = "yl"

[[snippets]]
context = ".*(copilot|codex)\\s"
global  = true
name    = "(copilot|codex) --yolo"
snippet = "--yolo"
trigger = "yl"
