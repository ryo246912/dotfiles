[[snippets]]
name    = "ccmanager"
snippet = "ccmanager"
trigger = "ccm"

[[snippets]]
name    = "ccmanager devcontainer"
snippet = "ccmanager --devc-up-command \"devcontainer up --workspace-folder . --config ${DEVCONTAINER_CONFIG:-$HOME/.config/devcontainer/devcontainer.json} --mount-workspace-git-root=false --mount-git-worktree-common-dir=true\" --devc-exec-command \"devcontainer exec --workspace-folder . --config ${DEVCONTAINER_CONFIG:-$HOME/.config/devcontainer/devcontainer.json} --mount-workspace-git-root=false --mount-git-worktree-common-dir=true\""
trigger = "ccmc"

[[snippets]]
name    = "devcontainer up"
snippet = "devcontainer up --workspace-folder . --config ${DEVCONTAINER_CONFIG:-$HOME/.config/devcontainer/devcontainer.json} --mount-workspace-git-root=false --mount-git-worktree-common-dir=true"
trigger = "dcup"

[[snippets]]
cursor  = "👇"
name    = "devcontainer exec"
snippet = "devcontainer exec --workspace-folder . --config ${DEVCONTAINER_CONFIG:-$HOME/.config/devcontainer/devcontainer.json} --mount-workspace-git-root=false --mount-git-worktree-common-dir=true -- 👇"
trigger = "dcex"

[[snippets]]
name    = "mcp-cli"
snippet = "mcp-cli -c ~/.copilot/mcp-config.json"
trigger = "mcp"

[[snippets]]
global  = true
name    = "claude"
snippet = "claude"
trigger = "cl"

[[snippets]]
global  = true
name    = "claude --dangerously-skip-permissions"
snippet = "claude --dangerously-skip-permissions"
trigger = "cly"

[[snippets]]
global  = true
name    = "copilot"
snippet = "copilot"
trigger = "co"

[[snippets]]
global  = true
name    = "copilot --yolo"
snippet = "copilot --yolo"
trigger = "coy"

[[snippets]]
global  = true
name    = "codex"
snippet = "codex"
trigger = "cx"

[[snippets]]
global  = true
name    = "codex --yolo"
snippet = "codex --yolo"
trigger = "cxy"

[[snippets]]
context = ".*claude\\s"
global  = true
name    = "(ccmanager) --multi-project"
snippet = "--multi-project"
trigger = "mp"

[[snippets]]
context = ".*claude\\s"
global  = true
name    = "(claude*) --dangerously-skip-permissions"
snippet = "--dangerously-skip-permissions"
trigger = "yl"

[[snippets]]
context = ".*(copilot|codex)\\s"
global  = true
name    = "(copilot|codex) --yolo"
snippet = "--yolo"
trigger = "yl"
