# clrnd（https://github.com/masasuzu/clrnd）がdeployするCloud Run service定義。
#
# このfileはclrndが所有する。image、resource、scaling、環境変数、Secret Manager
# 参照がその範囲である。周辺のresource（runtime service account、Secret Manager
# のcontainerとIAM、Artifact Registry、allUsers invoker binding）はTerraformが
# 所有する。同じresourceを2つのtoolが持たないようにしている。
#
# このfileはparseされる前にGo templateとしてrenderされる。展開されるのは下の
# template呼び出しだけで、それ以外の場所にある波括弧2つはactionの開始と解釈される
# ためescapeが必要である（clrndのREADMEを参照）。
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ryo-agentsview
  annotations:
    # 公開viewer。Cloud Runはinternetからのtrafficを受けるが、AgentsView自身の
    # bearer token（config.tomlのrequire_auth）は引き続き必要である。
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # idle時は0まで縮める。read-only viewerがcrawlerに叩かれて課金が伸びない
        # よう、上限も抑える。
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        # request外ではCPUを絞り（cpu_idle）、起動時はboostする。起動時に
        # PostgreSQL接続とschema checkが走るためである。
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Terraformのoutput runtime_service_account。下の2つのsecretを読み、
      # imageをpullできる。deployはできない。
      serviceAccountName: '{{ must_env "GCP_RUNTIME_SERVICE_ACCOUNT" }}'
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: '{{ must_env "AGENTSVIEW_IMAGE" }}'
          # AGENTSVIEW_DATA_DIR（imageでは/data）は書き込み可能でなければならない。
          # AgentsViewはconfigを読む前に同じdirectoryへlock fileを作り、それは
          # configの存在確認よりも前に起きる。Secret Managerのvolumeはread-onlyな
          # ので、secretはdata dirの外へmountし、ここでcopyする。Flyの[[files]]も
          # 書き込み可能な場所へconfigを置いていた。
          command:
            - /bin/sh
            - -c
            - |
              set -e
              data_dir="${AGENTSVIEW_DATA_DIR:-/data}"
              mkdir -p "$data_dir"
              # cp／installはcopy前後でsourceのmetadataを比較し、変化していると
              # "replaced while being copied" で中断する。secretのmountはFUSE
              # ベースでmetadataが安定しないため誤検知する。この検査を持たない
              # 素のread/writeを使う。
              umask 077
              cat /etc/agentsview/config.toml > "$data_dir/config.toml"
              chmod 600 "$data_dir/config.toml"
              exec /usr/local/bin/docker-entrypoint.sh "$@"
            - agentsview-cloudrun
          # `pg serve` はbind先を127.0.0.1へ戻し、明示flagだけを見る。つまり
          # listen先はentrypointが受け取る引数で決まる。upstreamはそれをimageの
          # CMD（--host 0.0.0.0 --no-browser）として渡している。将来imageのCMDが
          # 変わってCloud Runがprobeするinterfaceから外れないよう、ここで固定する。
          # このargsはCMDを置き換えるので、CMDのsupersetを保つこと。
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --no-browser
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            # upstreamのentrypointを `agentsview pg serve` に切り替える。
            - name: PG_SERVE
              value: "1"
            - name: AGENTSVIEW_DISABLE_UPDATE_CHECK
              value: "1"
            - name: AGENTSVIEW_PG_SCHEMA
              value: agentsview
            # read-onlyのCockroachDB URL。値はSecret Managerに置いたままで、
            # このfileにもclrndのdiffにも出ない。
            - name: AGENTSVIEW_PG_URL
              valueFrom:
                secretKeyRef:
                  name: agentsview-pg-url
                  # "latest" ではなく数字を使う。Cloud Runはsecret参照をinstance
                  # 起動時に解決するため、"latest" だとrevisionの値がinstanceの
                  # 起動時刻に依存してしまう。
                  key: '{{ must_env "AGENTSVIEW_PG_URL_SECRET_VERSION" }}'
          volumeMounts:
            # /data にしてはいけない。そこはAGENTSVIEW_DATA_DIRで、書き込み可能
            # なままにしておく必要がある。
            - name: config
              mountPath: /etc/agentsview
      volumes:
        - name: config
          secret:
            secretName: agentsview-config-toml
            items:
              - key: '{{ must_env "AGENTSVIEW_CONFIG_SECRET_VERSION" }}'
                path: config.toml
  traffic:
    # 最新revisionへ追従する。`clrnd rollback` がここをrevision名へ固定し、
    # `clrnd traffic --to-latest` が戻す。
    - percent: 100
      latestRevision: true
