# Cloud Run service definition deployed with clrnd (https://github.com/masasuzu/clrnd).
#
# clrnd owns this file: image, resources, scaling, environment, and Secret
# Manager references. Terraform owns everything around it—the runtime service
# account, the Secret Manager containers and their IAM, Artifact Registry, and
# the allUsers invoker binding—so no resource has two owners.
#
# The file is rendered as a Go template before it is parsed. Only the template
# calls below are expanded; a literal double open brace anywhere else in the
# file would start an action and has to be escaped (see the clrnd README).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ryo-agentsview
  annotations:
    # Public viewer: Cloud Run accepts traffic from the internet, and AgentsView
    # still requires its own bearer token (require_auth in config.toml).
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle; cap the fan-out so a crawler cannot run up
        # the bill on a read-only viewer.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        # Throttle CPU outside requests (cpu_idle) and boost it during startup,
        # which is when the PostgreSQL connection and migrations happen.
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Terraform output: runtime_service_account. It may read the two secrets
      # below and pull images; it cannot deploy.
      serviceAccountName: '{{ must_env "GCP_RUNTIME_SERVICE_ACCOUNT" }}'
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: '{{ must_env "AGENTSVIEW_IMAGE" }}'
          # AGENTSVIEW_DATA_DIR (/data in the image) must be WRITABLE: loading
          # the config takes a lock file next to it, and that happens before
          # AgentsView even checks whether the config exists. A Secret Manager
          # volume is read-only, so the secret is mounted outside the data dir
          # and copied in here, which is what Fly's [[files]] did as well.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              data_dir="${AGENTSVIEW_DATA_DIR:-/data}"
              mkdir -p "$data_dir"
              # cp/install compare the source's metadata before and after the
              # copy and abort with "replaced while being copied" when it moves.
              # The secret mount is FUSE-backed and does not report stable
              # metadata, so use a plain read/write, which makes no such check.
              umask 077
              cat /etc/agentsview/config.toml > "$data_dir/config.toml"
              chmod 600 "$data_dir/config.toml"
              exec /usr/local/bin/docker-entrypoint.sh "$@"
            - agentsview-cloudrun
          # `pg serve` resets the bind address to 127.0.0.1 and honours only
          # explicit flags, so the listener depends entirely on the arguments
          # the entrypoint receives. Upstream ships them as the image CMD
          # (--host 0.0.0.0 --no-browser); pin them here so a future image
          # cannot silently move the listener off the interface Cloud Run
          # probes. These args replace that CMD, so keep them a superset of it.
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --no-browser
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            # Switch the upstream entrypoint to `agentsview pg serve`.
            - name: PG_SERVE
              value: "1"
            - name: AGENTSVIEW_DISABLE_UPDATE_CHECK
              value: "1"
            - name: AGENTSVIEW_PG_SCHEMA
              value: agentsview
            # Read-only CockroachDB URL. The value stays in Secret Manager and
            # never appears in this file or in a clrnd diff.
            - name: AGENTSVIEW_PG_URL
              valueFrom:
                secretKeyRef:
                  name: agentsview-pg-url
                  # A number, never "latest": Cloud Run resolves the reference per
                  # instance at startup, so "latest" makes a revision's values
                  # depend on when each instance happened to start.
                  key: '{{ must_env "AGENTSVIEW_PG_URL_SECRET_VERSION" }}'
          volumeMounts:
            # Never /data: that is AGENTSVIEW_DATA_DIR and has to stay writable.
            - name: config
              mountPath: /etc/agentsview
      volumes:
        - name: config
          secret:
            secretName: agentsview-config-toml
            items:
              - key: '{{ must_env "AGENTSVIEW_CONFIG_SECRET_VERSION" }}'
                path: config.toml
  traffic:
    # Follow the newest revision. `clrnd rollback` pins this to a revision name
    # and `clrnd traffic --to-latest` puts it back.
    - percent: 100
      latestRevision: true
