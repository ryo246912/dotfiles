[tools]
"aqua:Songmu/laminate"   = "0.0.4"
"aqua:k1LoW/deck"        = "1.24.1"
"aqua:supabase/cli"      = "2.100.1"
"github:render-oss/cli"  = { version = "2.15.1", rename_exe = "render" }
"github:superfly/flyctl" = "0.4.29"

[bootstrap.packages]
# tailscale-app は pkg インストーラが sudo を要求する（`mise run bootstrap:mac-packages`
# の google-drive と同じ理由）ため、こちらではなく dot_config/mise/tasks/bootstrap-mac.toml
# 側で real brew から導入する
"brew-cask:keycastr"    = "latest"
"brew-cask:termius"     = "latest"
"brew-cask:thunderbird" = "latest"
