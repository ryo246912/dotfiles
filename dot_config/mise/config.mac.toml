[tools]
"github:hzqtc/taproom" = { version = "0.6.2", bin = "taproom" }

# terminal-browser（zenbu-labs/terminal-browser）: ターミナル内で動く Chromium ブラウザ。
# kitty graphics protocol 対応端末（ghostty 等）で pixel 描画するため Apple Silicon macOS 専用。
# npm/aqua/github などの registry では配布されておらず GitHub Release にもバイナリ資産が無い
# （公式 install は terminal-browser.sh の curl|bash が Cloudflare R2 の tarball を取得する方式）
# ため、http backend で R2 の安定 URL から直接取得する。version を上げれば URL の v{{version}} も
# 追従する。checksum は lockfile=true により初回 install 時に mise.lock へ記録される。
"http:terminal-browser" = { version = "0.3.2", platforms.macos-arm64 = { url = "https://terminal-browser.sh/dl/stable/v{{version}}/terminal-browser-darwin-arm64.tar.gz", strip_components = 1, bin_path = "bin" } }

[bootstrap.packages]
# silicon は mac 専用（config.mac.toml の brew:silicon, native arm64。harfbuzz 等の依存も
# brew が解決）。aqua の darwin prebuilt は x86_64 で /usr/local(Intel brew) の libharfbuzz に
# 動的リンクしており arm64 mac では dyld で読めず起動不可のため使わない。
"brew:blueutil"     = "latest"
"brew:colordiff"    = "latest"
"brew:coreutils"    = "latest"
"brew:ffmpeg"       = "latest"
"brew:findutils"    = "latest"
"brew:git"          = "latest"
"brew:gnu-sed"      = "latest"
"brew:gnupg"        = "latest"
"brew:goaccess"     = "latest"
"brew:grep"         = "latest"
"brew:pinentry-mac" = "latest"
"brew:silicon"      = "latest"
"brew:tig"          = "latest"
"brew:tree"         = "latest"
"brew:ugrep"        = "latest"
