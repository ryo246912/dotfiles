# mac 専用機能が要求する mise の最小版（config.toml より新しい版にする）。
# 2026.9.12: 独自 tap formula の評価（brew:felixkratz/formulae/borders）と launchd agent の process_type。
# chezmoi の post-apply hook は mac ではこの値を優先して self-update する
min_version = "2026.9.12"

[env]
# macOSのlibpqは、OpenSSLの既定trust storeをKeychainへ必ずしも橋渡ししない。
# CockroachDBへのverify-full接続がpsql、AgentsView、fnoxの子processで動くよう、
# system CA bundleを明示する。
PGSSLROOTCERT = "/etc/ssl/cert.pem"

[tools]
"cargo:https://github.com/vorojar/md-preview" = { version = "tag:v1.4.0", bin = "md-preview" }
"github:hzqtc/taproom"                        = { version = "0.6.2", bin = "taproom" }
"http:terminal-browser"                       = { version = "0.11.1", platforms.macos-arm64 = { url = "https://terminal-browser.sh/install/dl/stable/v{{ version }}/terminal-browser-darwin-arm64.tar.gz", strip_components = 1, bin_path = "bin" } }

[bootstrap.packages]
# silicon は mac 専用（config.mac.toml の brew:silicon, native arm64。harfbuzz 等の依存も
# brew が解決）。aqua の darwin prebuilt は x86_64 で /usr/local(Intel brew) の libharfbuzz に
# 動的リンクしており arm64 mac では dyld で読めず起動不可のため使わない。
# バージョン部分のコメントは実インストールには使われず、renovate が新バージョンを検知して
# PR を作成するためのマーカー。実際のアップグレードは "latest" 指定によりツール自身に任せる。
"brew:blueutil"     = "latest" # 2.13.0
"brew:colordiff"    = "latest" # 1.0.22
"brew:coreutils"    = "latest" # 9.11
"brew:findutils"    = "latest" # 4.11.0
"brew:git"          = "latest" # 2.55.0
"brew:gnu-sed"      = "latest" # 4.10
"brew:gnupg"        = "latest" # 2.5.21
"brew:goaccess"     = "latest" # 1.11
"brew:grep"         = "latest" # 3.12
"brew:imagemagick"  = "latest" # 7.1.2-29
"brew:pinentry-mac" = "latest" # 1.3.1.1
"brew:poppler"      = "latest" # 26.08.0
"brew:silicon"      = "latest" # 0.5.3
"brew:tig"          = "latest" # 2.6.1
"brew:tree"         = "latest" # 2.3.2
"brew:ugrep"        = "latest" # 7.8.3
# 独自 tap（[bootstrap.brew.taps]）の formula。bottle が無く mise がソースビルドする（要 Xcode CLT）。
# Homebrew API メタデータが無く renovate で追えないためバージョンマーカーは付けない。
# 常駐は brew services ではなく下の [bootstrap.macos.launchd.agents.borders] で行う
"brew:felixkratz/formulae/borders" = "latest"

# casks（下記一覧には含まれない例外あり: brew-cask 経由だと `mise bootstrap packages apply`
# が中断/ハングするため `mise run bootstrap:mac-packages`
# （dot_config/mise/tasks/bootstrap-mac.toml）側で real brew から個別導入している。理由:
# - google-japanese-ime: Rosetta が前提
# - thock: 独自 tap + postflight（thock --install）
# - firefox/inkscape: cask 定義が mise 未対応の command_wrapper artifact
# - docker-desktop: cask 定義が auto_updates を使っており mise の brew-cask シムが未対応
# - opencode-bar: 独自 tap（opgginc/tap）が Homebrew API メタデータ未公開
# - google-drive/tailscale-app: pkg インストーラが sudo を要求し post-apply hook（非対話）を
#   止めてしまう。keycastr/termius/thunderbird は auto_updates を使っており mise の
#   brew-cask シムが未対応。zoom は private ホストでしか使わない。
#   いずれも private ホスト限定で bootstrap-mac.toml 側から導入する）
"brew-cask:arc"                   = "latest" # 1.158.1,84367
"brew-cask:battery"               = "latest" # 1.4.0
"brew-cask:bitwarden"             = "latest" # 2026.7.0
"brew-cask:chatgpt"               = "latest" # 26.727.51351
"brew-cask:claude"                = "latest" # 1.24012.11,09114b681f6f333d10cf1a08df130fe7080ddc9b
"brew-cask:codexbar"              = "latest" # 0.47.0
"brew-cask:cursor"                = "latest" # 3.14.7,a758f2241ca99fecf380180b6cbdbbce0f1f42cf
"brew-cask:dbeaver-community"     = "latest" # 26.1.4
"brew-cask:font-hackgen"          = "latest" # 2.10.0
"brew-cask:font-hackgen-nerd"     = "latest" # 2.10.0
"brew-cask:ghostty"               = "latest" # 1.3.1
"brew-cask:google-chrome"         = "latest" # 151.0.7922.72
"brew-cask:hammerspoon"           = "latest" # 1.1.1
"brew-cask:karabiner-elements"    = "latest" # 13.7.0
"brew-cask:keyboardcleantool"     = "latest" # 7
"brew-cask:memory-cleaner"        = "latest" # 5.5.3,271
"brew-cask:obsidian"              = "latest" # 1.13.4
"brew-cask:overview"              = "latest" # 1.2.3-beta
"brew-cask:rectangle"             = "latest" # 1.100
"brew-cask:slack"                 = "latest" # 4.51.180
"brew-cask:syncthing-app"         = "latest" # 2.1.2-1
"brew-cask:thebrowsercompany-dia" = "latest" # 1.42.1,84365
"brew-cask:vicinae"               = "latest" # 0.28.2
"brew-cask:visual-studio-code"    = "latest" # 1.106.3
"brew-cask:wezterm@nightly"       = "latest"

[bootstrap.brew.taps]
# JankyBorders（アプリごとの枠の色は ~/.hammerspoon/app_borders_rules.lua）
"felixkratz/formulae" = "https://github.com/FelixKratz/homebrew-formulae.git"

# borders の常駐（`mise bootstrap macos launchd-agents apply` で適用）。
# 既定の枠設定は bordersrc を作らず起動引数で渡す（引数があると borders は bordersrc を読まない）。
# アプリごとの色は ~/.hammerspoon/app_borders_rules.lua でウィンドウ単位に上書きする。
# inactive_color を透明にしているため、ルールに無いアプリは非フォーカス時に枠を出さない
[bootstrap.macos.launchd.agents.borders]
args = [
    "style=round",
    "width=8.0",
    "hidpi=on",
    "active_color=0xffe2e2e3",
    "inactive_color=0x00000000",
]
environment = { LANG = "en_US.UTF-8" }
keep_alive = true
process_type = "Interactive"
program = "/opt/homebrew/bin/borders"
run_at_load = true
stderr_path = "~/Library/Logs/borders.err.log"
stdout_path = "~/Library/Logs/borders.out.log"

# macOS defaults（`mise bootstrap macos defaults apply` で適用。）
[bootstrap.macos.finder]
show_all_files = true
show_pathbar   = true

[bootstrap.macos.keyboard]
initial_key_repeat = 15
key_repeat         = 2

[bootstrap.macos.defaults]
"NSGlobalDomain"   = { "com.apple.swipescrolldirection" = false }
"com.apple.finder" = { AppleShowAllExtensions = true, QuitMenuItem = true }
