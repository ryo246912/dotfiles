[settings]
auto_install = false
experimental = true
gpg_verify = true
lockfile = true
trusted_config_paths = [
    "~/.local/share/chezmoi",
    "~/.local/share/worktrees",
]

[task_config]
includes = ["tasks/*.toml"]

[settings.npm]
bun = true

[settings.pipx]
uvx = true

[hooks]
postinstall = """
command -v lefthook >/dev/null 2>&1 || exit 0
root="$(git rev-parse --show-toplevel 2>/dev/null)" || exit 0
[ -f "$root/lefthook.yml" ] || exit 0
cd "$root"
lefthook install
"""
