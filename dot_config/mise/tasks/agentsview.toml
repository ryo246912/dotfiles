["agentsview:tokens"]
description = "Generate AgentsView auth_token and cursor_secret values for secret manager storage"
run = '''
set -eu

printf 'AGENTSVIEW_AUTH_TOKEN=%s\n' "$(openssl rand -base64 32)"
printf 'AGENTSVIEW_CURSOR_SECRET=%s\n' "$(openssl rand -base64 32)"
'''

# local databaseもCockroachDBである。container定義は
# dot_config/agentsview/compose.yaml、task本体は
# dot_config/agentsview/scripts/localdb.sh で、ここはmode指定だけを行う。
["agentsview:cockroach:local:up"]
description = "Start the local AgentsView CockroachDB container"
run = '''
set -euo pipefail
script="${AGENTSVIEW_LOCALDB_SCRIPT:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/scripts/localdb.sh}"
[ -f "$script" ] || script=dot_config/agentsview/scripts/localdb.sh
exec bash "$script" up "$@"
'''
shell = "bash -c"

["agentsview:cockroach:local:down"]
description = "Stop the local AgentsView CockroachDB container"
run = '''
set -euo pipefail
script="${AGENTSVIEW_LOCALDB_SCRIPT:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/scripts/localdb.sh}"
[ -f "$script" ] || script=dot_config/agentsview/scripts/localdb.sh
exec bash "$script" down "$@"
'''
shell = "bash -c"

["agentsview:cockroach:local:sql"]
description = "Open a SQL shell against the local AgentsView CockroachDB container"
run = '''
set -euo pipefail
script="${AGENTSVIEW_LOCALDB_SCRIPT:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/scripts/localdb.sh}"
[ -f "$script" ] || script=dot_config/agentsview/scripts/localdb.sh
exec bash "$script" sql "$@"
'''
shell = "bash -c"

["agentsview:cockroach:local:status"]
description = "Show the local CockroachDB version and session counts per machine"
run = '''
set -euo pipefail
script="${AGENTSVIEW_LOCALDB_SCRIPT:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/scripts/localdb.sh}"
[ -f "$script" ] || script=dot_config/agentsview/scripts/localdb.sh
exec bash "$script" status "$@"
'''
shell = "bash -c"

["agentsview:cockroach:local:push"]
description = "Incrementally push local AgentsView sessions into the local CockroachDB container"
run = '''
set -euo pipefail
script="${AGENTSVIEW_LOCALDB_SCRIPT:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/scripts/localdb.sh}"
[ -f "$script" ] || script=dot_config/agentsview/scripts/localdb.sh
