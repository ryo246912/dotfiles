shell = "bash -c"

["agentsview:pg:dump"]
description = "Dump the remote AgentsView PostgreSQL schema through a temporary Fly proxy"
run = '''
set -eu

if [ -z "${AGENTSVIEW_PROXY_PG_URL:-}" ] && [ -z "${_FNOX_REEXEC:-}" ]; then
  export _FNOX_REEXEC=1
  exec fnox exec -- mise run agentsview:pg:dump "$@"
fi

: "${AGENTSVIEW_PROXY_PG_URL:?fnox が未解決です。dot_config/fnox/config.toml を確認してください}"

proxy_port="${AGENTSVIEW_PG_PROXY_PORT:-15432}"
proxy_app="${AGENTSVIEW_PG_APP:-psgl}"
backup_dir="${AGENTSVIEW_BACKUP_DIR:-${XDG_STATE_HOME:-${HOME}/.local/state}/agentsview}"
dump_path="${1:-${backup_dir}/agentsview-$(date +%Y%m%d-%H%M%S).dump}"
proxy_log="$(mktemp)"
pg_service_file="$(mktemp)"

cleanup() {
  if [ -n "${proxy_pid:-}" ]; then
    kill "$proxy_pid" 2>/dev/null || true
    wait "$proxy_pid" 2>/dev/null || true
  fi
  rm -f "$proxy_log" "$pg_service_file"
}

trap cleanup EXIT
trap 'exit 130' INT
trap 'exit 143' TERM

if nc -z 127.0.0.1 "$proxy_port" >/dev/null 2>&1; then
  echo "127.0.0.1:${proxy_port} is already in use" >&2
  exit 1
fi

mkdir -p "$(dirname "$dump_path")"
dump_dir="$(cd "$(dirname "$dump_path")" && pwd -P)"
dump_name="$(basename "$dump_path")"
flyctl proxy "${proxy_port}:5432" -a "$proxy_app" >"$proxy_log" 2>&1 &
proxy_pid=$!

i=0
while ! nc -z 127.0.0.1 "$proxy_port" >/dev/null 2>&1; do
  if ! kill -0 "$proxy_pid" 2>/dev/null; then
    cat "$proxy_log" >&2
    exit 1
  fi
  i=$((i + 1))
  if [ "$i" -ge 40 ]; then
    cat "$proxy_log" >&2
    echo "Timed out waiting for flyctl proxy on 127.0.0.1:${proxy_port}" >&2
    exit 1
  fi
  sleep 0.25
done

pg_url="$AGENTSVIEW_PROXY_PG_URL"
docker_network_args=()
if [ "$(uname -s)" = "Darwin" ] || grep -qi microsoft /proc/sys/kernel/osrelease 2>/dev/null; then
  pg_url="$(printf '%s' "$pg_url" | sed 's/@127\.0\.0\.1:/@host.docker.internal:/')"
  docker_network_args=(--add-host host.docker.internal:host-gateway)
else
  docker_network_args=(--network host)
fi

chmod 600 "$pg_service_file"
printf '[agentsview_dump]\ndbname=%s\n' "$pg_url" >"$pg_service_file"

# Connection credentials stay in the short-lived service file instead of the
# pg_dump argv. The pinned container also removes the host pg_dump dependency.
docker run --rm --user "$(id -u):$(id -g)" "${docker_network_args[@]}" \
  --volume "$pg_service_file:/run/agentsview-pg-service.conf:ro" \
  --volume "$dump_dir:/backup" \
  --env PGSERVICEFILE=/run/agentsview-pg-service.conf \
  postgres:17 \
  sh -c 'umask 077; exec pg_dump "$@"' -- \
  --dbname=service=agentsview_dump --schema=agentsview --format=custom --file="/backup/$dump_name"
echo "AgentsView backup: $dump_path"
'''
shell = "bash -c"

["agentsview:pg:local:up"]
description = "Start the local AgentsView PostgreSQL container"
run         = "docker compose -f dot_config/agentsview/compose.yaml up -d --wait postgres"

["agentsview:pg:local:down"]
description = "Stop the local AgentsView PostgreSQL container"
run         = "docker compose -f dot_config/agentsview/compose.yaml down"

["agentsview:pg:local:restore"]
description = "Restore an AgentsView PostgreSQL dump into the local Docker database"
run = '''
set -eu

dump_path="${1:?Usage: mise run agentsview:pg:local:restore -- <dump-file>}"
compose_file="dot_config/agentsview/compose.yaml"

if [ ! -f "$dump_path" ]; then
  echo "Dump file not found: $dump_path" >&2
  exit 1
fi

docker compose -f "$compose_file" up -d --wait postgres
docker compose -f "$compose_file" exec -T postgres \
  psql --username=agentsview --dbname=agentsview --set=ON_ERROR_STOP=1 \
  --command='DROP SCHEMA IF EXISTS agentsview CASCADE;'
docker compose -f "$compose_file" exec -T postgres \
  pg_restore --username=agentsview --dbname=agentsview --no-owner --no-privileges --exit-on-error \
  <"$dump_path"

echo "Restored AgentsView backup: $dump_path"
'''
shell = "bash -c"

["agentsview:pg:local:status"]
description = "Show session counts in the local AgentsView PostgreSQL container"
run = '''
docker compose -f dot_config/agentsview/compose.yaml exec -T postgres \
  psql --username=agentsview --dbname=agentsview --set=ON_ERROR_STOP=1 \
  --command='SELECT machine, COUNT(*) AS sessions FROM agentsview.sessions GROUP BY machine ORDER BY machine;'
'''
shell = "bash -c"

["agentsview:serve"]
depends = ["agentsview:pg:local:up"]
description = "Start AgentsView with the local Docker PostgreSQL backend"
run = '''
local_pg_user="agentsview"
local_pg_password="agentsview-local"
local_pg_port="${AGENTSVIEW_LOCAL_PG_PORT:-15433}"
export AGENTSVIEW_PG_URL="postgres://${local_pg_user}:${local_pg_password}@127.0.0.1:${local_pg_port}/agentsview?sslmode=disable"
export AGENTSVIEW_PG_SCHEMA="agentsview"
exec agentsview pg serve "$@"
'''
shell = "bash -c"

["agentsview:serve:sqlite"]
description = "Start AgentsView with its local SQLite backend"
run         = "agentsview serve"
