["agentsview:tokens"]
description = "Generate AgentsView auth_token and cursor_secret values for secret manager storage"
run = '''
set -eu

printf 'AGENTSVIEW_AUTH_TOKEN=%s\n' "$(openssl rand -base64 32)"
printf 'AGENTSVIEW_CURSOR_SECRET=%s\n' "$(openssl rand -base64 32)"
'''

["agentsview:pg:local:up"]
description = "Start the local AgentsView PostgreSQL container"
run         = 'docker compose -f "${AGENTSVIEW_COMPOSE_FILE:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/compose.yaml}" up -d --wait postgres'

["agentsview:pg:local:down"]
description = "Stop the local AgentsView PostgreSQL container"
run         = 'docker compose -f "${AGENTSVIEW_COMPOSE_FILE:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/compose.yaml}" down'

["agentsview:pg:local:push"]
depends     = ["agentsview:pg:local:up"]
description = "Incrementally push local AgentsView sessions into the local Docker PostgreSQL database"
run         = 'agentsview pg push'

["agentsview:pg:local:push".env]
AGENTSVIEW_LOCAL_PG_PASSWORD = "{{ env.AGENTSVIEW_LOCAL_PG_PASSWORD | default(value='agentsview-local') }}"
AGENTSVIEW_LOCAL_PG_PORT     = "{{ env.AGENTSVIEW_LOCAL_PG_PORT | default(value='15433') }}"
AGENTSVIEW_LOCAL_PG_USER     = "{{ env.AGENTSVIEW_LOCAL_PG_USER | default(value='agentsview') }}"
AGENTSVIEW_PG_SCHEMA         = "agentsview"
AGENTSVIEW_PG_URL            = "postgres://{{ env.AGENTSVIEW_LOCAL_PG_USER }}:{{ env.AGENTSVIEW_LOCAL_PG_PASSWORD }}@127.0.0.1:{{ env.AGENTSVIEW_LOCAL_PG_PORT }}/agentsview?sslmode=disable"

["agentsview:pg:local:repair-sequences"]
# restore／merge系のtaskは、dump内の `SELECT pg_catalog.setval` を削って
# 明示id付きINSERTだけを流す。他machineのdumpのsequence値でlocalのsequenceを
# 巻き戻さないためである。その結果sequenceが実データのidより遅れるので、
# import後にここで前進だけさせる。放置すると次のINSERTがduplicate keyで落ちる。
# pg:local:restore と cockroach:remote-local:dump の2箇所から呼ぶ共通処理。
description = "Advance local AgentsView PostgreSQL sequences without rewinding them"
run = '''
set -euo pipefail
compose_file="${AGENTSVIEW_COMPOSE_FILE:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/compose.yaml}"
docker compose -f "$compose_file" exec -T postgres \
  sh -c 'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --set=ON_ERROR_STOP=1 --quiet' <<'SQL'
DO $$
DECLARE
  seq record;
  max_id bigint;
  cur_val bigint;
  cur_called boolean;
BEGIN
  FOR seq IN
    SELECT s.oid::regclass AS seq_name, t.relname AS table_name, a.attname AS column_name
    FROM pg_class s
    JOIN pg_depend d ON d.objid = s.oid AND d.classid = 'pg_class'::regclass AND d.deptype IN ('a', 'i')
    JOIN pg_class t ON t.oid = d.refobjid
    JOIN pg_attribute a ON a.attrelid = t.oid AND a.attnum = d.refobjsubid
    JOIN pg_namespace n ON n.oid = s.relnamespace
    WHERE s.relkind = 'S' AND n.nspname = 'agentsview'
  LOOP
    EXECUTE format('SELECT COALESCE(max(%I), 0) FROM agentsview.%I', seq.column_name, seq.table_name)
      INTO max_id;
    EXECUTE format('SELECT last_value, is_called FROM %s', seq.seq_name)
      INTO cur_val, cur_called;
    IF max_id > cur_val OR (max_id = cur_val AND NOT cur_called) THEN
      PERFORM setval(seq.seq_name, max_id, true);
    END IF;
  END LOOP;
END
$$;
SQL
'''
shell = "bash -c"

["agentsview:pg:local:restore"]
description = "Restore an AgentsView PostgreSQL dump into the local Docker database"
run = '''
set -eu

backup_dir="${AGENTSVIEW_BACKUP_DIR:-${XDG_STATE_HOME:-${HOME}/.local/state}/agentsview}"
dump_path="${AGENTSVIEW_RESTORE_DUMP:-}"
if [ -z "$dump_path" ]; then
  dump_path="$({ find "$backup_dir" -maxdepth 1 -type f -name '*.dump' -print 2>/dev/null || true; } |
    sort -r |
    fzf --prompt='AgentsView dump> ' --height=40% --reverse || true)"
fi
if [ -z "$dump_path" ]; then
  echo "No dump selected from: $backup_dir" >&2
  exit 1
fi
# task は mise の config root（global config 経由なら $HOME）で実行されるため、
# repository 内の相対 path では解決できない。chezmoi が配置した path を既定にする。
compose_file="${AGENTSVIEW_COMPOSE_FILE:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/compose.yaml}"

if [ ! -f "$dump_path" ]; then
  echo "Dump file not found: $dump_path" >&2
  exit 1
fi

docker compose -f "$compose_file" up -d --wait postgres
# backupを取り込む前に、移行先schemaを初期化・migrationし、
# このmachineですでに収集したsessionを保持する。
mise run agentsview:pg:local:push

restore_db="agentsview_restore_$$"
counts_before="$(mktemp)"
counts_after="$(mktemp)"
columns_backup="$(mktemp)"
columns_local="$(mktemp)"
cleanup_restore_db() {
  docker compose -f "$compose_file" exec -T postgres \
    sh -c 'dropdb --username="$POSTGRES_USER" --if-exists --force "$1"' -- "$restore_db" \
    >/dev/null 2>&1 || true
  rm -f "$counts_before" "$counts_after" "$columns_backup" "$columns_local"
}
trap cleanup_restore_db EXIT

# 取り込み結果は「どのtableが何行増えたか」で確認したいので、merge前後の行数を測る。
# table一覧はschemaから引き、count(*)はquery_to_xmlで1 queryにまとめる。
row_counts() {
  docker compose -f "$compose_file" exec -T postgres \
    sh -c 'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --set=ON_ERROR_STOP=1 \
      --no-align --tuples-only --quiet' <<'SQL'
SELECT c.relname || ' ' ||
  (xpath(
    '/row/c/text()',
    query_to_xml(format('SELECT count(*) AS c FROM agentsview.%I', c.relname), false, true, '')
  ))[1]::text
FROM pg_class c
JOIN pg_namespace n ON n.oid = c.relnamespace
WHERE n.nspname = 'agentsview' AND c.relkind = 'r'
ORDER BY c.relname;
SQL
}

# 引数が空なら local database を見る。schema差はmerge失敗の主因なので比較できるようにする。
schema_columns() {
  docker compose -f "$compose_file" exec -T postgres \
    sh -c 'psql --username="$POSTGRES_USER" --dbname="${1:-$POSTGRES_DB}" --set=ON_ERROR_STOP=1 \
      --no-align --tuples-only --quiet' -- "$1" <<'SQL'
SELECT table_name || '.' || column_name || ' ' || data_type
FROM information_schema.columns
WHERE table_schema = 'agentsview'
ORDER BY 1;
SQL
}

docker compose -f "$compose_file" exec -T postgres \
  sh -c 'createdb --username="$POSTGRES_USER" "$1"' -- "$restore_db"

# schema指定のdumpにはpg_trgm自体が含まれないが、post-dataのGIN indexは
# agentsview schemaへinstallされたoperator classを参照する。先にpre-dataをrestoreし、
# extensionをinstallしてからdataとindexをrestoreする。
docker compose -f "$compose_file" exec -T postgres \
  sh -c 'pg_restore --username="$POSTGRES_USER" --dbname="$1" \
    --no-owner --no-privileges --exit-on-error --section=pre-data' -- "$restore_db" \
  <"$dump_path"
docker compose -f "$compose_file" exec -T postgres \
  sh -c 'psql --username="$POSTGRES_USER" --dbname="$1" --set=ON_ERROR_STOP=1 --quiet \
    --command="CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA agentsview;"' -- "$restore_db"
docker compose -f "$compose_file" exec -T postgres \
  sh -c 'pg_restore --username="$POSTGRES_USER" --dbname="$1" \
    --no-owner --no-privileges --exit-on-error --section=data' -- "$restore_db" \
  <"$dump_path"
docker compose -f "$compose_file" exec -T postgres \
  sh -c 'pg_restore --username="$POSTGRES_USER" --dbname="$1" \
    --no-owner --no-privileges --exit-on-error --section=post-data' -- "$restore_db" \
  <"$dump_path"

# backupのschemaはdumpを取った時点のAgentsViewのもので、localのschemaは現在の
# AgentsViewが作る。remoteがread-onlyだとremoteへmigrationが当たらないため両者がずれ、
# 同じ列名でも型が違う状態になりうる。取り込む前に一時databaseを現在のAgentsViewで
# migrationして、localと同じschemaへ揃える。
echo "Migrating the restored backup to the current AgentsView schema..."
AGENTSVIEW_PG_SCHEMA=agentsview \
AGENTSVIEW_PG_URL="postgres://${AGENTSVIEW_LOCAL_PG_USER:-agentsview}:${AGENTSVIEW_LOCAL_PG_PASSWORD:-agentsview-local}@127.0.0.1:${AGENTSVIEW_LOCAL_PG_PORT:-15433}/${restore_db}?sslmode=disable" \
  agentsview pg push

# migrationしても残る差はAgentsViewのversion差なので、merge前に見えるようにする。
# psqlの型エラーだけでは、どのcolumnがずれているのか分からない。
schema_columns "$restore_db" | sort >"$columns_backup"
schema_columns "" | sort >"$columns_local"
backup_only="$(comm -23 "$columns_backup" "$columns_local")"
if [ -n "$backup_only" ]; then
  echo "Backup columns that the local schema does not have (name and type):" >&2
  printf '%s\n' "$backup_only" | sed 's/^/  /' >&2
fi

row_counts >"$counts_before"

# 一時databaseのsnapshotをINSERTへ変換し、localに同じkeyがある行は無視する。
# 古いbackupでlocalのsequenceを巻き戻さないよう、setvalは除外する。
# backup側のschemaはdumpを取った時点のもので、localのschemaはAgentsViewのmigrationが
# 作る。column順が一致する保証がないため、--inserts（位置指定）ではなく
# --column-inserts（column名つき）で流し込む。
# 行ごとの `INSERT 0 1` が取り込み行数だけ出ると読めないため、psqlはquietにして
# 出力も捨てる。error はそのまま stderr に出る。結果は後段の増分で報告する。
# schemaがずれていると途中のINSERTで停止するが、autocommitのままだとそこまでの行が
# commit済みで残り、後段のsequence補正も走らない。transactionで囲み
# 「全部入るか、何も入らないか」にする。
# psqlの--single-transactionは入力のEOFでcommitするため、pg_dumpが途中で落ちても
# そこまでの行がcommitされる。COMMITはpg_dumpの成功時だけ送り、失敗時はROLLBACKして
# 元のstatusを返す。
docker compose -f "$compose_file" exec -T postgres \
  bash -o pipefail -c '
    {
      echo "BEGIN;"
      pg_dump --username="$POSTGRES_USER" --dbname="$1" --schema=agentsview \
        --data-only --column-inserts --on-conflict-do-nothing |
        sed "/^SELECT pg_catalog.setval/d"
      dump_status=$?
      if [ "$dump_status" -ne 0 ]; then
        echo "ROLLBACK;"
        exit "$dump_status"
      fi
      echo "COMMIT;"
    } |
      psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --set=ON_ERROR_STOP=1 \
        --quiet --output=/dev/null
  ' -- "$restore_db"

# 明示idのimport後は、共通taskでsequenceを前進だけさせる。
mise run agentsview:pg:local:repair-sequences

row_counts >"$counts_after"

echo "Merged missing rows from AgentsView backup: $dump_path"
awk 'NR == FNR { before[$1] = $2; next }
  { printf "  agentsview.%s: %d -> %d (%+d rows)\n", $1, before[$1], $2, $2 - before[$1] }' \
  "$counts_before" "$counts_after"
'''
shell = "bash -c"

["agentsview:pg:local:dump"]
depends = ["agentsview:pg:local:push"]
description = "Dump the consolidated local AgentsView PostgreSQL database"
run = '''
set -eu

backup_dir="${AGENTSVIEW_BACKUP_DIR:-${XDG_STATE_HOME:-${HOME}/.local/state}/agentsview}"
dump_path="${backup_dir}/agentsview-local-$(date +%Y%m%d-%H%M%S)-$$.dump"
compose_file="${AGENTSVIEW_COMPOSE_FILE:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/compose.yaml}"

# schema が無いまま pg_dump すると "no matching schemas were found" としか出ず、
# local database が未初期化なのか dump 対象の指定違いなのか区別できない。
# 事前に schema の有無を確認し、次に実行すべき task を案内する。
# query 自体が失敗した場合に schema 未作成と誤って案内しないよう、
# pipeline を挟まず command substitution の status をそのまま見る。
if ! schema_count="$(docker compose -f "$compose_file" exec -T postgres \
  sh -c 'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --set=ON_ERROR_STOP=1 \
    --no-align --tuples-only --quiet' <<'SQL'
SELECT count(*) FROM pg_namespace WHERE nspname = 'agentsview';
SQL
)"; then
  echo "local PostgreSQL へ問い合わせできませんでした: $compose_file" >&2
  exit 1
fi
if [ "$(printf '%s' "$schema_count" | tr -d '[:space:]')" != "1" ]; then
  echo "local PostgreSQL に agentsview schema がありません: $compose_file" >&2
  echo "このmachineのsessionを収集するか、backupをrestoreしてから再実行してください:" >&2
  echo "  mise run agentsview:pg:local:push" >&2
  echo "  mise run agentsview:pg:local:restore" >&2
  exit 1
fi

mkdir -p "$backup_dir"
umask 077
trap 'status=$?; [ "$status" -eq 0 ] || rm -f "$dump_path"; exit "$status"' EXIT
docker compose -f "$compose_file" exec -T postgres \
  sh -c 'exec pg_dump --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --schema=agentsview --format=custom' \
  >"$dump_path"
pg_restore --list "$dump_path" >/dev/null
echo "Consolidated AgentsView backup: $dump_path"
'''
shell = "bash -c"

["agentsview:pg:remote-local:dump"]
description = "Merge CockroachDB data and this machine's sessions locally, then create a PostgreSQL backup"
run         = "mise run agentsview:cockroach:remote-local:dump"

["agentsview:pg:local:status"]
description = "Show session counts in the local AgentsView PostgreSQL container"
run = '''
docker compose -f "${AGENTSVIEW_COMPOSE_FILE:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/compose.yaml}" exec -T postgres \
  sh -c 'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --set=ON_ERROR_STOP=1 \
    --command="SELECT machine, COUNT(*) AS sessions FROM agentsview.sessions GROUP BY machine ORDER BY machine;"'
'''
shell = "bash -c"

["agentsview:serve"]
depends = ["agentsview:pg:local:push"]
description = "Continuously push local sessions and serve AgentsView from local Docker PostgreSQL"
run = '''
set -eu

agentsview pg push --watch &
watch_pid=$!

agentsview pg serve "$@" &
serve_pid=$!

cleanup() {
  kill "$watch_pid" "$serve_pid" 2>/dev/null || true
  wait "$watch_pid" 2>/dev/null || true
  wait "$serve_pid" 2>/dev/null || true
}

trap cleanup EXIT
trap 'exit 130' INT
trap 'exit 143' TERM

# watcher が落ちたまま serve を続けると、session の収集が黙って止まる。
# どちらかが終了したらもう一方も停止し、終了 status を引き継ぐ。
# macOS 既定の bash 3.2 には `wait -n` がないため、poll で監視する。
while :; do
  if ! kill -0 "$watch_pid" 2>/dev/null; then
    watch_status=0
    wait "$watch_pid" || watch_status=$?
    echo "agentsview pg push --watch exited with status ${watch_status}; stopping serve" >&2
    kill "$serve_pid" 2>/dev/null || true
    wait "$serve_pid" 2>/dev/null || true
    exit "$watch_status"
  fi
  if ! kill -0 "$serve_pid" 2>/dev/null; then
    serve_status=0
    wait "$serve_pid" || serve_status=$?
    exit "$serve_status"
  fi
  sleep 1
done
'''
shell = "bash -c"

["agentsview:serve".env]
AGENTSVIEW_LOCAL_PG_PASSWORD = "{{ env.AGENTSVIEW_LOCAL_PG_PASSWORD | default(value='agentsview-local') }}"
AGENTSVIEW_LOCAL_PG_PORT     = "{{ env.AGENTSVIEW_LOCAL_PG_PORT | default(value='15433') }}"
AGENTSVIEW_LOCAL_PG_USER     = "{{ env.AGENTSVIEW_LOCAL_PG_USER | default(value='agentsview') }}"
AGENTSVIEW_PG_SCHEMA         = "agentsview"
AGENTSVIEW_PG_URL            = "postgres://{{ env.AGENTSVIEW_LOCAL_PG_USER }}:{{ env.AGENTSVIEW_LOCAL_PG_PASSWORD }}@127.0.0.1:{{ env.AGENTSVIEW_LOCAL_PG_PORT }}/agentsview?sslmode=disable"

["agentsview:cockroach:status"]
description = "Show sync status against CockroachDB without a Fly proxy"
run = '''
set -eu
if [ -z "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:-}" ] && [ -z "${_FNOX_REEXEC:-}" ]; then
  export _FNOX_REEXEC=1
  exec fnox exec -- mise run agentsview:cockroach:status "$@"
fi
: "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:?fnox が未解決です}"
# AGENTSVIEW_PG_URL だけはfnoxが解決したsecretなのでここで渡す。schemaは
# ["agentsview:cockroach:status".env] に置いている。
AGENTSVIEW_PG_URL="$AGENTSVIEW_COCKROACH_PUSH_PG_URL" agentsview pg status
'''
shell = "bash -c"

["agentsview:cockroach:status".env]
AGENTSVIEW_PG_SCHEMA = "{{ env.AGENTSVIEW_PG_SCHEMA | default(value='agentsview') }}"

["agentsview:cockroach:push"]
description = "Push local sessions directly to CockroachDB"
run = '''
set -eu
if [ -z "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:-}" ] && [ -z "${_FNOX_REEXEC:-}" ]; then
  export _FNOX_REEXEC=1
  exec fnox exec -- mise run agentsview:cockroach:push -- "$@"
fi
: "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:?fnox が未解決です}"
# AGENTSVIEW_PG_URL だけはfnoxが解決したsecretなのでここで渡す。schemaは
# ["agentsview:cockroach:push".env] に置いている。
AGENTSVIEW_PG_URL="$AGENTSVIEW_COCKROACH_PUSH_PG_URL" agentsview pg push --no-vectors "$@"
'''
shell = "bash -c"

["agentsview:cockroach:push".env]
AGENTSVIEW_PG_SCHEMA = "{{ env.AGENTSVIEW_PG_SCHEMA | default(value='agentsview') }}"

["agentsview:cockroach:dump:data"]
description = "Export CockroachDB AgentsView rows as PostgreSQL-compatible column INSERT statements"
hide = true
run = '''
set -eu

if [ -z "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:-}" ] && [ -z "${_FNOX_REEXEC:-}" ]; then
  export _FNOX_REEXEC=1
  exec fnox exec -- mise run agentsview:cockroach:dump:data "$@"
fi
: "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:?fnox が未解決です}"

backup_dir="${AGENTSVIEW_BACKUP_DIR:-${XDG_STATE_HOME:-${HOME}/.local/state}/agentsview}"
dump_path="${backup_dir}/agentsview-cockroach-data-$(date +%Y%m%d-%H%M%S)-$$.sql"
auth_dir="$(mktemp -d)"
cleanup_dump() {
  status=$?
  rm -rf "$auth_dir"
  if [ "$status" -ne 0 ]; then
    rm -f "$dump_path"
  fi
  return "$status"
}
trap cleanup_dump EXIT

mkdir -p "$backup_dir"
dump_dir="$(cd "$backup_dir" && pwd -P)"
dump_name="$(basename "$dump_path")"
# auth_dirとPG URLはこのtask内で決まる値なのでexportする。静的な
# AGENTSVIEW_DUMP_ALLOW_REMOTE は ["agentsview:cockroach:dump:data".env] にある。
export AGENTSVIEW_DUMP_AUTH_DIR="$auth_dir"
export AGENTSVIEW_DUMP_PG_URL="$AGENTSVIEW_COCKROACH_PUSH_PG_URL"
"${AGENTSVIEW_PREPARE_DUMP_AUTH:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/prepare-dump-auth}"
pg_url="$(cat "$auth_dir/url")"

docker run --rm \
  --volume "$auth_dir/pgpass:/run/agentsview.pgpass:ro" \
  --volume "$dump_dir:/backup" \
  --env HOST_GID="$(id -g)" \
  --env HOST_UID="$(id -u)" \
  postgres:17 \
  sh -c '
set -eu
getent passwd "$HOST_UID" >/dev/null ||
  printf "agentsview-host:x:%s:%s:AgentsView dump user:/tmp:/bin/sh\n" "$HOST_UID" "$HOST_GID" >>/etc/passwd
install -m 600 -o "$HOST_UID" -g "$HOST_GID" /run/agentsview.pgpass /tmp/agentsview.pgpass
export PGPASSFILE=/tmp/agentsview.pgpass
umask 077
exec gosu "$HOST_UID:$HOST_GID" pg_dump "$@"
' -- \
    --dbname="$pg_url" --schema=agentsview --data-only --column-inserts \
    --on-conflict-do-nothing --no-owner --no-privileges --file="/backup/$dump_name"

test -s "$dump_path"
echo "CockroachDB AgentsView data export: $dump_path"
'''
shell = "bash -c"

["agentsview:cockroach:dump:data".env]
AGENTSVIEW_DUMP_ALLOW_REMOTE = "yes"

["agentsview:cockroach:remote-local:dump"]
description = "Merge CockroachDB rows into local PostgreSQL and create a consolidated custom-format backup"
run = '''
set -euo pipefail

backup_dir="${AGENTSVIEW_BACKUP_DIR:-${XDG_STATE_HOME:-${HOME}/.local/state}/agentsview}"
mise run agentsview:cockroach:dump:data
data_dump="$({ find "$backup_dir" -maxdepth 1 -type f -name 'agentsview-cockroach-data-*.sql' -print 2>/dev/null || true; } |
  sort -r | head -n 1)"
if [ -z "$data_dump" ]; then
  echo "CockroachDB AgentsView data export was not created" >&2
  exit 1
fi

# local schemaを現在のAgentsView versionへ揃えた後、remoteにだけ存在するrowをmergeする。
# column名付きINSERTを使うため、CockroachDBのDDL／権限／sequenceはPostgreSQLへ持ち込まない。
mise run agentsview:pg:local:push
compose_file="${AGENTSVIEW_COMPOSE_FILE:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/compose.yaml}"
{
  echo 'BEGIN;'
  sed '/^SELECT pg_catalog.setval/d' "$data_dump"
  echo 'COMMIT;'
} | docker compose -f "$compose_file" exec -T postgres \
  sh -c 'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" \
    --set=ON_ERROR_STOP=1 --quiet --output=/dev/null'

# CockroachDBの明示idをimportしたので、同じ共通taskでsequenceを補正する。
mise run agentsview:pg:local:repair-sequences

mise run agentsview:pg:local:dump
'''
shell = "bash -c"

["agentsview:cloudrun:secrets"]
# 1回きりの操作ではないためtaskとして残す。初回登録のほか、Cloud Run URLの確定後、
# CockroachDBのpassword rotation、auth token更新のたびに新versionを登録する。
description = "Create new Secret Manager versions for the Cloud Run viewer"
run = '''
set -eu
if { [ -z "${AGENTSVIEW_COCKROACH_READ_PG_URL:-}" ] || [ -z "${AGENTSVIEW_AUTH_TOKEN:-}" ] ||
     [ -z "${AGENTSVIEW_CURSOR_SECRET:-}" ]; } && [ -z "${_FNOX_REEXEC:-}" ]; then
  export _FNOX_REEXEC=1
  exec fnox exec -- mise run agentsview:cloudrun:secrets "$@"
fi

: "${GCP_PROJECT_ID:?GCP_PROJECT_IDを設定してください}"
: "${AGENTSVIEW_COCKROACH_READ_PG_URL:?fnox が未解決です}"
: "${AGENTSVIEW_AUTH_TOKEN:?fnox が未解決です}"
: "${AGENTSVIEW_CURSOR_SECRET:?fnox が未解決です}"

region="us-west2"
public_url="${AGENTSVIEW_CLOUD_RUN_URL:-}"
if [ -z "$public_url" ]; then
  public_url=$(gcloud run services describe ryo-agentsview \
    --project="$GCP_PROJECT_ID" --region="$region" --format='value(status.url)' 2>/dev/null || true)
fi
: "${public_url:?初回だけAGENTSVIEW_CLOUD_RUN_URLに公開URLを指定してください}"

ensure_secret() {
  if ! gcloud secrets describe "$1" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
    gcloud secrets create "$1" --project="$GCP_PROJECT_ID" --replication-policy=automatic >/dev/null
  fi
}

ensure_secret agentsview-pg-url
ensure_secret agentsview-config-toml

printf '%s' "$AGENTSVIEW_COCKROACH_READ_PG_URL" |
  gcloud secrets versions add agentsview-pg-url --project="$GCP_PROJECT_ID" --data-file=- >/dev/null

printf 'public_url = "%s"\nrequire_auth = true\nauth_token = "%s"\ncursor_secret = "%s"\n' \
  "$public_url" "$AGENTSVIEW_AUTH_TOKEN" "$AGENTSVIEW_CURSOR_SECRET" |
  gcloud secrets versions add agentsview-config-toml --project="$GCP_PROJECT_ID" --data-file=- >/dev/null

echo "Cloud Run secret versions added. Secret values were not printed."
'''
shell = "bash -c"

