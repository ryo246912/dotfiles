set -euo pipefail
script="${AGENTSVIEW_LOCALDB_SCRIPT:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/scripts/localdb.sh}"
[ -f "$script" ] || script=dot_config/agentsview/scripts/localdb.sh
exec bash "$script" dump "$@"
