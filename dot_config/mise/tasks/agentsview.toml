set -euo pipefail
script="${AGENTSVIEW_CLOUDRUN_SCRIPT:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/scripts/cloudrun.sh}"
if [ ! -f "$script" ] && [ -f dot_config/agentsview/scripts/cloudrun.sh ]; then
