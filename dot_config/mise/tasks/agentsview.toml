["agentsview:cockroach:status"]
description = "Show sync status against CockroachDB without a Fly proxy"
run = '''
set -eu
if [ -z "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:-}" ] && [ -z "${_FNOX_REEXEC:-}" ]; then
  export _FNOX_REEXEC=1
  exec fnox exec -- mise run agentsview:cockroach:status "$@"
fi
: "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:?fnox が未解決です}"
# AGENTSVIEW_PG_URL だけはfnoxが解決したsecretなのでここで渡す。schemaは
# ["agentsview:cockroach:status".env] に置いている。
AGENTSVIEW_PG_URL="$AGENTSVIEW_COCKROACH_PUSH_PG_URL" agentsview pg status
'''
shell = "bash -c"

["agentsview:cockroach:status".env]
AGENTSVIEW_PG_SCHEMA = "{{ env.AGENTSVIEW_PG_SCHEMA | default(value='agentsview') }}"

["agentsview:cockroach:push"]
description = "Push local sessions directly to CockroachDB"
run = '''
set -eu
if [ -z "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:-}" ] && [ -z "${_FNOX_REEXEC:-}" ]; then
  export _FNOX_REEXEC=1
  exec fnox exec -- mise run agentsview:cockroach:push -- "$@"
fi
: "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:?fnox が未解決です}"
# AGENTSVIEW_PG_URL だけはfnoxが解決したsecretなのでここで渡す。schemaは
# ["agentsview:cockroach:push".env] に置いている。
AGENTSVIEW_PG_URL="$AGENTSVIEW_COCKROACH_PUSH_PG_URL" agentsview pg push --no-vectors "$@"
'''
shell = "bash -c"

["agentsview:cockroach:push".env]
AGENTSVIEW_PG_SCHEMA = "{{ env.AGENTSVIEW_PG_SCHEMA | default(value='agentsview') }}"

["agentsview:cockroach:remote:dump"]
description = "Export CockroachDB AgentsView rows as PostgreSQL-compatible column INSERT statements"
run = '''
set -eu

if [ -z "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:-}" ] && [ -z "${_FNOX_REEXEC:-}" ]; then
  export _FNOX_REEXEC=1
  exec fnox exec -- mise run agentsview:cockroach:remote:dump "$@"
fi
: "${AGENTSVIEW_COCKROACH_PUSH_PG_URL:?fnox が未解決です}"

backup_dir="${AGENTSVIEW_BACKUP_DIR:-${XDG_STATE_HOME:-${HOME}/.local/state}/agentsview}"
dump_path="${backup_dir}/agentsview-cockroach-data-$(date +%Y%m%d-%H%M%S)-$$.sql"
auth_dir="$(mktemp -d)"
cleanup_dump() {
  status=$?
  rm -rf "$auth_dir"
  if [ "$status" -ne 0 ]; then
    rm -f "$dump_path"
  fi
  return "$status"
}
trap cleanup_dump EXIT

mkdir -p "$backup_dir"
dump_dir="$(cd "$backup_dir" && pwd -P)"
dump_name="$(basename "$dump_path")"
# auth_dirとPG URLはこのtask内で決まる値なのでexportする。静的な
# AGENTSVIEW_DUMP_ALLOW_REMOTE は ["agentsview:cockroach:remote:dump".env] にある。
export AGENTSVIEW_DUMP_AUTH_DIR="$auth_dir"
export AGENTSVIEW_DUMP_PG_URL="$AGENTSVIEW_COCKROACH_PUSH_PG_URL"
"${AGENTSVIEW_PREPARE_DUMP_AUTH:-${XDG_CONFIG_HOME:-$HOME/.config}/agentsview/prepare-dump-auth}"
pg_url="$(cat "$auth_dir/url")"

docker run --rm \
  --volume "$auth_dir/pgpass:/run/agentsview.pgpass:ro" \
  --volume "$dump_dir:/backup" \
  --env HOST_GID="$(id -g)" \
  --env HOST_UID="$(id -u)" \
  postgres:17 \
  sh -c '
set -eu
getent passwd "$HOST_UID" >/dev/null ||
  printf "agentsview-host:x:%s:%s:AgentsView dump user:/tmp:/bin/sh\n" "$HOST_UID" "$HOST_GID" >>/etc/passwd
install -m 600 -o "$HOST_UID" -g "$HOST_GID" /run/agentsview.pgpass /tmp/agentsview.pgpass
export PGPASSFILE=/tmp/agentsview.pgpass
umask 077
exec gosu "$HOST_UID:$HOST_GID" pg_dump "$@"
' -- \
    --dbname="$pg_url" --schema=agentsview --data-only --column-inserts \
    --on-conflict-do-nothing --no-owner --no-privileges --file="/backup/$dump_name"

test -s "$dump_path"
echo "CockroachDB AgentsView data export: $dump_path"
'''
shell = "bash -c"

["agentsview:cockroach:remote:dump".env]
AGENTSVIEW_DUMP_ALLOW_REMOTE = "yes"

["agentsview:cockroach:remote-local:restore"]
description = "Export CockroachDB rows and merge the missing ones into the local CockroachDB container"
run = '''
set -euo pipefail

backup_dir="${AGENTSVIEW_BACKUP_DIR:-${XDG_STATE_HOME:-${HOME}/.local/state}/agentsview}"
mise run agentsview:cockroach:remote:dump
# dump fileの名前にはtimestampが入るので、名前のsortで最新を選べる。
data_dump="$({ find "$backup_dir" -maxdepth 1 -type f -name 'agentsview-cockroach-data-*.sql' -print 2>/dev/null || true; } |
  sort -r | head -n 1)"
if [ -z "$data_dump" ]; then
  echo "CockroachDB AgentsView data export was not created" >&2
  exit 1
fi

# remoteとlocalが同じengineでも、schemaは現在のAgentsViewがlocalへ作ったものを
# 使い、dumpからはdataだけを取り込む。remoteのDDL／権限／sequenceは持ち込まない。
mise run agentsview:cockroach:local:restore -- "$data_dump"
'''
shell = "bash -c"

["agentsview:cockroach:remote-local:dump"]
description = "Merge CockroachDB rows into the local CockroachDB container and create a consolidated backup"
run = '''
set -euo pipefail

mise run agentsview:cockroach:remote-local:restore
mise run agentsview:cockroach:local:dump
'''
shell = "bash -c"

["agentsview:cloudrun:secrets"]
# 1回きりの操作ではないためtaskとして残す。初回登録のほか、Cloud Run URLの確定後、
# CockroachDBのpassword rotation、auth token更新のたびに新versionを登録する。
description = "Create new Secret Manager versions for the Cloud Run viewer"
run = '''
set -eu
if { [ -z "${AGENTSVIEW_COCKROACH_READ_PG_URL:-}" ] || [ -z "${AGENTSVIEW_AUTH_TOKEN:-}" ] ||
     [ -z "${AGENTSVIEW_CURSOR_SECRET:-}" ]; } && [ -z "${_FNOX_REEXEC:-}" ]; then
  export _FNOX_REEXEC=1
  exec fnox exec -- mise run agentsview:cloudrun:secrets "$@"
fi

: "${GCP_PROJECT_ID:?GCP_PROJECT_IDを設定してください}"
: "${AGENTSVIEW_COCKROACH_READ_PG_URL:?fnox が未解決です}"
: "${AGENTSVIEW_AUTH_TOKEN:?fnox が未解決です}"
: "${AGENTSVIEW_CURSOR_SECRET:?fnox が未解決です}"

region="us-west2"
public_url="${AGENTSVIEW_CLOUD_RUN_URL:-}"
if [ -z "$public_url" ]; then
  public_url=$(gcloud run services describe ryo-agentsview \
    --project="$GCP_PROJECT_ID" --region="$region" --format='value(status.url)' 2>/dev/null || true)
fi
: "${public_url:?初回だけAGENTSVIEW_CLOUD_RUN_URLに公開URLを指定してください}"

ensure_secret() {
  if ! gcloud secrets describe "$1" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
    gcloud secrets create "$1" --project="$GCP_PROJECT_ID" --replication-policy=automatic >/dev/null
  fi
}

ensure_secret agentsview-pg-url
ensure_secret agentsview-config-toml

printf '%s' "$AGENTSVIEW_COCKROACH_READ_PG_URL" |
  gcloud secrets versions add agentsview-pg-url --project="$GCP_PROJECT_ID" --data-file=- >/dev/null

printf 'public_url = "%s"\nrequire_auth = true\nauth_token = "%s"\ncursor_secret = "%s"\n' \
  "$public_url" "$AGENTSVIEW_AUTH_TOKEN" "$AGENTSVIEW_CURSOR_SECRET" |
  gcloud secrets versions add agentsview-config-toml --project="$GCP_PROJECT_ID" --data-file=- >/dev/null

echo "Cloud Run secret versions added. Secret values were not printed."
'''
shell = "bash -c"

