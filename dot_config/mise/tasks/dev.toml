["rulesync:generate"]
description = "Generate all rulesync outputs after chezmoi apply"
# rulesync generate はカレントディレクトリの rulesync.jsonc / .rulesync を見るため、
# どこから `mise run` しても解決できるよう明示的に cd する。
# - 1つ目: このリポジトリ自身の CLAUDE.md を再生成（chezmoi source-path で解決）
# - 2つ目: グローバル配布用（~/.claude, ~/.codex, ~/.copilot 等）を再生成
run = '''
set -eu

source_dir="${CHEZMOI_SOURCE_DIR:-$(chezmoi source-path)}"
global_dir="$HOME/.config/rulesync"

if [ -f "$source_dir/rulesync.jsonc" ] && [ -d "$source_dir/.rulesync" ]; then
  (cd "$source_dir" && rulesync generate)
else
  echo "warning: project rulesync source not found under $source_dir; skipping project generation" >&2
fi

if [ -f "$global_dir/rulesync.jsonc" ] && [ -d "$global_dir/.rulesync" ]; then
  (cd "$global_dir" && rulesync generate)
else
  echo "warning: global rulesync source not found under $global_dir; skipping global generation" >&2
fi
'''
shell = "bash -c"

["apm:install"]
description = "Deploy user-scope external skills and commands to agent dirs"
# apm install -g は cwd に依存せず ~/.apm/apm.yml を読む。
# ~/.apm は chezmoi が生成するため、事前に `chezmoi apply` 済みであること。
run = [
    "apm install -g",
    "mise run apm:sync-lock",
    "mise run apm:sync-commands",
    "mise run rulesync:generate-commands",
]

["apm:ci"]
description = "Reproduce user-scope APM install exactly from apm.lock.yaml"
# npm ci 相当: lockfile と manifest の同期を必須にし、依存解決結果を更新せずに install する。
run = [
    "apm install -g --frozen",
    "mise run apm:sync-lock",
    "mise run apm:sync-commands",
    "mise run rulesync:generate-commands",
]

["apm:sync-lock"]
description = "Copy the user-scope APM lockfile into the chezmoi source tree"
# apm install -g で生成された ~/.apm/apm.lock.yaml を SOT とし、
# git 管理する chezmoi source directory 側（dot_apm/apm.lock.yaml）へ反映する。
run = '''
set -eu

source_dir="${CHEZMOI_SOURCE_DIR:-$(chezmoi source-path)}"
source_lock="$HOME/.apm/apm.lock.yaml"
destination_dir="$source_dir/dot_apm"
destination_lock="$destination_dir/apm.lock.yaml"

if [ ! -f "$source_lock" ]; then
  echo "APM lockfile not found: $source_lock" >&2
  exit 1
fi

mkdir -p "$destination_dir"
cp "$source_lock" "$destination_lock"
chmod 0644 "$destination_lock"
'''
shell = "bash -c"

["apm:sync-commands"]
description = "Sync namespaced commands from APM modules into Rulesync sources"
run = '''
python3 - <<'PY'
import json
import re
import shutil
from pathlib import Path, PurePosixPath

# commandを持つ外部packageを追加するときは、この一覧へ設定を追加する。
# module_path: ~/.apm/apm_modules からの相対path
# namespace: Rulesyncへ渡すcommand名のprefix
# generated_outputs: Rulesyncの生成先と成果物の種類（command fileまたはskill directory）
# codex_skills: commandをCodexから呼び出せるskillとしても生成するか
command_sources = [
    {
        "module_path": "classmethod/tsumiki/commands",
        "namespace": "tsumiki",
        "generated_outputs": [
            {"directory": ".claude/commands", "type": "command"},
            {"directory": ".codex/skills", "type": "skill"},
        ],
        "codex_skills": True,
    },
]

home = Path.home()
modules_dir = home / ".apm" / "apm_modules"
rulesync_dir = home / ".config" / "rulesync" / ".rulesync" / "commands"
rulesync_skills_dir = home / ".config" / "rulesync" / ".rulesync" / "skills"
rulesync_dir.mkdir(parents=True, exist_ok=True)
rulesync_skills_dir.mkdir(parents=True, exist_ok=True)

# 前回このtaskが所有したpathだけを記録する。prefix一致では削除せず、同名のユーザー作成物を保護する。
state_dir = home / ".local" / "state" / "apm-command-sync"
state_file = state_dir / "generated-paths.json"
previous_paths = json.loads(state_file.read_text()) if state_file.exists() else []
if not isinstance(previous_paths, list) or not all(isinstance(path, str) for path in previous_paths):
    raise ValueError(f"Invalid command sync state: {state_file}")

# 全packageを先に検証し、package間の出力名衝突でも成果物を変更する前に停止する。
prepared_sources = []
generated_command_owners = {}
managed_roots = {
    PurePosixPath(rulesync_dir.relative_to(home).as_posix()),
    PurePosixPath(rulesync_skills_dir.relative_to(home).as_posix()),
}
for command_source in command_sources:
    # 設定値を取り出し、HOME外のpathを参照できないよう相対pathとnamespaceを検証する。
    module_path = command_source["module_path"]
    namespace = command_source["namespace"]
    relative_module = PurePosixPath(module_path)
    if relative_module.is_absolute() or ".." in relative_module.parts:
        raise ValueError(f"Invalid APM module path: {module_path}")
    if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", namespace):
        raise ValueError(f"Invalid command namespace: {namespace}")

    # APMが取得したpackage内のcommands directoryが存在することを確認する。
    source_dir = modules_dir.joinpath(*relative_module.parts)
    if not source_dir.is_dir():
        raise FileNotFoundError(f"APM command source not found: {source_dir}")

    # nested pathの区切りを`-`へ変換して出力名を決める。
    # `foo-bar.md`と`foo/bar.md`のように同名へ変換される場合は、既存成果物を消す前に停止する。
    generated_commands = {}
    for source_file in sorted(source_dir.rglob("*.md")):
        command_name = "-".join(source_file.relative_to(source_dir).parts)
        destination_name = f"{namespace}-{command_name}"
        if destination_name in generated_command_owners:
            previous_source = generated_command_owners[destination_name]
            raise ValueError(
                f"Duplicate generated command name {destination_name}: "
                f"{previous_source} and {source_file}"
            )
        generated_command_owners[destination_name] = source_file
        generated_commands[destination_name] = source_file

    generated_outputs = command_source.get("generated_outputs", [])
    for generated_output in generated_outputs:
        generated_dir = generated_output["directory"]
        output_type = generated_output["type"]
        relative_generated = PurePosixPath(generated_dir)
        if relative_generated.is_absolute() or ".." in relative_generated.parts:
            raise ValueError(f"Invalid generated directory: {generated_dir}")
        if output_type not in {"command", "skill"}:
            raise ValueError(f"Invalid generated output type: {output_type}")
        managed_roots.add(relative_generated)

    prepared_sources.append(
        (command_source, namespace, source_dir, generated_commands, generated_outputs)
    )

# validation完了後に、state manifestへ記録された前回成果物だけを削除する。
for previous_path in previous_paths:
    relative_previous = PurePosixPath(previous_path)
    matching_roots = [
        managed_root
        for managed_root in managed_roots
        if relative_previous != managed_root and relative_previous.is_relative_to(managed_root)
    ]
    is_managed_path = bool(matching_roots)
    if (
        not previous_path
        or relative_previous.is_absolute()
        or ".." in relative_previous.parts
        or not is_managed_path
    ):
        raise ValueError(f"Invalid generated path in state: {previous_path}")
    old_output = home.joinpath(*relative_previous.parts)
    managed_root_path = home.joinpath(*matching_roots[0].parts)
    if not old_output.resolve(strict=False).is_relative_to(managed_root_path.resolve(strict=False)):
        raise ValueError(f"Generated path escapes managed root: {previous_path}")
    if old_output.is_dir():
        shutil.rmtree(old_output)
    else:
        old_output.unlink(missing_ok=True)

owned_paths = set()
for command_source, namespace, source_dir, generated_commands, generated_outputs in prepared_sources:

    # upstream commandをnamespace付きのRulesync command sourceとしてコピーする。
    for destination_name, source_file in generated_commands.items():
        command_name = destination_name.removeprefix(f"{namespace}-")
        destination_file = rulesync_dir / destination_name
        shutil.copy2(source_file, destination_file)
        owned_paths.add(destination_file.relative_to(home).as_posix())

        # Codexはcommandを扱わないため、指定されたpackageでは同じ本文をAgent Skillへ変換する。
        if command_source["codex_skills"]:
            skill_name = f"{namespace}-{command_name.removesuffix('.md')}"
            skill_dir = rulesync_skills_dir / skill_name
            # state導入前に生成されたdirectoryが残っていても、初回migrationを継続できるよう再利用する。
            skill_dir.mkdir(parents=True, exist_ok=True)
            command_body = source_file.read_text()
            # command固有のfrontmatterはskillで使えないため除去し、skill用frontmatterへ置き換える。
            if command_body.startswith("---\n"):
                _, separator, command_body = command_body[4:].partition("\n---\n")
                if not separator:
                    command_body = source_file.read_text()
            description = f"Run the {namespace} {command_name.removesuffix('.md')} workflow."
            (skill_dir / "SKILL.md").write_text(
                f'---\nname: {skill_name}\ndescription: "{description}"\n---\n\n'
                f"{command_body.lstrip()}"
            )
            owned_paths.add(skill_dir.relative_to(home).as_posix())

        # 次回削除できるよう、Rulesyncが生成するagent側のpathも所有manifestへ記録する。
        for generated_output in generated_outputs:
            destination = home.joinpath(*PurePosixPath(generated_output["directory"]).parts)
            if generated_output["type"] == "skill":
                generated_path = destination / f"{namespace}-{command_name.removesuffix('.md')}"
            else:
                generated_path = destination / destination_name
            owned_paths.add(generated_path.relative_to(home).as_posix())

# source作成がすべて成功した後にmanifestをatomicに更新する。
state_dir.mkdir(parents=True, exist_ok=True)
temporary_state = state_file.with_suffix(".tmp")
temporary_state.write_text(json.dumps(sorted(owned_paths), indent=2) + "\n")
temporary_state.replace(state_file)
PY
'''

["rulesync:generate-commands"]
description = "Generate Claude commands and Codex skills from external commands"
run = [
    "cd ~/.config/rulesync && rulesync generate --targets claudecode --features commands --simulate-commands",
    "cd ~/.config/rulesync && rulesync generate --targets codexcli --features skills",
]

["dev:cleanup-cache"]
description = "Clean up development caches on macOS (asks before heavy or destructive deletions)"
# - 再生成できるキャッシュは確認なしで削除
# - 再DLが重いもの・データが消えうるものは y/N で確認してから削除
# y/N 確認・mise prune のプロンプトに stdin を渡すため raw = true にする。
raw = true
run = '''
# 1つのツールが失敗しても残りの掃除は続けたいので errexit は付けず、
# 失敗を記録して最後に非ゼロで終了する。
set -uo pipefail
failed=0
trap 'failed=1; echo "failed: $BASH_COMMAND" >&2' ERR
# dir/* で隠しファイルも対象にし、マッチなしのときはパターン文字列を残さない
shopt -s dotglob nullglob

CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}"

confirm() { read -r -p "$1 [y/N] " a; [[ "$a" =~ ^[Yy]$ ]]; }
section() { printf '\n=== %s ===\n' "$1"; }

section "実行前の空き容量"
df -h / | tail -1

# ------------------------------------------------------------
section "パッケージマネージャ / ランタイム"
# ------------------------------------------------------------
if command -v bun >/dev/null 2>&1; then
  bun pm cache rm
fi
# bun pm cache の参照先と別に残っている旧キャッシュ（bun本体・globalは消さない）
rm -rf "$HOME/.bun/install/cache"

if command -v mise >/dev/null 2>&1; then
  mise cache clear
  mise prune   # 未参照の古いツールバージョン（確認プロンプトあり）
fi

if command -v go >/dev/null 2>&1; then
  go clean -cache -testcache
fi

if command -v npm >/dev/null 2>&1; then
  npm cache clean --force
fi
# ~/.npm のキャッシュ・npx キャッシュ・ログ（prefix が ~/.npm でもツール本体は消さない）
rm -rf "$HOME/.npm/"{_cacache,_npx,_logs}

if command -v pnpm >/dev/null 2>&1; then
  pnpm store prune
fi

if command -v yarn >/dev/null 2>&1; then
  yarn cache clean
fi

if command -v uv >/dev/null 2>&1; then
  uv cache clean
fi

if command -v pip >/dev/null 2>&1; then
  pip cache purge
fi

# ------------------------------------------------------------
section "Homebrew"
# ------------------------------------------------------------
if command -v brew >/dev/null 2>&1; then
  brew cleanup --prune=all
  brew autoremove
fi

# ------------------------------------------------------------
section "Terraform プラグインキャッシュ"
# ------------------------------------------------------------
rm -rf "$HOME/.terraform.d/plugin-cache/"*

# ------------------------------------------------------------
section "~/.cache 全削除"
# ------------------------------------------------------------
# XDG_CACHE_HOME の設定ミスで / や $HOME を消さないよう、実体パスを確認してから削除する
if cache_root=$(cd -P "$CACHE_DIR" 2>/dev/null && pwd -P) \
  && [[ "$cache_root" != "/" && "$cache_root" != "$(cd -P "$HOME" && pwd -P)" ]]; then
  rm -rf -- "$cache_root"/*
else
  echo "skip: $CACHE_DIR は削除対象として不正です" >&2
fi

# ------------------------------------------------------------
section "確認付きの項目"
# ------------------------------------------------------------
if command -v go >/dev/null 2>&1 && confirm "Go モジュールキャッシュを削除しますか?（次回ビルドで再DL）"; then
  go clean -modcache
fi

if [ -d "$HOME/.gradle" ] && confirm "Gradle のキャッシュ・wrapper・daemon・JDK を削除しますか?（gradle.properties / init.d は残します）"; then
  pkill -f GradleDaemon 2>/dev/null || true
  rm -rf "$HOME/.gradle/"{caches,wrapper/dists,daemon,native,jdks}
fi

if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  docker system df
  if confirm "Docker の停止中コンテナ・未使用イメージ・ビルドキャッシュを削除しますか?（ボリュームは残します）"; then
    docker system prune -a -f
  fi
fi

if [ -d "$HOME/Library/Developer/Xcode" ] && confirm "Xcode の DerivedData / DeviceSupport / 使えないシミュレータを削除しますか?"; then
  rm -rf "$HOME/Library/Developer/Xcode/DerivedData/"*
  rm -rf "$HOME/Library/Developer/Xcode/iOS DeviceSupport/"*
  if command -v xcrun >/dev/null 2>&1; then
    xcrun simctl delete unavailable
  fi
fi

if confirm "~/Library/Caches と ~/Library/Logs を削除しますか?（アプリを終了してから推奨）"; then
  rm -rf "$HOME/Library/Caches/"*
  rm -rf "$HOME/Library/Logs/"*
fi

section "実行後の空き容量"
df -h / | tail -1
echo "ゴミ箱を空にするのもお忘れなく。"

if [ "$failed" -ne 0 ]; then
  echo "一部のコマンドが失敗しました（上の failed: を確認してください）" >&2
  exit 1
fi
'''
shell = "bash -c"
