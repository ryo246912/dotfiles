# import で明示的に取り込み、有効化は FNOX_PROFILE で行う。HOST_ENV に work ロールが
# 含まれるホストだけ dot_zshenv.tmpl が FNOX_PROFILE=work を export する。
import = ["config.work.toml"]

[providers.bitwarden]
type = "bitwarden"

[providers.bws]
project_id = "69a1a5eb-c245-4162-80f7-b49200dbebf3"
type       = "bitwarden-sm"

[providers.age]
key_file = "~/.config/fnox/age.txt"
recipients = [
    "age1k9zxqxufy599csnlkfwq2efxnscju4ek3ftqpvx55r9re38akers6zrq2z", # 自分の age/SSH 公開鍵
]
type = "age"

[secrets]
BWS_ACCESS_TOKEN  = { provider = "age", value = "" }
CZ_OPENAI_API_KEY = { provider = "bws", value = "GitHub PAT(cz-git)" }
