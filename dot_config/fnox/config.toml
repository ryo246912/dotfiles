# import で明示的に取り込み、有効化は FNOX_PROFILE で行う。HOST_ENV に work ロールが
# 含まれるホストだけ dot_zshenv.tmpl が FNOX_PROFILE=work を export する。
import = ["config.work.toml"]

[providers.bitwarden]
type = "bitwarden"

[providers.bws]
project_id = "69a1a5eb-c245-4162-80f7-b49200dbebf3"
type       = "bitwarden-sm"

[providers.age]
key_file = "~/.config/fnox/age.txt"
recipients = [
    "age1k9zxqxufy599csnlkfwq2efxnscju4ek3ftqpvx55r9re38akers6zrq2z", # 自分の age/SSH 公開鍵
]
type = "age"

[secrets]
BWS_ACCESS_TOKEN  = { provider = "age", value = "" }
CZ_OPENAI_API_KEY = { provider = "bws", value = "GitHub PAT(cz-git)" }

# agentsview (docs/agentsview.md) の PostgreSQL role password / proxy URL / Fly app token。
# 以前は各 PC の secret shell（dotfiles 管理外の ~/.zshenv 等）に手動 export し、
# 未設定なら mise task 側で対話プロンプトしていたが、bws provider の secret に統一した。
# value は bws project に登録する secret 名の仮置き（実名に合わせて置き換えること）。
# admin/owner password や bearer token のような強い権限の値を毎回のシェルへ自動注入したくない
# ため、env = "exec" にしている（`fnox exec -- mise run agentsview:...` 経由でのみ解決される。
# zabrze の `fne` abbreviation 参照）。
AGENTSVIEW_ADMIN_PG_PASSWORD  = { provider = "bws", value = "AGENTSVIEW_ADMIN_PG_PASSWORD", env = "exec" }
AGENTSVIEW_AUTH_TOKEN         = { provider = "bws", value = "AGENTSVIEW_AUTH_TOKEN", env = "exec" }
AGENTSVIEW_CURSOR_SECRET      = { provider = "bws", value = "AGENTSVIEW_CURSOR_SECRET", env = "exec" }
AGENTSVIEW_OWNER_PASSWORD     = { provider = "bws", value = "AGENTSVIEW_OWNER_PASSWORD", env = "exec" }
AGENTSVIEW_OWNER_PROXY_PG_URL = { provider = "bws", value = "AGENTSVIEW_OWNER_PROXY_PG_URL", env = "exec" }
AGENTSVIEW_PROXY_PG_URL       = { provider = "bws", value = "AGENTSVIEW_PROXY_PG_URL", env = "exec" }
AGENTSVIEW_PUSH_PASSWORD      = { provider = "bws", value = "AGENTSVIEW_PUSH_PASSWORD", env = "exec" }
AGENTSVIEW_READ_PASSWORD      = { provider = "bws", value = "AGENTSVIEW_READ_PASSWORD", env = "exec" }
AGENTSVIEW_READ_PG_URL        = { provider = "bws", value = "AGENTSVIEW_READ_PG_URL", env = "exec" }
