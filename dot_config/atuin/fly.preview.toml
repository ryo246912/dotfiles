# fly.toml — atuin sync server の preview（お試し）環境。
# 本番 `ryo-shellhistory`（dot_config/atuin/fly.toml）に merge する前に、
# 新しい atuin image が起動するか・health check が通るかを別 app で確認する。
#
# 本番との違い:
#   - app 名を分けて本番 machine に影響を与えない。
#   - PostgreSQL（psgl 共用）ではなく ephemeral な SQLite を使い、本番データに触れない。
#   - 使い捨て前提のため open registration を有効にして test user を作れるようにする。
# See https://fly.io/docs/reference/configuration/

app            = "ryo-shellhistory-preview"
primary_region = "nrt"                      # 東京リージョン

[experimental]
# v18.12.0 で server が独立 binary（atuin-server）に分離され、image の ENTRYPOINT が
# `atuin` → `atuin-server` に変わった。新 image では `server start` ではなく `start` を渡す。
cmd = ["start"]

[build]
image = "ghcr.io/atuinsh/atuin:18.17.1"

[env]
ATUIN_HOST = "0.0.0.0"
ATUIN_PORT = "8888"
# preview は使い捨てなので test user を登録できるよう registration を開放する。
ATUIN_OPEN_REGISTRATION = "true"
# 本番 PostgreSQL に触れないよう、container 内の ephemeral な SQLite を使う。
# machine 停止・再作成で消えるが、お試し起動確認が目的なので許容する。
ATUIN_DB_URI = "sqlite:///tmp/atuin-preview.db"

[http_service]
auto_start_machines  = true    # オンデマンド起動
auto_stop_machines   = "stop"  # 自動停止
force_https          = true
internal_port        = 8888
min_machines_running = 0       # 最小起動数（idle 時は 0 でコストを抑える）
processes            = ["app"]

[checks]
[checks.atuin_health]
grace_period = "30s"
method       = "GET"
path         = "/"
port         = 8888
timeout      = "5s"
type         = "http"

[[vm]]
cpu_kind  = "shared" # 最安のCPUタイプ
cpus      = 1        # 最小CPU数
memory_mb = 256      # 最小メモリ
