output:
  - meta
  - summary
  - failure
  - execution_out

glob_matcher: doublestar

pre-commit:
  jobs:
    - name: stash files (ai-only)
      only: &ai-only
        - run: test -n "${AI_AGENT:-}"
      run: |
        marker="$(git rev-parse --git-path lefthook-pre-commit-stash)"
        before="$(git rev-parse --verify -q refs/stash || true)"
        # mount-container-only-dirs.sh が bind mount した生成物ディレクトリ（.venv 等）は
        # .gitignore 対象でない限り未追跡の空ディレクトリに見え、stash -u が削除しようとして
        # "Device or resource busy" で失敗する。mount 対象と同じ名前を stash の対象から除外する。
        rc=0
        git stash push --keep-index --include-untracked -q -m "lefthook-pre-commit" -- . \
          ':(exclude,glob)**/node_modules' ':(exclude,glob)**/.venv' ':(exclude,glob)**/.gradle' \
          ':(exclude,glob)**/.terraform' ':(exclude,glob)**/target' || rc=$?
        after="$(git rev-parse --verify -q refs/stash || true)"
        # stash が失敗しても途中まで作られている場合がある。マーカーを必ず書き、
        # 後続の stash pop で未追跡ファイルを復元できるようにしてから失敗を返す。
        if [ "$before" != "$after" ]; then
          printf '%s\n' "$after" > "$marker"
        else
          rm -f "$marker"
        fi
        exit "$rc"
    - name: lint (ai-only)
      only: *ai-only
      group:
        parallel: true
        jobs:
          - name: actions
            glob: ".github/workflows/**/*.{yaml,yml}"
            run: mise run lint:action
            fail_text: "❌ [ai-only] GitHub Actions lint failed."
          - name: toml
            glob: "**/*.toml"
            run: mise run lint:toml
            fail_text: "❌ [ai-only] TOML format check failed."
          - name: yaml
            glob: "**/*.{yaml,yml}"
            run: mise run lint:yaml
            fail_text: "❌ [ai-only] YAML format check failed."
          - name: json
            glob: "**/*.json"
            run: mise run lint:json
            fail_text: "❌ [ai-only] JSON format check failed."
          - name: markdown
            glob: "**/*.md"
            run: mise run lint:md
            fail_text: "❌ [ai-only] Markdown format check failed."
          - name: shell
            glob: "**/*.{sh,bash,bats}"
            # `mise run lint:shell` は `shfmt -l .` でリポジトリ全体を走査し、shfmt が解析できない
            # .zsh 等が1つでもあると無関係な変更のコミットまで失敗する。ステージ済みの対象だけを検査する。
            run: shfmt -l {staged_files}
            fail_text: "❌ [ai-only] shell format check failed."
          - name: secretlint
            run: mise run lint:secret
            fail_text: "❌ [ai-only] secretlint failed."
          - name: git-secrets
            run: mise run lint:git-secrets
            fail_text: "❌ [ai-only] git-secrets failed."
          - name: betterleaks
            run: mise run lint:betterleaks:staged
            fail_text: "❌ [ai-only] betterleaks failed."
          - name: go
            glob: "**/*.go"
            run: mise run lint:go
            fail_text: "❌ [ai-only] Go lint, test, vet, or build failed."
          - name: python
            glob: "**/*.py"
            run: mise run lint:python
            fail_text: "❌ [ai-only] Python lint or format check failed."
          - name: typescript
            glob: "**/{*.{js,jsx,ts,tsx,mjs,cjs,mts,cts},package.json,tsconfig*.json,oxlint.json,oxfmt.json}"
            run: mise run lint:typescript
            fail_text: "❌ [ai-only] TypeScript/JavaScript lint, format, or type check failed."
    - name: stash pop (ai-only)
      only: *ai-only
      run: |
        marker="$(git rev-parse --git-path lefthook-pre-commit-stash)"
        if [ -f "$marker" ]; then
          expected="$(cat "$marker")"
          current="$(git rev-parse --verify -q refs/stash || true)"
          if [ "$current" != "$expected" ]; then
            echo "❌ [ai-only] Lefthookが作成したstashを特定できません。" >&2
            exit 1
          fi
          git reset --hard -q
          git stash pop --index -q
          rm -f "$marker"
        fi
