[settings]
auto_install = false
experimental = true

[tools]
"aqua:BurntSushi/ripgrep"        = "15.2.0"
"aqua:anthropics/claude-code"    = "2.1.218"
"aqua:astral-sh/uv"              = "0.12.1"
"aqua:cli/cli"                   = "2.97.0"
"aqua:evilmartians/lefthook"     = "2.1.10"
"aqua:golangci/golangci-lint"    = "2.12.2"
"aqua:koalaman/shellcheck"       = "0.11.0"
"aqua:mvdan/sh"                  = "3.13.1"
"aqua:openai/codex"              = "0.146.0"
"aqua:tamasfe/taplo"             = "0.10.0"
"core:bun"                       = "1.3.14"
"core:go"                        = "1.26.5"
"core:node"                      = "22.19.0"
"core:python"                    = "3.14.6"
"github:github/copilot-cli"      = "1.0.73"
"github:philschmid/mcp-cli"      = { version = "0.3.0", asset_pattern = "mcp-cli-linux-x64" }
"github:tomasz-tomczyk/crit"     = "0.18.2"
"npm:@typescript/native-preview" = "7.0.0-dev.20260519.1"
"npm:ccusage"                    = "20.0.1"
"npm:oxfmt"                      = "0.59.0"
"npm:oxlint"                     = "1.76.0"

[settings.npm]
bun = true

[settings.pipx]
uvx = true

[tasks."lint:go"]
depends = [
    "lint:go:lint",
    "lint:go:format",
    "lint:go:test",
    "lint:go:vet",
    "lint:go:build",
]
description = "Run all strict Go checks"

[tasks."lint:go:lint"]
description = "Run golangci-lint for every Go module"
run = '''
config="${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/golangci.yml"
find . -name go.mod -not -path '*/vendor/*' -not -path '*/.git/*' -print0 | while IFS= read -r -d '' module; do
  (cd "$(dirname "$module")" && golangci-lint run --config "$config" ./...)
done
'''
shell = "bash -c"

[tasks."lint:go:format"]
description = "Check Go formatting for every Go module"
run = '''
config="${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/golangci.yml"
find . -name go.mod -not -path '*/vendor/*' -not -path '*/.git/*' -print0 | while IFS= read -r -d '' module; do
  (cd "$(dirname "$module")" && golangci-lint fmt --config "$config" --diff)
done
'''
shell = "bash -c"

[tasks."lint:go:test"]
description = "Run tests for every Go module"
run = '''
find . -name go.mod -not -path '*/vendor/*' -not -path '*/.git/*' -print0 | while IFS= read -r -d '' module; do
  (cd "$(dirname "$module")" && go test ./...)
done
'''
shell = "bash -c"

[tasks."lint:go:vet"]
description = "Run go vet for every Go module"
run = '''
find . -name go.mod -not -path '*/vendor/*' -not -path '*/.git/*' -print0 | while IFS= read -r -d '' module; do
  (cd "$(dirname "$module")" && go vet ./...)
done
'''
shell = "bash -c"

[tasks."lint:go:build"]
description = "Build every Go module"
run = '''
find . -name go.mod -not -path '*/vendor/*' -not -path '*/.git/*' -print0 | while IFS= read -r -d '' module; do
  (cd "$(dirname "$module")" && go build ./...)
done
'''
shell = "bash -c"

[tasks."lint:python"]
depends     = ["lint:python:check", "lint:python:format"]
description = "Run all strict Python checks"

[tasks."lint:python:check"]
description = "Run Ruff lint checks"
run         = 'uvx ruff check --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/ruff.toml" .'

[tasks."lint:python:format"]
description = "Check Python formatting with Ruff"
run         = 'uvx ruff format --check --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/ruff.toml" .'

[tasks."lint:typescript"]
depends = [
    "lint:typescript:check",
    "lint:typescript:format",
    "lint:typescript:typecheck",
]
description = "Run all strict TypeScript/JavaScript checks"

[tasks."lint:typescript:check"]
description = "Run Oxlint checks"
run         = 'oxlint --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/oxlint.json" .'

[tasks."lint:typescript:format"]
description = "Check TypeScript/JavaScript formatting with Oxfmt"
run         = 'oxfmt --check --config "${XDG_CONFIG_HOME:-$HOME/.config}/devcontainer/lint/oxfmt.json" .'

[tasks."lint:typescript:typecheck"]
description = "Run strict tsgo type checks for every TypeScript project"
run = '''
find . -name tsconfig.json -not -path '*/node_modules/*' -not -path '*/.git/*' -print0 | while IFS= read -r -d '' tsconfig; do
  tsgo --noEmit --pretty false --strict --noUncheckedIndexedAccess \
    --exactOptionalPropertyTypes --noImplicitReturns --noUnusedLocals \
    --noUnusedParameters --noFallthroughCasesInSwitch --noImplicitOverride \
    --allowUnreachableCode false --allowUnusedLabels false \
    --forceConsistentCasingInFileNames --useUnknownInCatchVariables -p "$tsconfig"
done
'''
shell = "bash -c"
