# glab-tui: GitLab/GitHub の TUI (https://github.com/rcieri/glab-tui)
# 認証は `gh auth login` (GitHub) / `glab auth login` (GitLab) を利用する。
# 設定は任意。TUI 内で `s` を押すと現在のビューをこのファイルに保存できる。

# nvim と揃えて tokyonight 系にする
theme_preset = "tokyo-night"

[issues]
columns    = ["ID", "State", "Title", "Labels", "Assignees"]
sort_order = "desc"

[merge_requests]
columns = ["ID", "State", "Title", "Reviewers", "Labels"]

[pipelines]
columns = ["ID", "Status", "Branch", "Duration"]
