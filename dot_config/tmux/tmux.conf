# マウスでウィンドウ・ペインの切り替えやリサイズを可能にする
set -g mouse on

bind -T edit-mode-vi WheelUpPane send-keys -X scroll-up
bind -T edit-mode-vi WheelDownPane send-keys -X scroll-down

# スクロール可能な行数を2000行にする
set -g history-limit 2000

# copy-pipeのデフォルトでpipeされるコマンドを指定
set -g copy-command cb

# status line を更新する間隔を 1 秒にする
set -g status-interval 1

#--------------------------------------------------------------
# style
#--------------------------------------------------------------

# True color化対応
set -g default-terminal "screen-256color"
# set -g default-terminal "tmux-256color" # tmux-256colorではMacOSでは表示崩れがあったため
set -ag terminal-overrides ",alacritty:RGB,rio:Tc,wezterm:RGB,xterm-256color:RGB,xterm-ghostty:RGB,ghostty:RGB"
# screen-256colorでDSR（Device Status Report）をサポートし、nvim起動時の遅延警告を抑制
set -ga terminal-features "screen-256color:DSR-cursor-pos"

# tmuxを経由して実際のターミナルに直接エスケープシーケンスを送信できるようにする
set -g allow-passthrough on

# image.nvim（Kitty graphics protocol）でPDF/画像を正しく描画するための設定
# focus-events: pane切り替え時の再描画を有効化 / visual-activity: 画像出力を活動通知扱いしない
set -g focus-events on
setw -g visual-activity off

# 環境変数を引き継ぐ設定
set -ga update-environment EDITOR
set -ga update-environment PATH
set -ga update-environment SHELL

# ステータスバーの背景色を変更する
set -g status-bg "#000000"

# status line の文字色を指定する
set -g status-fg "#FFFFFF"

# window-status を中央揃えで配置する
set -g status-justify "centre"

# ステータスバーをトップに配置する
set -g status-position top

# ペインの開始番号を 0 から 1 に変更する
set -g base-index 1
# ウィンドウ閉じたらウィンドウ番号詰める
set -g renumber-windows on

# window名の背景色・文字色を指定
set -g window-status-format '#[bg=#808080] #I #{b:pane_current_path} '
set -g window-status-current-format '#[bg=#ffff00]#[fg=#000000]#{?client_prefix,#[bg=#00ff00],}#{?pane_synchronized,#[bg=#00FFBF],} #I #{b:pane_current_path}#{?window_zoomed_flag,Z,} '

# windowの背景色を指定
set -g window-style 'fg=#9e9e9e,bg=#303030'
set -g window-active-style 'fg=#bcbcbc,bg=#000000'

# copy-modeの検索のスタイルを指定
set -g mode-style "fg=#000000,bg=#ffff00"
set -g copy-mode-match-style "fg=#000000,bg=#ffff00"
set -g copy-mode-current-match-style "fg=#ffff00,bg=#ff0000"

# ペインのステータスラインのスタイルを指定
set -g pane-border-status bottom
set -g pane-border-format "#[fg=#000000,bg=#ffff00]#{?pane_active,#[bg=#ff0000],} #S:#I.#P #{b:pane_current_path} (#{pane_tty}) "

#--------------------------------------------------------------
# key-binding
#--------------------------------------------------------------

# コピーモードのキー操作をviライクにする
set-window-option -g mode-keys vi

# 新しいウィンドウを現在のウィンドウの右側に作成
bind -T prefix c new-window -a

# ウィンドウ一覧表示
bind -T prefix s choose-tree -F "[#I#P] #{pane_current_command} #{pane_current_path}" -w -Z

# 選択開始キーの設定
bind -T copy-mode-vi v send-keys -X begin-selection

# 矩形(くけい)選択のON/OFF
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# 選択範囲のコピー(copy-pipe=コピーモード抜けない)
bind -T copy-mode-vi Enter send-keys -X copy-pipe

# mark部分にjump
bind -T copy-mode-vi x send-keys -X jump-to-mark

# コピーモード時に ? でsearch-backward
bind -T copy-mode-vi "?" command-prompt -T search -p "(search up)" { send-keys -X search-backward "%%" }

# コピーモード→検索を1コマンドに設定
bind c-f copy-mode \
  "\;" command-prompt -T search -p "(search up)" { send-keys -X search-backward "%%" }
# bind c-u run-shell "if [ copy-mode = $(tmux display -p -F "{pane_mode}") ] ; then tmux send-keys -X halfpage-up ; else tmux copy-mode && send-keys -X halfpage-up ; fi"

# 現在のディレクトリで水平/垂直分割
bind '"' split-window -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'

# ウィンドウの入れ替え(C-[はEscと同じ\x1Bを送信するために)
bind C-^ swap-window -t -1 "\;" previous-window
bind C-] swap-window -t +1 "\;" next-window

# ペインの上下左右・前後移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# bind C-i select-pane -t :.-
# bind C-] select-pane -t :.+

# ペインの幅を上下左右に広げる
bind C-h resize-pane -L 1
bind C-i resize-pane -D 1 #ctrl + jが入力できないため、代わりに設定
bind C-j resize-pane -D 1
bind C-k resize-pane -U 1
bind C-l resize-pane -R 1

# ペインを数字選択で表示
set -g display-panes-time 10000
set -g pane-base-index 1

# synchronize-panesのON/OFF [if-shell "条件式" "true" "false"][-F:フォーマットを展開後に成否判定][#{==:a,b}|aとbが等しいかを比べる比較構文]
bind e if-shell -F "#{==:#{pane_synchronized},0}" "set synchronize-panes on" "set synchronize-panes off"

# 設定ファイルのリロード
bind r source-file ~/.config/tmux/tmux.conf "\;" display "Reloaded!"

# popup window(popup)を起動/デタッチ [-E:exit時に自動で閉じる]
# (通常のデタッチではoverlay/popupをkillしない。強制killはbind Pで行う)
bind C-p popup -xC -yC -w95% -h95% -E -d "#{pane_current_path}" '\
  session=$(tmux display -p -F "#{session_name}"); \
  if [ "$session" = "overlay" ]; then \
    tmux detach-client ; \
  elif [ "$session" = "popup" ]; then \
    tmux detach-client ; \
  else \
    tmux attach -c $(tmux display -p -F "#{pane_current_path}") -t popup || tmux new -s popup ; \
  fi \
'

# overlayを強制killしてデタッチ (Cmd+Shift+P経由。overlay表示中のみ意味を持つ)
bind P run-shell '\
  session=$(tmux display -p -F "#{session_name}"); \
  if [ "$session" = "overlay" ]; then \
    current_win=$(tmux display -p -F "#{window_index}"); \
    tmux detach-client -E "tmux kill-window -t overlay:${current_win}" ; \
  fi \
'

# popup window(popup)を起動/デタッチ(ディレクトリある場合はそちらを開く) [-E:exit時に自動で閉じる]
bind C-t popup -xC -yC -w95% -h95% -E -d "#{pane_current_path}" '\
  session=$(tmux display -p -F "#{session_name}"); \
  if [ "$session" = "popup" ]; then \
    tmux detach-client; \
  else \
    current_path=$(tmux display -p -F "#{pane_current_path}"); \
    if tmux has-session -t popup 2>/dev/null; then \
      # ディレクトリが一致するwindowを取得、例)popup:3.0
      window=$(tmux list-windows -t popup -F "#{window_index}:#{pane_current_path}" | awk -F: -v path="$current_path" "\$NF == path {print \$1; exit}"); \
      if [ -n "$window" ]; then \
        tmux attach -t "popup:$window"; \
      else \
        tmux new-window -t popup -c "$current_path" \; attach -t popup; \
      fi; \
    else \
      tmux new-session -s popup -c "$current_path"; \
    fi; \
  fi \
'

# popup window(navi)を起動/デタッチ [-E:exit時に自動で閉じる]
# [-b:buffer name][-d:delete buffer][-r:LFを自動で置換しない][-p:paste時にコマンドを自動で実行しない][-t:target pane]
#後方の空白文字を削除 ${TMP_BUFFER%"${TMP_BUFFER##*[![:space:]]}"}
#前方の空白文字を削除 ${TMP_BUFFER#"${TMP_BUFFER%%[![:space:]]*}"}
#複数の連続した空白を1つにする sed -e "s/  */ /g"
bind C-g popup -xC -y "#{popup_pane_bottom}" -w95% -h40% -E '\
  window=$(tmux display -p -F "#S:#I.#P") && \
  export FZF_DEFAULT_OPTS="-m --layout=reverse --border" && \
  TMP_BUFFER=$(navi --print | tr "\n" " ") && \
  TMP_BUFFER=${TMP_BUFFER%"${TMP_BUFFER##*[![:space:]]}"} && \
  TMP_BUFFER=${TMP_BUFFER#"${TMP_BUFFER%%[![:space:]]*}"} && \
  TMP_BUFFER=$(echo "$TMP_BUFFER" | sed -e "s/  */ /g") && \
  tmux set-buffer -b tmp "$TMP_BUFFER" && \
  tmux paste-buffer -drp -t $window -b tmp \
'

# popup window(shortcut)を起動/デタッチ [-E:exit時に自動で閉じる]
bind C-s popup -xC -yC -w95% -h50% -E -d "#{pane_current_path}" '\
  export FZF_DEFAULT_OPTS="-m --layout=reverse --border" && \
  no=$(echo "1 ~/.local/share/chezmoi/not_config/shortcut/list.csv\n2 ~/.config/vim/vim.md" | fzf | cut -d " " -f1) && \
  if [ $no = "1" ]; then \
    cat ~/.local/share/chezmoi/not_config/shortcut/list.csv | column -t -s, | fzf --no-sort; \
  elif [ $no = "2" ]; then \
    bat ~/.config/vim/vim.md --theme "Monokai Extended" --paging always; \
  else \
    echo "pass"; \
  fi \
'

# git-worktree-managerを起動 (overlayが残っている場合はpopupで再表示するのみ、無い場合のみ新規起動)
bind C-w popup -xC -yC -w95% -h95% -E -d "#{pane_current_path}" '\
  current_path=$(tmux display -p -F "#{pane_current_path}") ; \
  if tmux has-session -t overlay 2>/dev/null; then \
    tmux attach -t overlay ; \
  else \
    tmux new-session -s overlay -c "$current_path" "git-worktree-manager" \; set-option status off; \
  fi \
'

# インタラクティブツール選択でpopup起動 (e1s / lazydocker / d4s / lazygit / livediff / lazychezmoi / gh-dash / yazi) (overlayが残っている場合はpopupで再表示するのみ、無い場合のみ新規起動)
bind C-d popup -xC -yC -w95% -h95% -E -d "#{pane_current_path}" '\
  current_path=$(tmux display -p -F "#{pane_current_path}") ; \
  if tmux has-session -t overlay 2>/dev/null; then \
    tmux attach -t overlay ; \
  else \
    tool=$(printf "lazygit\nlivediff\ne1s\nlazydocker\nd4s\nlazychezmoi\ngh-dash\nyazi" | fzf --header="ツールを選択 (Esc: キャンセル)" --layout=reverse --border) || exit 0 ; \
    tmux new-session -s overlay -c "$current_path" "$tool" \; set-option status off; \
  fi \
'

# yaziを起動
bind C-y popup -xC -yC -w95% -h95% -E -d "#{pane_current_path}" '\
  current_path=$(tmux display -p -F "#{pane_current_path}") ; \
  if tmux has-session -t popup 2>/dev/null; then \
    tmux new-window -t popup -c "$current_path" -e _ZO_DATA_DIR="$HOME/.local/state/zoxide" "yazi" ; \
    tmux attach -t popup ; \
  else \
    tmux new-session -s popup -c "$current_path" -e _ZO_DATA_DIR="$HOME/.local/state/zoxide" "yazi" \; set-option status off; \
  fi \
'

# editorpromptを起動
bind C-v run-shell ' \
  original_pane=#{pane_id}; \
  tmux popup -w 80% -h 40% -E -d "#{pane_current_path}" "editprompt open --editor nvim --always-copy --target-pane \"$original_pane\""
'

#--------------------------------------------------------------
# plugin
#--------------------------------------------------------------

# プラグインはtpmではなくmise（http backend）で取得・version管理し、mise where で解決したパスから直接ロードする
# mise install 済みが前提（auto_install=false）。miseが解決できない場合は該当プラグインを黙ってスキップする

# tmux-yank
run 'if p="$(mise where http:tmux-yank 2>/dev/null)"; then "$p/yank.tmux"; fi'

# lazy-tmux（tmux-resurrect/tmux-continuumの代替）
# tpm形式のプラグインではなくGo製CLIのため、miseでバイナリを取得してPATH経由で呼び出す
# 復元時に再実行するコマンドのallowlist等は ~/.config/lazy-tmux/lazy-tmux.toml で設定する
# https://lazy-tmux.xyz/

## 15分毎に全セッションを自動保存する（scrollbackは1ペインあたり5000行まで保存）
## daemonは多重起動できないため、既に起動済みの場合はメッセージ表示のみ行う
run-shell -b 'lazy-tmux daemon --interval 15m --scrollback --scrollback-lines 5000 >/tmp/lazy-tmux.log 2>&1 || tmux display-message "lazy-tmux daemon already running"'

## tmux起動時に最後に保存されたセッションを復元する
## continuumと異なり復元されるのは1セッションのみで、残りは prefix + R のpickerから遅延復元する
run-shell -b 'lazy-tmux bootstrap --session last >/tmp/lazy-tmux-bootstrap.log 2>&1'

## keybindをprefix→S（全セッション保存）・R（picker表示→選択したセッションを復元）に設定
bind S run-shell 'lazy-tmux save --all --scrollback --scrollback-lines 5000 && tmux display-message "All sessions saved successfully!"'
bind R display-popup -B -w 80% -h 80% -E 'lazy-tmux picker'

