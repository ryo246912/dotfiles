# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/tfaction/refs/tags/v2.1.1/schema/tfaction-root.json
#
# tfaction (https://suzuki-shunsuke.github.io/tfaction/) の設定。
# terraform/agentsview 以外にroot moduleを追加する場合は、そのdirectoryに
# tfaction.yamlを置き、このtarget_groupsへ追記する。

plan_workflow_name: terraform-plan.yaml

available_providers:
  - name: registry.terraform.io/hashicorp/google
  - name: registry.terraform.io/cockroachdb/cockroach

# Drift Detection: root moduleのcodeと実際のGCP/CockroachDB上のresourceの差分を
# 定期的に検知し、GitHub Issueで管理する。
# https://suzuki-shunsuke.github.io/tfaction/docs/drift-detection
drift_detection:
  enabled: true
  num_of_issues: 1
  minimum_detection_interval: 168 # 7日。同じroot moduleを1週間以内に再チェックしない

target_groups:
  - working_directory: terraform/agentsview
    runs_on: ubuntu-slim
    # GCP Workload Identity連携。実際の値はGCP側でpool/provider/service accountを
    # 作成した後に置き換えること（値は秘密情報ではない）。
    gcp_service_account: terraform-agentsview@REPLACE_WITH_GCP_PROJECT_ID.iam.gserviceaccount.com
    gcp_workload_identity_provider: projects/REPLACE_WITH_GCP_PROJECT_NUMBER/locations/global/workloadIdentityPools/github-actions/providers/dotfiles
    env:
      # GCSバックエンドの設定。terraform/agentsview/versions.tfのbackend "gcs" {}が
      # 空なのは、ここでbucket名を渡すため（account IDをcodeに残さないため）。
      TF_CLI_ARGS_init: "-backend-config=bucket=REPLACE_WITH_GCS_BUCKET -backend-config=prefix=agentsview"
    secrets:
      - env_name: TF_VAR_gcp_project_id
        secret_name: GCP_PROJECT_ID
      - env_name: COCKROACH_API_KEY
        secret_name: COCKROACH_API_KEY
      - env_name: TF_VAR_cockroach_owner_password
        secret_name: COCKROACH_OWNER_PASSWORD
      - env_name: TF_VAR_cockroach_push_password
        secret_name: COCKROACH_PUSH_PASSWORD
      - env_name: TF_VAR_cockroach_read_password
        secret_name: COCKROACH_READ_PASSWORD
