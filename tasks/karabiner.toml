["karabiner:apply"]
description = "build and apply karabiner.ts configuration"
run         = ["mise run karabiner:dry-run", "bun unmanaged/karabiner-ts/karabiner.ts"]

["karabiner:dry-run"]
description = "build and dry-run karabiner.ts configuration"
run = [
    "bun unmanaged/karabiner-ts/karabiner.ts --dry-run > unmanaged/karabiner-ts/karabiner.json",
    "oxfmt unmanaged/karabiner-ts/karabiner.json",
]
