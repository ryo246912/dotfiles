["karabiner:apply"]
description = "build and apply karabiner.ts configuration"
run         = ["mise run karabiner:dry-run", "bun not_config/karabiner-ts/karabiner.ts"]

["karabiner:dry-run"]
description = "build and dry-run karabiner.ts configuration"
run = [
    "bun not_config/karabiner-ts/karabiner.ts --dry-run > not_config/karabiner-ts/karabiner.json",
    "oxfmt not_config/karabiner-ts/karabiner.json",
]
