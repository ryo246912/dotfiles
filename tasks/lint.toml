["lint:all"]
# 独立したlint:shellタスクをリポジトリ全体の既定値へ含めないよう明示的に列挙する。
# shellの検査をhookで強制するのはAI用devcontainerだけとする。
depends = [
    "lint:action",
    "lint:toml",
    "lint:yaml",
    "lint:json",
    "lint:md",
    "lint:secret",
    "lint:git-secrets",
    "lint:betterleaks:staged",
]
description = "Run all linters"

["lint:action"]
depends     = ["lint:actionlint", "lint:ghalint", "lint:zizmor", "lint:pinact"]
description = "Run all action linters"

["lint:actionlint"]
description = "Run actionlint"
run         = "actionlint -ignore 'SC2016:'"

["lint:ghalint"]
description = "Run ghalint"
run         = "ghalint run"

["lint:zizmor"]
description = "Run zizmor"
run         = "GH_TOKEN=$(gh auth token) zizmor --config zizmor.yml --pedantic --min-severity=low .github/workflows"

["lint:pinact"]
description = "Run pinact --check"
run         = "if [ -n \"$GITHUB_TOKEN\" ]; then pinact run --check; else ghtkn exec -- pinact run --check; fi"

["lint:toml"]
description = "Run lint TOML files"
hide        = true
run         = "taplo format --check"

["lint:yaml"]
description = "Run lint YAML files"
hide        = true
run         = "oxfmt --disable-nested-config --check '**/*.{yaml,yml}'"

["lint:json"]
description = "Run lint JSON files"
hide        = true
run         = "oxfmt --disable-nested-config --check '**/*.json'"

["lint:md"]
description = "Run lint Markdown files"
hide        = true
run         = "oxfmt --disable-nested-config --check '**/*.md'"

["lint:secret"]
description = "Run secretlint"
run         = "secretlint '**/*'"

["lint:git-secrets"]
description = "Run git-secrets scan"
run         = "git secrets --scan"

["lint:betterleaks:staged"]
description = "Run betterleaks detect"
run         = "betterleaks git --staged -v"

["lint:shell"]
description = "Check shell script formatting with shfmt"
# `shfmt -l .` は .zsh 等も探索し、bash として解析できず失敗するため、git 管理下の *.sh だけを対象にする。
# NUL 区切りで空白を含むパスに対応し、0 件なら何もせず（shfmt の stdin 待ちを避ける）、未 stage で削除済みのファイルは除く。
run = '''git ls-files -z '*.sh' | xargs -0 -r sh -c 'for f; do [ -e "$f" ] && printf "%s\0" "$f"; done' _ | xargs -0 -r shfmt -l'''
