["lint:all"]
# 独立したlint:shellタスクをリポジトリ全体の既定値へ含めないよう明示的に列挙する。
# shellの検査をhookで強制するのはAI用devcontainerだけとする。
depends = [
    "lint:rulesync",
    "lint:action",
    "lint:toml",
    "lint:yaml",
    "lint:json",
    "lint:md",
    "lint:secret",
    "lint:git-secrets",
    "lint:betterleaks:staged",
]
description = "Run all linters"

["lint:action"]
depends     = ["lint:jactionlint", "lint:ghalint", "lint:zizmor", "lint:pinact"]
description = "Run all action linters"

["lint:jactionlint"]
description = "Run jactionlint"
run         = "jactionlint --profile correctness --ignore 'SC2016:'"

["lint:ghalint"]
description = "Run ghalint"
run         = "ghalint run"

["lint:zizmor"]
description = "Run zizmor"
run         = "GH_TOKEN=$(gh auth token) zizmor --config zizmor.yml --pedantic --min-severity=low .github/workflows"

["lint:pinact"]
description = "Run pinact --check"
run         = "if [ -n \"$GITHUB_TOKEN\" ]; then pinact run --check; else ghtkn exec -- pinact run --check; fi"

["lint:dockerfile-pin"]
description = "Run dockerfile-pin check"
# sandbox template の agent は VARIANT で選び、公開 workload の latest を追従する。
run = "dockerfile-pin check --ignore-images docker/sandbox-templates:* --ignore-images docker.io/sbx/*"

["lint:toml"]
description = "Run lint TOML files"
hide        = true
run         = "taplo format --check"

["lint:yaml"]
description = "Run lint YAML files"
hide        = true
run         = "oxfmt --disable-nested-config --check '**/*.{yaml,yml}'"

["lint:json"]
description = "Run lint JSON files"
hide        = true
run         = "oxfmt --disable-nested-config --check '**/*.json'"

["lint:md"]
description = "Run lint Markdown files"
hide        = true
run         = "oxfmt --disable-nested-config --check '**/*.md'"

["lint:secret"]
description = "Run secretlint"
run         = "secretlint '**/*'"

["lint:git-secrets"]
description = "Run git-secrets scan"
run         = "git secrets --scan"

["lint:betterleaks:staged"]
description = "Run betterleaks detect"
run         = "betterleaks git --staged -v"

["lint:shell"]
description = "Check shell script formatting with shfmt"
# `shfmt -l .` は .zsh 等も探索し、bash として解析できず失敗するため、git 管理下の *.sh だけを対象にする。
run = "shfmt -l $(git ls-files '*.sh')"

["lint:rulesync"]
description = "rulesync のソースと生成済みルール・hooks・skills の差分を検査する"
run = '''
set -euo pipefail

cd "$MISE_PROJECT_ROOT"
repo_dir="$PWD"
check_dir="$(mktemp -d)"
trap 'rm -rf "$check_dir"' EXIT
cp rulesync.jsonc "$check_dir/"
cp -R .rulesync "$check_dir/"
(cd "$check_dir" && rulesync generate)

status=0
for file in CLAUDE.md AGENTS.md .claude/settings.json .codex/hooks.json; do
	diff -u "$repo_dir/$file" "$check_dir/$file" || status=1
done
for dir in .claude/skills .agents/skills; do
	diff -ruN "$repo_dir/$dir" "$check_dir/$dir" || status=1
done
if [ "$status" -ne 0 ]; then
	echo 'rulesync の生成物に差分があります。リポジトリ直下で rulesync generate を実行してください。' >&2
fi
exit "$status"
'''
shell = "bash -c"
