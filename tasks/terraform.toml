["tf:fmt:check"]
description = "terraform/agentsviewのフォーマットチェック"
run         = "cd terraform/agentsview && terraform fmt -check -recursive"

["tf:validate"]
description = "terraform/agentsviewのinit(backendなし)とvalidate"
run         = "cd terraform/agentsview && terraform init -backend=false -input=false && terraform validate"

["tf:tflint"]
description = "terraform/agentsviewのtflint"
run         = "cd terraform/agentsview && tflint --init && tflint"

["tf:trivy"]
description = "terraform/agentsviewのtrivy設定スキャン"
run         = "trivy config terraform/agentsview"
