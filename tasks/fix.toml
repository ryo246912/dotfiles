["fix:all"]
# Listed explicitly instead of ["fix:*"]: that glob also matches fix:pinact and
# fix:action-disable-checkout-persist-credentials directly, and mise runs sibling
# depends in parallel, so they'd run a second time concurrently with fix:action's
# own sequential run of them, racing on the same workflow files.
depends = [
    "fix:action",
    "fix:toml",
    "fix:yaml",
    "fix:json",
    "fix:md",
]
description = "Run all formatters"

["fix:action"]
description = "Run fix actions files"
run = [
    { task = "fix:pinact" },
    { task = "fix:action-disable-checkout-persist-credentials" },
]

["fix:pinact"]
description = "Run pinact (fix)"
run         = "if [ -n \"$GITHUB_TOKEN\" ]; then pinact run; else ghtkn exec -- pinact run; fi"

["fix:action-disable-checkout-persist-credentials"]
description = "Run fix actions disable-checkout-persist-credentials"
run         = ["disable-checkout-persist-credentials"]

["fix:toml"]
description = "Run fix TOML files"
hide        = true
run         = "taplo format"

["fix:yaml"]
description = "Run fix YAML files"
hide        = true
run         = "oxfmt --disable-nested-config '**/*.{yaml,yml}'"

["fix:json"]
description = "Run fix JSON files"
hide        = true
run         = "oxfmt --disable-nested-config '**/*.json'"

["fix:md"]
description = "Run fix Markdown files"
hide        = true
run         = "oxfmt --disable-nested-config '**/*.md'"
