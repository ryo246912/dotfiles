# `mise bootstrap dotfiles` のラッパー task。
# 常に `~/dotfiles` 直下（このリポジトリの checkout ルート）で実行する前提
# （`mise bootstrap` 全般と同じ制約。docs/mise.md 参照）。

["dotfiles:status"]
description = "[dotfiles] の現在の状態を確認する（read-only）"
run         = "mise bootstrap dotfiles status"

["dotfiles:diff"]
description = "[dotfiles] の差分を delta で表示する"
# 単一ファイルの entry（template 等）は行単位の unified diff が出るが、
# ディレクトリ単位の entry（"~/.config" 等のブランケット copy）は
# 「内容が異なる」旨の1行のみで、ファイル単位の中身までは出ない
# （mise 2026.9.3 で実機確認済み）。ディレクトリ entry の中身まで見たい場合は
# `diff -ru <source> <target> | delta` のように直接比較すること。
run = "mise bootstrap dotfiles diff | delta"

["dotfiles:apply"]
description = "[dotfiles] を適用する"
run         = "mise bootstrap dotfiles apply"

["dotfiles:apply-interactive"]
description = "差分がある entry を1つずつ delta で確認しながら適用する"
# status --json の state は "applied"（同期済み）以外なら差分ありとみなす
# （"differs"/"missing"/"source missing" 等）。entry 単位（宣言した target 単位）の
# 粒度であり、ディレクトリ entry 内の1ファイルだけを選ぶことはできない
# （dotfiles:diff のコメント参照）。
run = '''
set -eu

targets=$(mise bootstrap dotfiles status --json | python3 -c "
import json, sys
data = json.load(sys.stdin)
for f in data['files']:
    if f['state'] != 'applied':
        print(f['target'])
")

if [ -z "$targets" ]; then
  echo "全て最新です"
  exit 0
fi

echo "$targets" | while IFS= read -r target; do
  echo "=== $target ==="
  mise bootstrap dotfiles diff "$target" | delta || true
  printf '%s を適用しますか? (y/N) ' "$target"
  read -r answer
  case "$answer" in
    y | Y) mise bootstrap dotfiles apply --yes "$target" ;;
    *) echo "skip: $target" ;;
  esac
done
'''
shell = "bash -c"
