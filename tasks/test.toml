["test:agentsview"]
depends     = ["test:agentsview:*"]
description = "Run the AgentsView dump tooling regressions"

["test:agentsview:dump-auth"]
description = "Run the prepare-dump-auth regression"
hide        = true
run         = "python3 config/agentsview/tests/prepare-dump-auth_test.py"

["test:agentsview:dump-filter"]
description = "Run the batch-insert-dump regression"
