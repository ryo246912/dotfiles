# Vicinae の shortcuts / snippets（~/.local/share/vicinae/<kind>/<kind>.json）を
# 共有分（config-mac/vicinae/<kind>.shared.json）と PC ごとの分
# （~/.config/vicinae/<kind>.local.json、git 管理外）から組み立てる。
# 共有分の {{secret.<key>}} は config-mac/vicinae/sync.secret.yml（git 管理外）の値で埋める。
# マージの規則は unmanaged/vicinae/sync.jq を参照（docs/raycast.md にも記載）。
#
# Vicinae はどちらも起動時にだけ読み、変更のたびにメモリ上の一覧で全件を書き戻すため、
# 起動中に差し替えても上書きされる。終了させてから書き出し、起動し直す。

["vicinae:sync"]
description = "Vicinae の shortcuts/snippets を shared + local からマージして書き出す（GUI の変更は local に取り込む）"
run = '''
#!/bin/bash
set -euo pipefail
[ "$(uname)" != "Darwin" ] && { echo "macOS 専用のタスクです"; exit 1; }

cfg="$HOME/.config/vicinae"
data="$HOME/.local/share/vicinae"
state_dir="$HOME/.local/state/vicinae"
secret="$cfg/sync.secret.yml"
mkdir -p "$state_dir"

json_or() { if [ -s "$1" ]; then cat "$1"; else echo "$2"; fi; }
is_running() { osascript -e 'application "Vicinae" is running' | grep -q true; }

secrets='{}'
if [ -f "$secret" ]; then secrets=$(yq -o=json '. // {}' "$secret"); fi

was_running=false
if is_running; then
  was_running=true
  osascript -e 'tell application "Vicinae" to quit'
  for _ in $(seq 50); do is_running || break; sleep 0.2; done
  is_running && { echo "Vicinae が終了しませんでした。手動で終了してから再実行してください"; exit 1; }
fi

now=$(date +%s)
sync_kind() {
  local kind="$1" spec="$2"
  local shared="$cfg/$kind.shared.json" local_file="$cfg/$kind.local.json"
  local target="$data/$kind/$kind.json" synced="$state_dir/$kind-synced.json"
  [ -f "$shared" ] || { echo "$shared がありません（先に bootstrap:dotfiles:apply を実行）"; return 1; }
  mkdir -p "$(dirname "$target")"

  local result
  result=$(jq -n \
    --argjson kind "$spec" \
    --argjson shared "$(cat "$shared")" \
    --argjson local "$(json_or "$local_file" '[]')" \
    --argjson current "$(json_or "$target" '[]')" \
    --argjson synced "$(json_or "$synced" '[]')" \
    --argjson secrets "$secrets" \
    -f "$MISE_PROJECT_ROOT/unmanaged/vicinae/sync.jq")

  local backup=""
  if [ -f "$target" ]; then
    cp "$target" "$state_dir/$kind.json.bak"
    backup="（直前の内容: $state_dir/$kind.json.bak）"
  fi
  jq '.items' <<<"$result" >"$target.tmp" && mv "$target.tmp" "$target"
  jq '.local' <<<"$result" >"$local_file"
  jq '.synced' <<<"$result" >"$synced"
  jq -r --arg kind "$kind" '.report[] | "[\($kind)] \(.)"' <<<"$result"
  echo "[$kind] 書き出し: $(jq '.items | length' <<<"$result") 件$backup"
}

sync_kind shortcuts "$(jq -n --argjson now "$now" '{
  defkeys: ["name", "icon", "url", "app"],
  statkeys: ["openCount", "createdAt", "updatedAt", "lastUsedAt"],
  required: "url",
  defaults: {openCount: 0, createdAt: $now, updatedAt: $now}
}')"
sync_kind snippets "$(jq -n --argjson now "$now" '{
  defkeys: ["name", "data", "expansion"],
  statkeys: ["createdAt", "updatedAt"],
  required: "data",
  defaults: {createdAt: $now}
}')"

if [ "$was_running" = true ]; then open -a Vicinae; fi
'''
