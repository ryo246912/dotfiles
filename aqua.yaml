# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/aqua-yaml.json
# tfaction (.github/workflows/terraform-plan.yaml, terraform-apply.yaml)が
# terraform/tflint/trivyをinstallするために使う。dotfiles本体のtool管理はmise.tomlで行う。
registries:
  - type: standard
    ref: v4.512.0 # renovate: depName=aquaproj/aqua-registry
packages:
  - name: hashicorp/terraform@v1.15.6
  - name: terraform-linters/tflint@v0.61.0
  - name: aquasecurity/trivy@v0.69.3
