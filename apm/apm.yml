name: apm-global
version: 1.0.0
description: User-scope APM manifest for external agent skills (deployed via `apm install -g`)
author: ryo246912
# Deploy skills to these agent platforms under the user scope.
# claude -> ~/.claude/skills/, codex/copilot/cursor -> ~/.agents/skills/ (共通の universal dir)。
targets:
  - claude
  - codex
  - copilot
  - cursor
dependencies:
  # 外部スキルはすべて upstream リポジトリから依存として取得する（vendor しない）。
  # 再現性のため各依存をコミット SHA または release tag に pin する。
  # CLI も配布するリポジトリは release tag を使い、Renovate で同一PRにまとめる。
  apm:
    # Plannotatorのreview / annotate / last launcher skills。
    - git: backnotprop/plannotator
      path: apps/skills/core/plannotator-review
      ref: v0.28.6
      alias: plannotator-review
    - git: backnotprop/plannotator
      path: apps/skills/core/plannotator-annotate
      ref: v0.28.6
      alias: plannotator-annotate
    - git: backnotprop/plannotator
      path: apps/skills/core/plannotator-last
      ref: v0.28.6
      alias: plannotator-last
    # Effective HTMLのartifact作成skills。releaseがないためcommit SHAへ固定する。
    - git: plannotator/effective-html
      path: skills/html
      ref: 2ac1dfecb0f2474e75260cb6d3c9b9d6d9b5062e
      alias: html
    - git: plannotator/effective-html
      path: skills/design-artifact
      ref: 2ac1dfecb0f2474e75260cb6d3c9b9d6d9b5062e
      alias: design-artifact
    - git: plannotator/effective-html
      path: skills/html-wireframe
      ref: 2ac1dfecb0f2474e75260cb6d3c9b9d6d9b5062e
      alias: html-wireframe
    - git: plannotator/effective-html
      path: skills/html-prototype
      ref: 2ac1dfecb0f2474e75260cb6d3c9b9d6d9b5062e
      alias: html-prototype
    - git: plannotator/effective-html
      path: skills/html-plan
      ref: 2ac1dfecb0f2474e75260cb6d3c9b9d6d9b5062e
      alias: html-plan
    - git: plannotator/effective-html
      path: skills/html-diagram
      ref: 2ac1dfecb0f2474e75260cb6d3c9b9d6d9b5062e
      alias: html-diagram
    # crit（tomasz-tomczyk/crit プラグイン）。
    - tomasz-tomczyk/crit/integrations/claude-code/skills/crit#v0.19.1
    - tomasz-tomczyk/crit/integrations/claude-code/skills/crit-cli#v0.19.1
    # v0.4.0 以降の skill/ は生成前の SKILL.template.md のみで APM package として無効なため、
    # SKILL.md を含む最後の release commit に固定する。配置名は skill 名と揃える。
    - git: zenbu-labs/terminal-browser
      path: skill
      ref: 1b21e3a76453a53eda7f5bdc93c4aaabf70052f2
      alias: terminal-browser
    # tsumiki はリポジトリ全体を plugin package として取り込み、skills 14種と commands を配布する。
    - git: classmethod/tsumiki
      ref: 9a0a2348ebf1cb83b7cf91adfe2ffff28be02525
      alias: tsumiki
    - git: ctxrs/ctx
      path: skills/ctx-agent-history-search
      ref: v0.25.0
      alias: ctx-agent-history-search
    - git: mattpocock/skills
      path: skills/engineering/resolving-merge-conflicts
      ref: 84fdeffd12f2ee307994d1eb6feb48173b6e0502
      alias: resolving-merge-conflicts
    - git: mattpocock/skills
      path: skills/productivity/grill-me
      ref: 84fdeffd12f2ee307994d1eb6feb48173b6e0502
      alias: grill-me
    # grill-me が呼び出す interview loop。本体と同じ commit に pin する。
    - git: mattpocock/skills
      path: skills/productivity/grilling
      ref: 84fdeffd12f2ee307994d1eb6feb48173b6e0502
      alias: grilling
    - git: cathrynlavery/diagram-design
      path: skills/diagram-design
      ref: a157f7616473d966d6f433cf0b4d4f1880603504
      alias: diagram-design
    - git: vercel-labs/skills
      path: skills/find-skills
      ref: 941a7bcfeca4bf07913b9fb6f8ed81f20ff5297c
      alias: find-skills
    # Ponytail は repository 全体を plugin package として取り込み、6 skills と hooks を配布する。
    - git: DietrichGebert/ponytail
      ref: v4.13.0
      alias: ponytail
  # mcpc 専用の MCP server（agent の native MCP には登録しない。docs/mcpc/README.md 参照）。
  # apm:install-mcpc が隔離 HOME の ~/.copilot/mcp-config.json
  # （実体は ~/.config/mcpc/apm-home/.copilot/mcp-config.json）へ生成する。
  # version と uvx / npx の package specifier を同時に pin し、lockfile にも解決結果を記録する。
  # 認証情報は値を書かず、env の ${VAR} で mcpc の起動環境から転送する
  # （AWS は aws-vault exec、Slack / Metabase は fnox exec --profile work が渡す）。
  mcp:
    - name: aws-api
      registry: false
      transport: stdio
      command: env
      args:
        - FASTMCP_LOG_LEVEL=ERROR
        - uvx
        - awslabs.aws-api-mcp-server@1.5.6
      version: 1.5.6
      env:
        AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
        AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
        AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN}"
        AWS_REGION: "${AWS_REGION}"
        AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
    - name: aws-billing
      registry: false
      transport: stdio
      command: env
      args:
        - FASTMCP_LOG_LEVEL=ERROR
        - uvx
        - awslabs.billing-cost-management-mcp-server@0.0.31
      version: 0.0.31
      env:
        AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
        AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
        AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN}"
        AWS_REGION: "${AWS_REGION}"
        AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
    - name: aws-cloudwatch
      registry: false
      transport: stdio
      command: env
      args:
        - FASTMCP_LOG_LEVEL=ERROR
        - uvx
        - awslabs.cloudwatch-mcp-server@0.1.7
      version: 0.1.7
      env:
        AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
        AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
        AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN}"
        AWS_REGION: "${AWS_REGION}"
        AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION}"
    # Notion の remote MCP。OAuth は mcp-remote が初回にブラウザで行い、token は ~/.mcp-auth に保存する。
    - name: notion
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - mcp-remote@0.14.3
        - https://mcp.notion.com/mcp
      version: 0.14.3
    # korotovsky/slack-mcp-server。user token（xoxp）で読む。
    - name: slack
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - slack-mcp-server@1.3.0
        - --transport
        - stdio
      version: 1.3.0
      env:
        SLACK_MCP_XOXP_TOKEN: "${SLACK_MCP_XOXP_TOKEN}"
    - name: metabase
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - "@cognitionai/metabase-mcp-server@2.2.0"
      version: 2.2.0
      env:
        METABASE_URL: "${METABASE_URL}"
        METABASE_API_KEY: "${METABASE_API_KEY}"
    # host で remote debugging を有効にした Chrome（localhost:9222）へ接続する。
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - chrome-devtools-mcp@0.13.0
        - --browser-url=http://localhost:9222
      version: 0.13.0
includes: auto
scripts: {}
