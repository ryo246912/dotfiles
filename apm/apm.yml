name: apm-global
version: 1.0.0
description: User-scope APM manifest for external agent skills (deployed via `apm install -g`)
author: ryo246912
# Deploy skills to these agent platforms under the user scope.
# claude -> ~/.claude/skills/, codex/cursor -> ~/.agents/skills/ (共通の universal dir)。
# copilot は外している: project scope（Renovate が lockfile 更新で実行する `apm install`）と
# user scope（`apm install -g`）で copilot 向けの配布先（.github/ と .copilot/）が異なり、
# lockfile の内容が scope によって変わってしまうため（docs/apm.md 参照）。
targets:
  - claude
  - codex
  - cursor
dependencies:
  # 外部スキルはすべて upstream リポジトリから依存として取得する（vendor しない）。
  # Renovate の apm manager が読めるよう、文字列形式 `owner/repo[/path]#<tag>` で書く
  # （object 形式の `git:`/`path:`/`ref:` は Renovate が無視する）。配置名は path の末尾
  # （path が無ければ repo 名）になる。
  # - release tag がある依存は tag に pin し、Renovate が apm.yml と apm.lock.yaml を同じPRで更新する。
  #   CLI も配布するリポジトリは mise の CLI と Renovate で同一PRにまとめる。
  # - tag が無い依存は ref を書かず、apm.lock.yaml の resolved_commit で pin する。
  #   Renovate の lockFileMaintenance が定期的に最新 commit へ更新する。
  apm:
    # Plannotatorのreview / annotate / last launcher skills。
    - backnotprop/plannotator/apps/skills/core/plannotator-review#v0.28.6
    - backnotprop/plannotator/apps/skills/core/plannotator-annotate#v0.28.6
    - backnotprop/plannotator/apps/skills/core/plannotator-last#v0.28.6
    # Effective HTMLのartifact作成skills（tag なし）。
    - plannotator/effective-html/skills/html
    - plannotator/effective-html/skills/design-artifact
    - plannotator/effective-html/skills/html-wireframe
    - plannotator/effective-html/skills/html-prototype
    - plannotator/effective-html/skills/html-plan
    - plannotator/effective-html/skills/html-diagram
    # crit（tomasz-tomczyk/crit プラグイン）。
    - tomasz-tomczyk/crit/integrations/claude-code/skills/crit#v0.22.0
    - tomasz-tomczyk/crit/integrations/claude-code/skills/crit-cli#v0.22.0
    # v0.4.0 以降の skill/ は生成前の SKILL.template.md のみで APM package として無効なため、
    # SKILL.md を含む v0.3.2 に固定する（Renovate では更新しない）。path 末尾が `skill` なので
    # 配置名を skill 名と揃えるため object 形式 + alias で書く。
    - git: zenbu-labs/terminal-browser
      path: skill
      ref: v0.3.2
      alias: terminal-browser
    # tsumiki はリポジトリ全体を plugin package として取り込み、skills 14種と commands を配布する（tag なし）。
    - classmethod/tsumiki
    - ctxrs/ctx/skills/ctx-agent-history-search#v0.25.0
    # resolving-merge-conflicts は v1.3.0 で upstream から削除されたため v1.2.3 に固定する
    # （Renovate では更新しない）。
    - mattpocock/skills/skills/engineering/resolving-merge-conflicts#v1.2.3
    - mattpocock/skills/skills/productivity/grill-me#v1.2.3
    # grill-me が呼び出す interview loop。本体と同じ tag に pin する（Renovate で同一PRにまとめる）。
    - mattpocock/skills/skills/productivity/grilling#v1.2.3
    - cathrynlavery/diagram-design/skills/diagram-design
    - vercel-labs/skills/skills/find-skills#v1.7.2
    # Ponytail は repository 全体を plugin package として取り込み、6 skills と hooks を配布する。
    - DietrichGebert/ponytail#v5.1.0
  # MCP サーバはここに書かない。apm install は --only apm で MCP を各 agent に登録しないため、
  # ここに書くと lockfile に載らず apm install --frozen（apm:ci）が失敗する。
  # sandbox で使う MCP は config/sbx/mcp.yml（同じ dependencies.mcp の書式）で管理する。
  mcp: []
includes: auto
scripts: {}
