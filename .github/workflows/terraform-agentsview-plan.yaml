name: terraform-agentsview-plan

# PR上でterraform planを実行し、結果をコメントする。applyは行わない。
on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/agentsview/**"
      - ".github/workflows/terraform-agentsview-plan.yaml"

permissions: {}

concurrency:
  group: terraform-agentsview-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ ! endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: terraform/agentsview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: "aqua:hashicorp/terraform"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=agentsview"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        env:
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_cockroach_owner_password: ${{ secrets.COCKROACH_OWNER_PASSWORD }}
          TF_VAR_cockroach_push_password: ${{ secrets.COCKROACH_PUSH_PASSWORD }}
          TF_VAR_cockroach_read_password: ${{ secrets.COCKROACH_READ_PASSWORD }}
          COCKROACH_API_KEY: ${{ secrets.COCKROACH_API_KEY }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color 2>&1 | tee /tmp/agentsview-plan.txt

      - name: Comment plan result on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-agentsview-plan -->';
            const maxLen = 60000;
            let body = fs.readFileSync('/tmp/agentsview-plan.txt', 'utf8');
            if (body.length > maxLen) {
              body = body.slice(0, maxLen) + '\n... (truncated)';
            }
            const outcome = process.env.PLAN_OUTCOME === 'success' ? ':white_check_mark: Success' : ':x: Failure';
            const comment = `${marker}\n## Terraform Plan (agentsview): ${outcome}\n\n<details><summary>Plan output</summary>\n\n\`\`\`\n${body}\n\`\`\`\n\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
