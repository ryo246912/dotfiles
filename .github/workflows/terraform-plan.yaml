name: terraform-plan

# tfaction (https://suzuki-shunsuke.github.io/tfaction/) によるPR上でのterraform plan。
# ファイル名はtfaction-root.yamlのplan_workflow_nameと一致させる必要がある。
# fmt/validate/tflint/trivyはterraform-ci.yaml側で行うため、ここではplanのみ行う。
on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/agentsview/**"
      - "tfaction-root.yaml"
      - "mise.toml"
      - ".github/workflows/terraform-plan.yaml"
      - ".github/workflows/terraform-apply.yaml"

permissions: {}

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    # forkからのPRはrepository secrets(GitHub App秘密鍵等)にアクセスできないため、
    # 認証が必要なplanはskipする(fmt/validate/tflint/trivyはterraform-ci.yaml側で
    # secretsなしに実行されるので、fork PRでもそちらは動く)。
    # bot actorでの除外はしない: tfactionはGitHub App tokenでlock file更新等を
    # 自らpushすることがあり、そのpushのactorはApp(...[bot])になる。ここを
    # skipすると更新後のrerunが止まってしまう。
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      TFACTION_JOB_TYPE: terraform
      TFACTION_TARGET: terraform/agentsview
      TFACTION_WORKING_DIR: terraform/agentsview
      TFACTION_IS_APPLY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: "aqua:hashicorp/terraform"

      # tfactionはPRへのcommit push(fmt/lock file更新)やlabel付与、issueコメントを行うため、
      # GITHUB_TOKENではなくGitHub App tokenを使う。App tokenのpushはGITHUB_TOKENと違い
      # 新しいworkflow runを再トリガーするので、初回planでlock fileが自動commitされた場合も
      # 手動re-runが不要になる。
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TFACTION_APP_ID }}
          private-key: ${{ secrets.TFACTION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: tfaction setup
        id: setup
        uses: suzuki-shunsuke/tfaction@93bf76c239f5120cf83ec5149a1591c25412f9b4 # v2.1.1
        with:
          action: setup
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.setup.outputs.gcp_workload_identity_provider }}
          service_account: ${{ steps.setup.outputs.gcp_service_account }}

      - name: Cache Terraform plugins
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Create Terraform plugin cache dir
        run: mkdir -p ~/.terraform.d/plugin-cache

      # tfactionはtoJSON(secrets)でrepo全体のsecretsをこのactionへ渡すが、これは
      # tfaction公式のsecrets運用方法そのもの(GH Actionのexpressionはsecret名を
      # 動的に絞り込めないため、tfaction.yamlのsecrets:定義に基づく絞り込みは
      # action内部のJSで行う必要がある)。
      # https://suzuki-shunsuke.github.io/tfaction/docs/secret
      # secrets contextの値はGitHub Actions側で自動的にlogからmaskされるため、
      # ログに生値が出ることはない。ただし、このstepではrepoの全secretsを
      # pinされたtfaction actionのprocessへ渡すことにはなる(信頼境界はSHA pin)。
      - name: Output secrets
        id: github-secrets
        uses: suzuki-shunsuke/tfaction@93bf76c239f5120cf83ec5149a1591c25412f9b4 # v2.1.1
        with:
          action: output-github-secrets
          github_secrets: ${{ toJSON(secrets) }} # zizmor: ignore[overprovisioned-secrets] tfaction's official secrets pattern requires the full context here; the action filters it down to tfaction.yaml's declared secrets.

      - name: terraform init
        uses: suzuki-shunsuke/tfaction@93bf76c239f5120cf83ec5149a1591c25412f9b4 # v2.1.1
        with:
          action: terraform-init
          github_token: ${{ steps.app-token.outputs.token }}
          secrets: ${{ steps.github-secrets.outputs.secrets }}

      - name: Plan
        uses: suzuki-shunsuke/tfaction@93bf76c239f5120cf83ec5149a1591c25412f9b4 # v2.1.1
        with:
          action: plan
          github_token: ${{ steps.app-token.outputs.token }}
          secrets: ${{ steps.github-secrets.outputs.secrets }}

      # 同じPRでの再planで古いtfcmtコメントが積み上がらないよう、直近のcommit以外の
      # tfcmtコメントを隠す。
      - name: Hide tfcmt Comments
        uses: suzuki-shunsuke/tfaction@93bf76c239f5120cf83ec5149a1591c25412f9b4 # v2.1.1
        with:
          action: hide-comment
          github_token: ${{ steps.app-token.outputs.token }}
          if: |
            Comment.HasMeta && Comment.Meta.SHA1 != Commit.SHA1 && has(Comment.Meta.Program) && Comment.Meta.Program == "tfcmt"
