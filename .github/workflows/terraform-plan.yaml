name: terraform-plan

# tfaction (https://suzuki-shunsuke.github.io/tfaction/) によるPR上でのterraform plan。
# ファイル名はtfaction-root.yamlのplan_workflow_nameと一致させる必要がある。
on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/agentsview/**"
      - "tfaction-root.yaml"
      - "aqua.yaml"
      - ".github/workflows/terraform-plan.yaml"
      - ".github/workflows/terraform-apply.yaml"

permissions: {}

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ ! endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      TFACTION_JOB_TYPE: terraform
      TFACTION_TARGET: terraform/agentsview
      TFACTION_WORKING_DIR: terraform/agentsview
      TFACTION_IS_APPLY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tfaction setup
        id: setup
        uses: suzuki-shunsuke/tfaction@93bf76c239f5120cf83ec5149a1591c25412f9b4 # v2.1.1
        with:
          action: setup

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.setup.outputs.gcp_workload_identity_provider }}
          service_account: ${{ steps.setup.outputs.gcp_service_account }}

      - name: Output secrets
        id: github-secrets
        uses: suzuki-shunsuke/tfaction@93bf76c239f5120cf83ec5149a1591c25412f9b4 # v2.1.1
        with:
          action: output-github-secrets
          github_secrets: ${{ toJSON(secrets) }}

      - name: terraform init
        uses: suzuki-shunsuke/tfaction@93bf76c239f5120cf83ec5149a1591c25412f9b4 # v2.1.1
        with:
          action: terraform-init
          secrets: ${{ steps.github-secrets.outputs.secrets }}

      - name: Lint
        uses: suzuki-shunsuke/tfaction@93bf76c239f5120cf83ec5149a1591c25412f9b4 # v2.1.1
        with:
          action: test

      - name: Plan
        uses: suzuki-shunsuke/tfaction@93bf76c239f5120cf83ec5149a1591c25412f9b4 # v2.1.1
        with:
          action: plan
          secrets: ${{ steps.github-secrets.outputs.secrets }}
