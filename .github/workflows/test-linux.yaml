name: test-linux

#   mise bootstrap（packages(apt) → dotfiles → pre-tools hook(gh) → tools →
#   post-tools hook(apm/rulesync)）→ zsh 起動
# 方針:
#   - GUI/対話系の手動スクリプト（scripts/install-*.sh、tasks/dotfiles-sync.toml の
#     dotfiles:sync-* task）は CI で実行不能なため呼ばない。setup.md が自動化している
#     `mise bootstrap` 本体（[bootstrap.hooks.*] 込み）だけを検証する。
#   - full mise install は aqua/github backend（GitHub API）を含むため read-only の github.token を
#     注入する。/test-linux は OWNER/MEMBER/COLLABORATOR のみ発火。write 権限は PR コードを実行しない
#     comment ジョブに限定する。
on:
  issue_comment:
    types:
      - created
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: test-linux-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == '/test-linux' || startsWith(github.event.comment.body, '/test-linux ')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      MISE_ENV: linux
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.9.2"
          install: false

      - name: Validate configs（bootstrap 前の高速フィードバック）
        run: |
          set -euo pipefail
          for f in \
            mise.toml \
            mise.mac.toml \
            config/mise/config.toml \
            config-mac/mise/config.mac.toml \
            config/mise/config.linux.toml; do
            python3 -c "import tomllib; tomllib.load(open('$f','rb'))" && echo "OK toml: $f"
          done
          python3 -c "
          import tomllib
          d = tomllib.load(open('mise.toml', 'rb'))
          for name, hook in d['bootstrap']['hooks'].items():
              print(hook['run'])
          " > "$RUNNER_TEMP/hooks.sh"
          bash -n "$RUNNER_TEMP/hooks.sh" && echo "OK: bootstrap hooks bash syntax"
          bash -n scripts/install-packages-windows.sh && echo "OK: install-packages-windows syntax"

      - name: mise bootstrap（[dotfiles] 配置・[bootstrap.hooks.*] 実行）
        # [dotfiles]・[bootstrap.hooks.*] は checkout したこのリポジトリの mise.toml
        # 自身が持つため、cwd をリポジトリ直下に保ったまま実行する（chezmoi の --source 相当の
        # 外部指定は不要）。Linux 専用の mise.<ENV>.toml overlay は不要になった
        # （~/.config は共通の track mode entry・OS 限定分は config-linux/autohotkey のみ
        # で pre-dotfiles hook が seed する）。
        # full mise install（aqua/github backend）が GitHub API を使うため、read-only の
        # github.token を実行するこのステップに限定して注入する（ghalint: job env 禁止）。
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # apm:sync-lock 等のタスクは既定で ~/dotfiles を checkout とみなすため、
          # 既定と異なるパス（GITHUB_WORKSPACE）に checkout される CI ではここで明示する。
          DOTFILES_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # packages フェーズは mise bootstrap プロセス起動時に読み込んだ config しか見ないため、
          # [bootstrap.packages]（config/mise/config.linux.toml という dotfile）を
          # 同一プロセス内で先に配置しても反映されない。dotfiles を先に別プロセスで適用してから
          # 本体を実行する（docs/setup.md 参照）。
          mise bootstrap dotfiles apply --yes
          mise trust ~/.config/mise/config.linux.toml
          # packages フェーズ(apt)の sudo は `[ -t 0 ]`(TTY) を要するため PTY を割り当てる
          # （runner の sudo は NOPASSWD なのでプロンプトは出ない）。
          script -qe -c "mise bootstrap --yes" /dev/null

      - name: assert bootstrap.packages(apt) 導入確認
        run: |
          set -euo pipefail
          rc=0
          for pkg in tig colordiff tree ffmpeg goaccess ugrep; do
            if command -v "$pkg" >/dev/null 2>&1; then echo "OK: $pkg"; else echo "MISSING: $pkg"; rc=1; fi
          done
          exit "$rc"

      - name: assert mise install（代表ツール）
        # repo root の dev 用 mise.toml で解決がぶれないよう neutral cwd で確認する（global config のみ）。
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          rc=0
          # bootstrap が完走していれば [tools] の代表ツールが解決できる。
          for t in node go python bun cargo rg jq fzf gh chezmoi lazygit delta; do
            if mise which "$t" >/dev/null 2>&1; then echo "OK: $t"; else echo "MISSING: $t"; rc=1; fi
          done
          exit "$rc"

      - name: assert [dotfiles] 配置確認
        run: |
          set -euo pipefail
          rc=0
          for f in "$HOME/.zshenv" "$HOME/.config/zsh/.zshrc" "$HOME/.config/git/config" "$HOME/.local/bin/multi-worktree"; do
            if [ -e "$f" ]; then echo "OK: $f"; else echo "MISSING: $f"; rc=1; fi
          done
          [ -x "$HOME/.local/bin/multi-worktree" ] || { echo "MISSING exec bit: multi-worktree"; rc=1; }
          exit "$rc"

      - name: assert zsh 起動
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # zshenv(ZDOTDIR/mise activate) → .zshrc(zinit 等) が致命エラー無く起動することを確認する。
          if ! out=$(timeout 300 zsh -i -c 'echo ZSH_STARTED_OK' 2>&1); then
            echo "$out"
            echo "error: zsh 起動に失敗しました"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q ZSH_STARTED_OK || { echo "error: zsh 起動マーカーが出力されませんでした"; exit 1; }
          echo "OK: zsh started"

  comment:
    needs: test
    if: ${{ always() && github.event_name == 'issue_comment' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      RESULT: ${{ needs.test.result }}
    steps:
      - name: Comment result
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          run_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; *) echo "❌";; esac; }
          body=$(printf '`/test-linux`（mise bootstrap(apt+dotfiles+gh+tools+apm/rulesync)→zsh 起動、[log](%s)）: %s %s' \
            "$run_url" "$(icon "$RESULT")" "$RESULT")
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"
