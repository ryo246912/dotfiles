name: deploy-atuin-preview

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions: {}

jobs:
  preview:
    name: Deploy Atuin preview to Fly.io
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # workflow_dispatch は main 以外の branch から、issue_comment は PR に `/deploy` が
    # 投稿されたときだけ実行する。誤操作防止のため comment 実行は repo owner に限定する。
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.author_association == 'OWNER' &&
       contains(github.event.comment.body, '/deploy'))
    concurrency:
      group: deploy-atuin-preview-${{ github.event.issue.number || github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Add eyes reaction to comment
        if: github.event_name == 'issue_comment'
        run: gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # comment 実行時は対象 PR の head を、それ以外は起動 ref を checkout する。
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: "github:superfly/flyctl"

      - name: Deploy Atuin preview
        id: deploy
        run: |
          flyctl apps create "$APP" 2>/dev/null || true
          flyctl deploy --app "$APP" -c dot_config/atuin/fly.preview.toml --ha=false
          echo "url=https://$APP.fly.dev" >> "$GITHUB_OUTPUT"
        env:
          APP: ryo-shellhistory-preview
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create comment file
        if: github.event_name == 'issue_comment'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          cat << EOF > comment.md
          ## 🚀 Deployed atuin preview to Fly.io
          <table>
            <tr>
              <th scope="row">Preview URL</th>
              <td><a href="$DEPLOYMENT_URL" target="_blank" rel="noopener noreferrer">$DEPLOYMENT_URL</a></td>
            </tr>
          </table>

          > ephemeral な SQLite を使う使い捨て環境です。確認が終わったら app を削除してください。

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF

      - name: Create PR comment
        if: github.event_name == 'issue_comment'
        run: gh pr comment "$PR_NUMBER" --body-file comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
