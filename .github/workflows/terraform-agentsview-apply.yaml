name: terraform-agentsview-apply

# mainへのmerge後にterraform applyを実行する。
on:
  push:
    branches:
      - main
    paths:
      - "terraform/agentsview/**"

permissions: {}

concurrency:
  group: terraform-agentsview-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/agentsview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: "aqua:hashicorp/terraform"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=agentsview"

      - name: terraform apply
        env:
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_cockroach_owner_password: ${{ secrets.COCKROACH_OWNER_PASSWORD }}
          TF_VAR_cockroach_push_password: ${{ secrets.COCKROACH_PUSH_PASSWORD }}
          TF_VAR_cockroach_read_password: ${{ secrets.COCKROACH_READ_PASSWORD }}
          COCKROACH_API_KEY: ${{ secrets.COCKROACH_API_KEY }}
        run: terraform apply -input=false -auto-approve -no-color
